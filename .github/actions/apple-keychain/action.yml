# Import the Developer ID Application certificate into a temporary keychain
# and pin METISTRY_SIGN_IDENTITY to its hash — the one signing setup every
# darwin release job shares (runtime-deps, the darwin runtime pack's TCC
# helpers, the app). Without the secrets it says so and sets ok=false; the
# caller decides what that means (skip the app; ship the pack unsigned).
#
# Why a composite action and not three copies: the keychain dance has four
# non-obvious lines (search list, partition list, hash-not-name) and each
# was learned from a hung or ambiguous build — docs/ops/apple-signing.md.
name: apple-keychain
description: import the Developer ID cert into a temp keychain and export METISTRY_SIGN_IDENTITY / METISTRY_KEYCHAIN
inputs:
  certificate-p12:
    description: base64 of the .p12 (secrets.APPLE_CERTIFICATE_P12); empty = no signing
    required: false
    default: ""
  certificate-password:
    description: the .p12 password (secrets.APPLE_CERTIFICATE_PASSWORD)
    required: false
    default: ""
outputs:
  ok:
    description: "'true' when an identity was imported and METISTRY_SIGN_IDENTITY is set"
    value: ${{ steps.gate.outputs.ok }}
  identity:
    description: the SHA-1 hash of the Developer ID Application identity ('' when none)
    value: ${{ steps.pin.outputs.identity }}
runs:
  using: composite
  steps:
    - id: gate
      shell: bash
      env:
        P12: ${{ inputs.certificate-p12 }}
        PW: ${{ inputs.certificate-password }}
      run: |
        if [ -n "$P12" ] && [ -n "$PW" ]; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "ok=false" >> "$GITHUB_OUTPUT"
          echo "::notice::APPLE_CERTIFICATE_P12/APPLE_CERTIFICATE_PASSWORD are not set — nothing in this job is signed under a Developer ID (docs/ops/apple-signing.md §4)"
        fi
    - if: steps.gate.outputs.ok == 'true'
      shell: bash
      env:
        P12: ${{ inputs.certificate-p12 }}
        PW: ${{ inputs.certificate-password }}
      run: |
        keychain="$RUNNER_TEMP/build.keychain-db"
        security create-keychain -p "$RUNNER_TEMP" "$keychain"
        security set-keychain-settings -lut 21600 "$keychain"
        security unlock-keychain -p "$RUNNER_TEMP" "$keychain"
        # codesign searches the keychain SEARCH LIST, not just the default —
        # so the temp keychain has to be on it, with login kept for anything
        # else the runner needs.
        security list-keychains -d user -s "$keychain" login.keychain-db
        security default-keychain -s "$keychain"
        echo "$P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
        security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$PW" -T /usr/bin/codesign -T /usr/bin/security
        rm -f "$RUNNER_TEMP/cert.p12"
        # Without this, codesign prompts for keychain access and hangs the job.
        security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" "$keychain"
        echo "METISTRY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
    - id: pin
      if: steps.gate.outputs.ok == 'true'
      shell: bash
      run: |
        # The HASH, not the display name: a keychain holding two valid certs
        # for one team (a renewal) has two byte-identical names and
        # `codesign -s "<name>"` fails with "ambiguous". The hash is unique.
        identity="$(security find-identity -v -p codesigning "$METISTRY_KEYCHAIN" | grep 'Developer ID Application' | head -1 | awk '{print $2}')"
        [ -n "$identity" ] || { echo "the imported .p12 has no Developer ID Application identity" >&2; exit 1; }
        echo "METISTRY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
        echo "identity=$identity" >> "$GITHUB_OUTPUT"
        echo "signing identity: $identity"

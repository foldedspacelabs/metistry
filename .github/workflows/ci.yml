# CI on Linux from day one (plan Phase 1): the container is where casing
# and portability bugs surface, not the Mac.
name: ci
on:
  push:
    branches: [main]
  pull_request:

# One run per PR (or per main push) at a time: a new push cancels the run it
# supersedes. Rebases and fix-ups were costing a full run each (2026-09-27:
# 100 runs in a day tripped the org's Actions spending limit).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # Which parts of the tree this push touches. The macOS job bills at 10x the
  # Linux rate, so it runs only when something it compiles or tests changed.
  changes:
    runs-on: ubuntu-latest
    outputs:
      macos: ${{ steps.diff.outputs.macos }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if ! git cat-file -e "$base" 2>/dev/null; then echo "macos=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          changed=$(git diff --name-only "$base" "${{ github.sha }}")
          echo "$changed" | sed 's/^/  /'
          if echo "$changed" | grep -qE '^(apps/macos/|\.github/workflows/ci\.yml|docs/product/design/tokens|ops/scripts/build-design-tokens)'; then
            echo "macos=true" >> "$GITHUB_OUTPUT"
          else
            echo "macos=false" >> "$GITHUB_OUTPUT"
          fi

  checks:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: metistry
          POSTGRES_USER: metistry
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metistry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - run: ops/scripts/check-path-case.sh
      - run: node ops/scripts/prompt-lint.mjs
      # R4: a cap that lives only as a literal is a decision nobody can change
      # without a release. Every limit-shaped constant is read from config or
      # annotated `// limit: fixed — <reason>`.
      - run: node ops/scripts/audit-limits.mjs
      - run: node ops/scripts/fold-product-record.mjs --check
      # A migration number is reserved to one file in db/migrations/README.md
      # before anyone writes it, so parallel tickets cannot collide on one (F-6).
      - run: node ops/scripts/check-migration-numbers.mjs
      # A test's only way into Postgres is testDb() (core/test-env), which
      # refuses anything but a metistry_test_* scratch database and checks
      # current_database(). A suite building its own pool walks around that,
      # so no test file may (docs/ops/testing.md).
      - run: node ops/scripts/check-test-db.mjs
      - name: ops/scripts unit tests
        run: node --test 'ops/scripts/test/*.test.mjs'
      # tokens.css, preview.html and the Mac app's design-tokens.swift are all
      # generated from tokens.json. This is what stops one of them drifting —
      # and it re-checks every declared colour pair against WCAG AA.
      - run: node ops/scripts/build-design-tokens.mjs --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@foldedspacelabs/*' run build
      # The definition-token budget the manifest schema states (>20 tools /
      # >5k tokens), for EVERY bridge rather than only the one whose own test
      # remembers to check it. Placed after the build because it measures each
      # bridge's real `tools/list` through the `toolSurface()` it ships, and
      # prints the per-bridge numbers so the headroom is visible on every run.
      - run: node ops/scripts/check-tool-surface.mjs
      - run: pnpm typecheck
      - name: migrations apply cleanly, twice (idempotence)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: |
          ops/scripts/migrate.sh
          ops/scripts/migrate.sh
      - name: tests (unit + integration against the migrated db)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: pnpm test
      # The Mac's fixtures (F-7) are what the real console says. Record every
      # served route again, in memory, and fail where a shape moved without its
      # fixture being re-recorded (the fix: `--only "<route>" --accept`, plan
      # §2.16). The recorder imports the console's dist, so the console and
      # what it depends on build first; it needs an empty scratch database, so
      # test-db.sh makes a fresh one of its own.
      - name: client fixtures match the console (recorder --check)
        env:
          METISTRY_DB_PASSWORD: ci-only
          METISTRY_TEST_DB_NAME: metistry_test_fixtures
        run: |
          pnpm --filter '@metistry-apps/console...' run build
          ops/scripts/test-db.sh
          node apps/console/scripts/record-client-fixtures.mjs --check

  # The Mac app cannot rot silently between releases: it compiles and its unit
  # tests run on every PR. Deliberately small — no signing, no bundle assembly,
  # no DMG (that is the release workflow's `macos-app` job, which needs the
  # Developer ID cert and a runner minute budget this does not). SwiftPM's build
  # tree is cached on Package.resolved, so Sparkle's binary artifact is fetched
  # once per pin rather than once per run.
  #
  # macos-15, not macos-14: the macos-14 image's default Xcode is 15.4, whose
  # Swift is 5.10, and it refuses the package outright —
  #   error: package 'macos' is using Swift tools version 6.0.0 but the
  #   installed version is 5.10.0
  # The app itself still targets macOS 14 (Package.swift's `platforms:` sets
  # minos 14.0); this is the toolchain that builds it, not the floor it runs on.
  macos-app:
    needs: changes
    if: needs.changes.outputs.macos == 'true'
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: apps/macos/.build
          key: swiftpm-macos-15-${{ hashFiles('apps/macos/Package.resolved') }}-${{ hashFiles('apps/macos/sources/**', 'apps/macos/tests/**') }}
          restore-keys: |
            swiftpm-macos-15-${{ hashFiles('apps/macos/Package.resolved') }}-
      - run: swift --version
      # --disable-automatic-resolution: Package.resolved is the pin, and CI must
      # fail on a stale one rather than quietly resolving something else.
      - run: swift build --package-path apps/macos --disable-automatic-resolution
      - run: swift test --package-path apps/macos --disable-automatic-resolution

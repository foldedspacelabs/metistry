# Cutting a release: tag `vX.Y.Z` on main after `pnpm release:version`.
# Code flows downward as releases, never as git merges (plan §4.16), so
# this workflow produces every artifact an install can consume:
#
#   metistry-runtime-<version>-<os>-<arch>.tar.gz   the built product; what
#                                                   `metistry update` downloads
#   metistry-runtime-deps-<version>-darwin-arm64.tar.gz
#                                                   the bundled runtime: Node,
#                                                   Postgres 17 + pgvector, git
#                                                   (docs/ops/bundled-runtime.md)
#   Metistry-<version>.dmg                          the Mac app: SwiftUI front end
#                                                   for the CLI, with both packs
#                                                   embedded, Developer ID signed,
#                                                   notarized and stapled
#   appcast.xml                                     the EdDSA-signed Sparkle feed
#                                                   the installed app reads
#   checksums.txt                                   sha256 of every asset
#   npm  @foldedspacelabs/metistry-*                Trusted Publishing (OIDC)
#   ghcr.io/foldedspacelabs/metistry-<app>:<version> console, assistant, reconciler
#
# Runbook, secrets and the exact tarball contents: docs/ops/releases.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Assets are built and uploaded to the matching release if it exists."
        required: true

# Least privilege: read-only by default; the three jobs that need more say so
# themselves (npm: id-token, images: packages, publish: contents).
permissions:
  contents: read

# Two controls live in the GitHub UI, not here (docs/ops/going-public.md):
# - a tag ruleset on `v*` — only the owner may create or move a release tag,
#   so nobody else can start this workflow with a push;
# - the `release` environment, with the owner as required reviewer, holding
#   APPLE_* and SPARKLE_PRIVATE_KEY. The four jobs that sign or notarize
#   declare `environment: release`, so they wait for that approval and are
#   the only jobs that can read those secrets.

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/metistry

jobs:
  # The same gate CI runs, against the tagged tree: a release is never
  # published from something that has not passed the Linux checks.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: metistry
          POSTGRES_USER: metistry
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metistry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - id: v
        name: the version is the tag, and every package.json must already carry it
        run: |
          if [ -n "${{ inputs.version }}" ]; then version="${{ inputs.version }}"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          root="$(node -p 'require("./package.json").version')"
          cli="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$root" != "$version" ] || [ "$cli" != "$version" ]; then
            echo "tag $version but package.json is $root and packages/cli is $cli — run: pnpm release:version" >&2
            exit 1
          fi
      - run: ops/scripts/check-path-case.sh
      - run: node ops/scripts/fold-product-record.mjs --check
      # npm provenance refuses a package whose repository.url is not this repo
      - run: node ops/scripts/check-package-metadata.mjs
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@foldedspacelabs/*' run build
      - run: pnpm typecheck
      - run: node ops/scripts/sync-root-version.mjs --check
      - name: migrations apply cleanly, twice (idempotence)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: |
          ops/scripts/migrate.sh
          ops/scripts/migrate.sh
      - name: tests (unit + integration against the migrated db)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: pnpm test

  # The runtime pack, one per os-arch: it carries production node_modules
  # (and, on darwin, the signed TCC helper binaries), so it is not portable.
  runtime:
    needs: verify
    environment: release   # signs the TCC helpers (APPLE_CERTIFICATE_*)
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          # macos-26, not macos-14/15: the apple-fm helper imports FoundationModels
          # and guards on macOS 26.4, so it needs the 26.4 SDK (Xcode 26.4+), which
          # only the macos-26 image carries (macos-15 tops out at Xcode 26.3).
          # The helpers pin their own deployment targets, so the SDK the runner
          # builds with is not the floor they run on.
          - { os: macos-26, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      # The Seatbelt profiles ship in this pack; a profile that cannot listen
      # where it says it may (0.14.2's reconciler.sb on macOS 26) never ships
      # again. macOS only — sandbox-exec does not exist elsewhere.
      - if: matrix.target == 'darwin-arm64'
        name: sandbox profiles listen where they say (macOS 26)
        run: node --test 'ops/sandbox/*.test.mjs'
      # The Swift TCC helpers (calendar, apple-fm) ship in the darwin pack as
      # signed app bundles, so a release install has something for `metistry
      # up` to pin its bridges at (packages/cli/src/tcc-pin.ts). Signed under
      # the Developer ID when the secrets are set: TCC keys a grant on
      # identifier + certificate chain, so a helper the release built keeps
      # the grant a checkout's build earned (docs/ops/apple-signing.md §3).
      # Without the cert they are built ad-hoc — the grant then rots on the
      # next release, which is still better than no helper at all.
      - if: matrix.target == 'darwin-arm64'
        uses: ./.github/actions/apple-keychain
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - if: matrix.target == 'darwin-arm64'
        name: build + sign the TCC helper bundles
        run: pnpm -r --if-present run build:helper
      - name: pack the runtime
        run: ops/release/pack-runtime.sh "${{ needs.verify.outputs.version }}" "${{ matrix.target }}" "$GITHUB_WORKSPACE/dist-release"
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-${{ matrix.target }}
          path: dist-release/metistry-runtime-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The BUNDLED RUNTIME: Node, Postgres 17 + pgvector, git and llama.cpp's
  # llama-server, built as a relocatable tree and shipped as its own asset
  # (docs/ops/bundled-runtime.md). macOS arm64 only — it is what the Mac app
  # embeds, and Linux hosts run the compose shape. The source builds are cached
  # by version, so only a versions bump pays for them again; assembling,
  # signing and the moved-copy verification always run. `cmake` (llama.cpp is a
  # CMake project) is on the macos-14 image; the script refuses with a
  # remediation rather than half-building if it ever is not.
  runtime-deps:
    name: runtime-deps (darwin-arm64)
    needs: verify
    environment: release   # signs the bundled binaries (APPLE_CERTIFICATE_*)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - name: cache the Postgres, git and llama.cpp source builds, keyed on the pinned versions
        uses: actions/cache@v6
        with:
          path: .runtime-build/cache
          key: runtime-deps-darwin-arm64-${{ hashFiles('ops/release/runtime-versions.env') }}
      # Signed under the Developer ID when the secrets are set, so a pack
      # installed by `metistry update` (no app, no DMG) carries Node, Postgres,
      # git and llama-server under Folded Space Labs — the Login Item is then
      # attributed to us rather than to the Node.js Foundation. Node keeps its
      # JIT entitlements minus get-task-allow (build-runtime-deps.sh sign()).
      # Without the secrets the pack is unsigned, as before, and the DMG job
      # re-signs whatever it embeds either way (ops/release/build-app.sh).
      - uses: ./.github/actions/apple-keychain
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - name: build runtime/ (signed when a Developer ID is present; verified from a MOVED copy before it is packed)
        run: ops/release/build-runtime-deps.sh
      - name: pack metistry-runtime-deps-<version>-darwin-arm64.tar.gz (+ .sha256)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          asset="metistry-runtime-deps-${VERSION}-darwin-arm64.tar.gz"
          mkdir -p dist-release
          # a single top-level `runtime/`: `metistry update` unpacks it with
          # `tar -C <product-dir>`, so it lands as <product-dir>/runtime/
          tar -czf "dist-release/$asset" -C "$GITHUB_WORKSPACE" runtime
          ( cd dist-release && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256" )
          ls -lh dist-release
          cat runtime/manifest.json | head -20
      - uses: actions/upload-artifact@v7
        with:
          name: runtime-deps-darwin-arm64
          path: dist-release/metistry-runtime-deps-*
          if-no-files-found: error

  # npm, via Trusted Publishing (OIDC) — no token anywhere, repo or run log.
  # Each package is configured once on npmjs.com (Settings -> Trusted
  # Publishing: org/user foldedspacelabs, repo metistry, workflow
  # release.yml — docs/ops/releases.md, "Publishing to npm", has the
  # one-time bootstrap a package needs before that page will let you).
  # Skipped (not failed) for a package that isn't configured yet, or on a
  # fork: the registry 404s/403s the publish and this job says so rather
  # than failing the release. A version already on the registry is skipped
  # too, so a re-run is safe. Anything else — E422 above all, which is npm
  # refusing the provenance bundle (v0.15.0: no `repository` in package.json)
  # — FAILS the job, after trying every package, so it cannot pass as a skip.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          # Trusted Publishing needs Node >= 22.14 and npm CLI >= 11.5.1
          # (the latter installed explicitly below — the npm bundled with
          # setup-node's Node is older).
          node-version: ">=22.14.0"
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@foldedspacelabs/*' run build
      - name: publish @foldedspacelabs/metistry-*
        id: publish
        run: |
          # Provenance needs a *public* repo — npm refuses it from a private
          # one even for a publicly-scoped package. This flips on by itself
          # the day the repo goes public; until then it's silently omitted.
          provenance_flag=""
          if [ "${{ github.event.repository.private }}" = "false" ]; then
            provenance_flag="--provenance"
          fi
          pack_dir="$RUNNER_TEMP/npm-pack"
          mkdir -p "$pack_dir"
          published_any=false
          failed=""
          for dir in packages/*/; do
            name="$(node -p "(()=>{try{const p=require('./${dir}package.json');return (!p.private && p.name && p.name.startsWith('@foldedspacelabs/metistry-')) ? p.name : '';}catch{return '';}})()")"
            [ -z "$name" ] && continue
            version="$(node -p "require('./${dir}package.json').version")"
            echo "== $name@$version =="
            # Already on the registry (a re-run, or a partial earlier run):
            # nothing to do. A 404 here just means "not yet" — publish it.
            if [ "$(npm view "$name@$version" version 2>/dev/null)" = "$version" ]; then
              echo "::notice::$name@$version is already on npm — skipped"
              continue
            fi
            # `pnpm pack` rewrites workspace:* deps to real versions in the
            # packed manifest; `npm publish` then does the actual registry
            # call so it is npm's own OIDC exchange that authenticates it,
            # not pnpm's.
            tarball="$(cd "$dir" && pnpm pack --json --pack-destination "$pack_dir" | node -e 'let d="";process.stdin.on("data",c=>d+=c);process.stdin.on("end",()=>console.log(JSON.parse(d).filename))')"
            set +e
            npm publish "$tarball" --access public $provenance_flag 2>&1 | tee /tmp/npm-publish.log
            status="${PIPESTATUS[0]}"
            set -e
            if [ "$status" -ne 0 ]; then
              # Tolerated: E404 / E403 (no trusted publisher configured for this
              # package yet, or a fork), E409 (a concurrent publish won the race).
              # NOT tolerated: E422 (provenance or manifest rejected) and every
              # other error — those are ours to fix, and a skip would hide them.
              if grep -qE 'code E40[349]\b' /tmp/npm-publish.log && ! grep -qE 'code E422\b' /tmp/npm-publish.log; then
                echo "::notice::npm publish skipped for $name — trusted publishing isn't configured for it yet, or the version already exists (see the log above; docs/ops/releases.md, \"Publishing to npm\", has the setup). The release's other assets are unaffected."
                continue
              fi
              echo "::error::npm publish FAILED for $name@$version (exit $status) — see the log above. E422 is npm refusing the provenance bundle: check the package.json \`repository\` (docs/ops/releases.md, \"Publishing to npm\")."
              failed="${failed:+$failed }$name"
              continue
            fi
            published_any=true
          done
          echo "published=$published_any" >> "$GITHUB_OUTPUT"
          if [ -n "$failed" ]; then
            echo "::error::npm publish failed for: $failed"
            exit 1
          fi

  # Container images for the apps that ship as images. The watchdog is a
  # host job under launchd (runs_on: host) and has no Dockerfile — it ships
  # inside the runtime pack, not as an image.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [console, assistant, reconciler]
    # every matrix instance logs in with the same credentials, so they agree
    # on this value; whichever instance finishes last is the one GitHub keeps.
    outputs:
      published: ${{ steps.login.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7
      # linux/arm64 is the Mac (Apple silicon) host under Docker Desktop and
      # the arm64 cloud shapes; amd64 is everything else. Without QEMU the
      # build is host-arch only and `docker compose pull` on a Mac fails with
      # "no matching manifest for linux/arm64/v8".
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - id: login
        name: log in to ghcr (skipped without packages:write)
        continue-on-error: true
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.login.outcome != 'success'
        run: echo "::notice::could not log in to ghcr.io — skipping the ${{ matrix.app }} image (a fork without packages:write still gets a complete release)"
      - if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          provenance: true

  # The macOS app: Metistry.app assembled by ops/release/build-app.sh, with the
  # runtime pack and the bundled runtime embedded as Contents/Resources/metistry/,
  # signed with the Developer ID cert, notarized and stapled, shipped as a DMG.
  #
  # Skipped, not failed, without the signing secrets — the same courtesy the
  # `images` job extends a fork without packages:write. `secrets` is not
  # available in a job-level `if`, so the gate is the first step and everything
  # after it is conditional on its output.
  # macos-15, not macos-14: macos-14's default Xcode is 15.4 / Swift 5.10, which
  # refuses `swift-tools-version: 6.0` outright. The app still targets macOS 14 —
  # Package.swift's `platforms:` sets minos 14.0 — so this is the toolchain that
  # builds it, not the floor it runs on. (ci.yml's macos-app job says the same.)
  macos-app:
    name: macOS app DMG
    needs: [verify, runtime, runtime-deps]
    environment: release   # signs and notarizes (APPLE_*)
    runs-on: macos-15
    outputs:
      built: ${{ steps.gate.outputs.ok }}
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        uses: ./.github/actions/apple-keychain
        with:
          certificate-p12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      - if: steps.gate.outputs.ok != 'true'
        run: echo "::notice::skipping the macOS app — no Developer ID certificate. The release's other assets are unaffected. (docs/ops/apple-signing.md §4)"

      # The packs this run already built — the app embeds them rather than
      # rebuilding the product a second time.
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-darwin-arm64
          path: packs
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: runtime-deps-darwin-arm64
          path: packs

      - if: steps.gate.outputs.ok == 'true'
        name: build, sign and package Metistry-${{ needs.verify.outputs.version }}.dmg
        run: |
          ops/release/build-app.sh \
            --version "$VERSION" \
            --runtime "packs/metistry-runtime-$VERSION-darwin-arm64.tar.gz" \
            --runtime-deps "packs/metistry-runtime-deps-$VERSION-darwin-arm64.tar.gz" \
            --out dist-app
          ls -lh dist-app
          codesign -dv --verbose=2 "dist-app/Metistry.app" 2>&1 | grep -E "Identifier|Authority|Format|TeamIdentifier|Runtime"

      - if: steps.gate.outputs.ok == 'true'
        name: notarize and staple (App Store Connect API key — not an Apple ID)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ]; then
            echo "::notice::APPLE_API_KEY_P8 is not set — the DMG is signed but NOT notarized. Gatekeeper will refuse it on a machine that has not seen it before (docs/ops/apple-signing.md §4)."
            exit 0
          fi
          if ! ops/release/notarize.sh "dist-app/Metistry-$VERSION.dmg"; then
            echo "::error::notarization FAILED — no DMG this run, and the \`publish\` job holds the release as a draft rather than publish it without one (an immutable release can never gain the DMG later). Fix the cause above — \`invalidPrivateKeyContents\` means APPLE_API_KEY_P8 is not a .p8 key (docs/ops/releases.md, \"Secrets\") — then use \"Re-run failed jobs\" on this run."
            exit 1
          fi

      - if: steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-app
          path: dist-app/Metistry-*.dmg
          if-no-files-found: error

  # The Sparkle feed the app reads. ops/release/appcast.mjs refuses to emit an
  # unsigned feed, so a missing or wrong SPARKLE_PRIVATE_KEY fails this job
  # rather than publishing something every installed app would reject.
  #
  # One item, not `generate_appcast`: that tool walks a directory of past
  # updates, and this project's updates live on GitHub Releases, one DMG per
  # tag. `sign_update` over the DMG plus appcast.mjs is the same signature with
  # nothing to keep in sync.
  appcast:
    name: Sparkle appcast
    needs: [verify, macos-app]
    if: needs['macos-app'].outputs.built == 'true'
    environment: release   # signs the feed (SPARKLE_PRIVATE_KEY)
    runs-on: macos-14
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: gate
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          if [ -n "$SPARKLE_PRIVATE_KEY" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice::SPARKLE_PRIVATE_KEY is not set — no appcast.xml this run, so installed apps will not see this version as an update. The DMG is still published (docs/ops/apple-signing.md §5)."
          fi
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/download-artifact@v8
        with:
          name: macos-app
          path: dist-app
      # Pins + verifies Sparkle's CLI tools against ops/release/runtime-versions.env
      # (the Homebrew cask is disabled — fails Gatekeeper, 2026-09-01).
      - if: steps.gate.outputs.ok == 'true'
        run: ops/release/fetch-sparkle-tools.sh
      - if: steps.gate.outputs.ok == 'true'
        name: sign the DMG and render appcast.xml
        env:
          # The EdDSA private key lives ONLY here — never in the repo, never in
          # an artifact, never in a log. `sign_update -f -` reads it from stdin
          # so it never touches disk either. The matching public key is
          # committed as SUPublicEDKey in apps/macos/resources/Info.plist and as
          # SPARKLE_PUBLIC_ED_KEY in ops/release/runtime-versions.env.
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          dmg="dist-app/Metistry-$VERSION.dmg"
          sig="$(printf '%s' "$SPARKLE_PRIVATE_KEY" | ops/release/.tools/sparkle/bin/sign_update -f - "$dmg" | sed -n 's/.*sparkle:edSignature="\([^"]*\)".*/\1/p')"
          [ -n "$sig" ] || { echo "sign_update produced no signature" >&2; exit 1; }
          node ops/release/appcast.mjs "$VERSION" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Metistry-$VERSION.dmg" \
            --length "$(stat -f%z "$dmg")" \
            --signature "$sig" \
            --min-system 14.0 \
            --feed-url "https://github.com/${{ github.repository }}/releases/latest/download/appcast.xml" \
            --notes "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" > appcast.xml
          cat appcast.xml
      - if: steps.gate.outputs.ok == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: appcast
          path: appcast.xml
          if-no-files-found: error

  # checksums.txt, the generated changelog, and the release itself.
  publish:
    needs: [verify, runtime, runtime-deps, npm, images, macos-app, appcast]
    if: always() && needs.verify.result == 'success' && needs.runtime.result == 'success' && needs['runtime-deps'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22 }
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: runtime-*
          merge-multiple: true
      # The DMG and the appcast, when this run produced them. Both jobs skip
      # cleanly without their secrets, so a missing artifact is a normal
      # outcome, not a failure — `continue-on-error` is what says that.
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: assets
          pattern: macos-app
          merge-multiple: true
      - uses: actions/download-artifact@v8
        continue-on-error: true
        with:
          path: assets
          pattern: appcast
          merge-multiple: true
      # sha256 of EVERY asset, the DMG and appcast.xml included: `metistry
      # update` verifies the runtime packs against this file, and a reader
      # verifying a DMG by hand should not have to guess.
      - name: checksums.txt (sha256 of every asset)
        working-directory: assets
        run: sha256sum * | tee checksums.txt
      - name: release notes from the changesets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          assets="$(cd assets && ls | paste -sd, -)"
          images="$(for a in console assistant reconciler; do echo "${IMAGE_PREFIX}-$a:${VERSION}"; done | paste -sd, -)"
          node ops/release/changelog.mjs "$VERSION" --assets "$assets" --images "$images" | tee RELEASE_NOTES.md
      - name: record which of npm/images this run actually published
        env:
          NPM_PUBLISHED: ${{ needs.npm.outputs.published }}
          NPM_RESULT: ${{ needs.npm.result }}
          IMAGES_PUBLISHED: ${{ needs.images.outputs.published }}
        run: |
          if [ "$NPM_RESULT" = "failure" ]; then
            echo "::warning::the npm job failed — some @foldedspacelabs/metistry-* packages may be missing this version (see that job's ::error::s)"
          fi
          parts=""
          [ "$NPM_PUBLISHED" = "true" ] && parts="${parts:+$parts, }npm"
          [ "$IMAGES_PUBLISHED" = "true" ] && parts="${parts:+$parts, }images"
          {
            echo ""
            if [ -n "$parts" ]; then
              echo "**Published:** $parts"
            else
              echo "**Published:** neither npm nor images this run — see the run's \`::notice::\`s for why"
            fi
          } >> RELEASE_NOTES.md
      # Immutable releases are ON for this repo: once a release is published
      # its assets and tag are frozen, and a deleted release's tag name can
      # never be used again. So the release is created as a DRAFT carrying
      # every asset, and only then published. Re-runs:
      #   - a draft (an earlier attempt held or interrupted): assets are
      #     re-uploaded (--clobber), then it is published;
      #   - a published immutable release that already has every asset: only
      #     the notes are refreshed (notes and title stay editable);
      #   - a published immutable release MISSING assets: this fails with the
      #     remedy — nothing can be added to it; cut the next patch version;
      #   - a published release with immutability off: the old edit + upload.
      # A macOS app or appcast job that FAILED (as opposed to skipped for want
      # of secrets) holds the release as a draft, so fixing the secret and
      # "Re-run failed jobs" completes it rather than shipping it without the DMG.
      - name: create the release as a draft with every asset, then publish it
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
          MACOS_APP_RESULT: ${{ needs['macos-app'].result }}
          APPCAST_RESULT: ${{ needs.appcast.result }}
        run: |
          tag="v${VERSION}"
          hold=""
          [ "$MACOS_APP_RESULT" = "failure" ] && hold="the macOS app job failed (no Metistry-${VERSION}.dmg)"
          [ "$APPCAST_RESULT" = "failure" ] && hold="${hold:+$hold; }the Sparkle appcast job failed (no appcast.xml)"

          draft=""
          if gh release view "$tag" --json isDraft >/dev/null 2>&1; then
            draft="$(gh release view "$tag" --json isDraft --jq .isDraft)"
          fi

          if [ -z "$draft" ]; then
            # --verify-tag: never create the tag here; the owner's push made it.
            gh release create "$tag" assets/* --draft --verify-tag \
              --title "Metistry ${VERSION}" --notes-file RELEASE_NOTES.md
          elif [ "$draft" = "true" ]; then
            echo "::notice::$tag exists as a draft — refreshing its notes and assets"
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" assets/* --clobber
          else
            immutable="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/$tag" --jq '.immutable // false')"
            if [ "$immutable" = "true" ]; then
              have="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
              missing="$(cd assets && ls | sort | comm -23 - <(printf '%s\n' "$have"))"
              if [ -n "$missing" ]; then
                echo "::error::$tag is already PUBLISHED as an immutable release and is missing: $(printf '%s\n' "$missing" | paste -sd' ' -). GitHub will not add assets to it, and a deleted immutable release's tag can never be reused — so this version cannot be repaired. Cut the next patch version instead (docs/ops/releases.md, \"Re-running a release\"). Optionally delete this release (gh release delete $tag, keeping the tag) so 'latest' points back at a complete release."
                exit 1
              fi
              gh release edit "$tag" --notes-file RELEASE_NOTES.md
              echo "::notice::$tag is already published with every asset — notes refreshed, nothing else to do"
              exit 0
            fi
            # immutability off: the release is mutable, so edit it in place
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
            gh release upload "$tag" assets/* --clobber
            [ -n "$hold" ] && echo "::warning::$tag was already published, so it stays published without: $hold"
            exit 0
          fi

          if [ -n "$hold" ]; then
            echo "::error::$tag is a DRAFT and was NOT published: $hold. Publishing now would freeze an immutable release without it. Fix the failing job's cause (its ::error:: says what), then \"Re-run failed jobs\" on this run — this job re-runs and publishes the draft. To ship without it instead: gh release edit $tag --draft=false"
            exit 1
          fi
          gh release edit "$tag" --draft=false
          echo "published $tag with: $(cd assets && ls | paste -sd' ' -)"

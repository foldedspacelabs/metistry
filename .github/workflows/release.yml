# Cutting a release: tag `vX.Y.Z` on main after `pnpm release:version`.
# Code flows downward as releases, never as git merges (plan §4.16), so
# this workflow produces every artifact an install can consume:
#
#   metistry-runtime-<version>-<os>-<arch>.tar.gz   the built product; what
#                                                   `metistry update` downloads
#   metistry-runtime-deps-<version>-darwin-arm64.tar.gz
#                                                   the bundled runtime: Node,
#                                                   Postgres 17 + pgvector, git
#                                                   (docs/ops/bundled-runtime.md)
#   checksums.txt                                   sha256 of every asset
#   npm  @foldedspacelabs/metistry-*                with provenance
#   ghcr.io/foldedspacelabs/metistry-<app>:<version> console, assistant, reconciler
#
# Runbook, secrets and the exact tarball contents: docs/ops/releases.md.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build (no leading v). Assets are built and uploaded to the matching release if it exists."
        required: true

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/metistry

jobs:
  # The same gate CI runs, against the tagged tree: a release is never
  # published from something that has not passed the Linux checks.
  verify:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    services:
      db:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_DB: metistry
          POSTGRES_USER: metistry
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U metistry"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: the version is the tag, and every package.json must already carry it
        run: |
          if [ -n "${{ inputs.version }}" ]; then version="${{ inputs.version }}"; else version="${GITHUB_REF_NAME#v}"; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          root="$(node -p 'require("./package.json").version')"
          cli="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "$root" != "$version" ] || [ "$cli" != "$version" ]; then
            echo "tag $version but package.json is $root and packages/cli is $cli — run: pnpm release:version" >&2
            exit 1
          fi
      - run: ops/scripts/check-path-case.sh
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@foldedspacelabs/*' run build
      - run: pnpm typecheck
      - run: node ops/scripts/sync-root-version.mjs --check
      - name: migrations apply cleanly, twice (idempotence)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: |
          ops/scripts/migrate.sh
          ops/scripts/migrate.sh
      - name: tests (unit + integration against the migrated db)
        env:
          METISTRY_DB_PASSWORD: ci-only
        run: pnpm test

  # The runtime pack, one per os-arch: it carries production node_modules
  # (and, on darwin, the signed TCC helper binaries), so it is not portable.
  runtime:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: macos-14, target: darwin-arm64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: pack the runtime
        run: ops/release/pack-runtime.sh "${{ needs.verify.outputs.version }}" "${{ matrix.target }}" "$GITHUB_WORKSPACE/dist-release"
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-${{ matrix.target }}
          path: dist-release/metistry-runtime-${{ needs.verify.outputs.version }}-${{ matrix.target }}.tar.gz
          if-no-files-found: error

  # The BUNDLED RUNTIME: Node, Postgres 17 + pgvector and git, built as a
  # relocatable tree and shipped as its own asset (docs/ops/bundled-runtime.md).
  # macOS arm64 only — it is what the Mac app embeds, and Linux hosts run the
  # compose shape. The Postgres and git source builds are cached by version, so
  # only a versions bump pays for them again; assembling, signing and the
  # moved-copy verification always run.
  runtime-deps:
    name: runtime-deps (darwin-arm64)
    needs: verify
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: cache the Postgres and git source builds, keyed on the pinned versions
        uses: actions/cache@v4
        with:
          path: .runtime-build/cache
          key: runtime-deps-darwin-arm64-${{ hashFiles('ops/release/runtime-versions.env') }}
      - name: build runtime/ (verified from a MOVED copy before it is packed)
        env:
          # unset until the Developer ID cert reaches CI (docs/ops/apple-signing.md);
          # the script skips signing rather than failing when it is empty
          METISTRY_SIGN_IDENTITY: ${{ secrets.APPLE_SIGN_IDENTITY }}
        run: ops/release/build-runtime-deps.sh
      - name: pack metistry-runtime-deps-<version>-darwin-arm64.tar.gz (+ .sha256)
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          asset="metistry-runtime-deps-${VERSION}-darwin-arm64.tar.gz"
          mkdir -p dist-release
          # a single top-level `runtime/`: `metistry update` unpacks it with
          # `tar -C <product-dir>`, so it lands as <product-dir>/runtime/
          tar -czf "dist-release/$asset" -C "$GITHUB_WORKSPACE" runtime
          ( cd dist-release && shasum -a 256 "$asset" > "$asset.sha256" && cat "$asset.sha256" )
          ls -lh dist-release
          cat runtime/manifest.json | head -20
      - uses: actions/upload-artifact@v4
        with:
          name: runtime-deps-darwin-arm64
          path: dist-release/metistry-runtime-deps-*
          if-no-files-found: error

  # npm, with provenance. Skipped (not failed) without NPM_TOKEN: a fork
  # cuts releases without publishing to a scope it does not own.
  npm:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    outputs:
      published: ${{ steps.publish.outputs.published }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@foldedspacelabs/*' run build
      - name: publish @foldedspacelabs/metistry-*
        id: publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::npm publish skipped — NPM_TOKEN is not set (the release's other assets are unaffected)"
            echo "published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          pnpm publish --filter '@foldedspacelabs/*' --access public --no-git-checks --provenance 2>&1 | tee /tmp/npm-publish.log
          status="${PIPESTATUS[0]}"
          set -e
          if [ "$status" -ne 0 ]; then
            if grep -qE 'code E40[0-9]|HTTP 4[0-9]{2}' /tmp/npm-publish.log; then
              echo "::notice::npm publish skipped — the registry rejected it with a 4xx (see the log above for which package/status; the release's other assets are unaffected)"
              echo "published=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            exit "$status"
          fi
          echo "published=true" >> "$GITHUB_OUTPUT"

  # Container images for the apps that ship as images. The watchdog is a
  # host job under launchd (runs_on: host) and has no Dockerfile — it ships
  # inside the runtime pack, not as an image.
  images:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        app: [console, assistant, reconciler]
    # every matrix instance logs in with the same credentials, so they agree
    # on this value; whichever instance finishes last is the one GitHub keeps.
    outputs:
      published: ${{ steps.login.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - id: login
        name: log in to ghcr (skipped without packages:write)
        continue-on-error: true
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - if: steps.login.outcome != 'success'
        run: echo "::notice::could not log in to ghcr.io — skipping the ${{ matrix.app }} image (a fork without packages:write still gets a complete release)"
      - if: steps.login.outcome == 'success'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:${{ needs.verify.outputs.version }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.app }}:latest
          provenance: true

  # checksums.txt, the generated changelog, and the release itself.
  publish:
    needs: [verify, runtime, runtime-deps, npm, images]
    if: always() && needs.verify.result == 'success' && needs.runtime.result == 'success' && needs['runtime-deps'].result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with:
          path: assets
          pattern: runtime-*
          merge-multiple: true
      - name: checksums.txt (sha256 of every asset)
        working-directory: assets
        run: sha256sum * | tee checksums.txt
      - name: release notes from the changesets
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          assets="$(cd assets && ls | paste -sd, -)"
          images="$(for a in console assistant reconciler; do echo "${IMAGE_PREFIX}-$a:${VERSION}"; done | paste -sd, -)"
          node ops/release/changelog.mjs "$VERSION" --assets "$assets" --images "$images" | tee RELEASE_NOTES.md
      - name: record which of npm/images this run actually published
        env:
          NPM_PUBLISHED: ${{ needs.npm.outputs.published }}
          IMAGES_PUBLISHED: ${{ needs.images.outputs.published }}
        run: |
          parts=""
          [ "$NPM_PUBLISHED" = "true" ] && parts="${parts:+$parts, }npm"
          [ "$IMAGES_PUBLISHED" = "true" ] && parts="${parts:+$parts, }images"
          {
            echo ""
            if [ -n "$parts" ]; then
              echo "**Published:** $parts"
            else
              echo "**Published:** neither npm nor images this run — see the run's \`::notice::\`s for why"
            fi
          } >> RELEASE_NOTES.md
      - name: create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --notes-file RELEASE_NOTES.md
          else
            gh release create "$tag" --title "Metistry ${VERSION}" --notes-file RELEASE_NOTES.md
          fi
          gh release upload "$tag" assets/* --clobber

  # ---- stubs: enabled when the macOS app exists -------------------------------
  #
  # There is no app to build yet (docs/product/desktop-app-plan.md). These
  # two jobs are deliberately disabled rather than absent, so the shape of
  # the work — and the secrets it needs — is on the record.
  macos-app:
    name: macOS app DMG (STUB — no app yet)
    needs: [verify, publish]
    if: false
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - name: import the Developer ID cert into a temporary keychain
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          security create-keychain -p "$RUNNER_TEMP" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$RUNNER_TEMP" build.keychain
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode -o "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$RUNNER_TEMP" build.keychain
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: derive METISTRY_SIGN_IDENTITY from the imported cert
        run: |
          identity="$(security find-identity -v -p codesigning build.keychain | grep 'Developer ID Application' | head -1 | sed -E 's/.*"(.*)"/\1/')"
          echo "METISTRY_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"
      - name: xcodebuild archive (hardened runtime), embedding the runtime pack as Contents/Resources/metistry/
        run: |
          echo "TODO: xcodebuild archive -project Metistry.xcodeproj -scheme Metistry -archivePath Metistry.xcarchive DEVELOPMENT_TEAM=\"$APPLE_TEAM_ID\" CODE_SIGN_IDENTITY=\"$METISTRY_SIGN_IDENTITY\", once the Xcode project exists"
      - name: create the DMG and codesign it with METISTRY_SIGN_IDENTITY
        run: |
          echo "TODO: codesign --force --options runtime --timestamp --sign \"$METISTRY_SIGN_IDENTITY\" Metistry-$VERSION.dmg"
      - name: notarize (App Store Connect API key — not an Apple ID)
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          echo "$APPLE_API_KEY_P8" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"
          xcrun notarytool submit "Metistry-$VERSION.dmg" \
            --key "$RUNNER_TEMP/AuthKey.p8" --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" --wait
          rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: staple and upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          xcrun stapler staple "Metistry-$VERSION.dmg"
          gh release upload "v$VERSION" "Metistry-$VERSION.dmg" --clobber

  appcast:
    name: Sparkle appcast (STUB — needs the DMG)
    needs: [verify, macos-app]
    if: false
    runs-on: macos-14
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.verify.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      # Real today (not a stub): pins + verifies Sparkle's CLI tools
      # (docs/ops/apple-signing.md §5) so sign_update is on disk the moment
      # this job's `if: false` is flipped — one line, already run.
      - run: ops/release/fetch-sparkle-tools.sh
      # The EdDSA private key lives ONLY in secrets.SPARKLE_PRIVATE_KEY —
      # never in the repo, never in an artifact, never in a log. The
      # matching public key is secrets.SPARKLE_PUBLIC_ED_KEY (also committed,
      # unsigned, to the SwiftUI app's Info.plist as SUPublicEDKey once that
      # target exists — it is not sensitive, but keeping it in secrets too
      # means CI never has to read it out of a checked-out Xcode project).
      #
      # ops/release/appcast.mjs is real and tested today; without a
      # signature it refuses to emit a feed, so a misconfigured secret fails
      # this job instead of shipping a feed the app rejects.
      - name: sign the DMG and generate the appcast
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          sig=$(echo "$SPARKLE_PRIVATE_KEY" | ops/release/.tools/sparkle/bin/sign_update -f - "Metistry-$VERSION.dmg")
          node ops/release/appcast.mjs "$VERSION" \
            --url "https://github.com/${{ github.repository }}/releases/download/v$VERSION/Metistry-$VERSION.dmg" \
            --length "$(stat -f%z "Metistry-$VERSION.dmg")" \
            --signature "$sig" --min-system 13.0 \
            --notes "https://github.com/${{ github.repository }}/releases/tag/v$VERSION" > appcast.xml
      - name: upload the appcast
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "v$VERSION" appcast.xml --clobber

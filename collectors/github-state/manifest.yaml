schema: 1
name: github-state
type: collector
display_name: GitHub
description: "Reconcile open issues/PRs from configured repos into the work table (§4.8 — collectors reconcile status from the source; nothing invents it), with each PR's head SHA and open review threads, raise a pull request request for each PR waiting on your review — cleared when your review lands, the PR goes to draft, or it closes — and a task request for each open issue assigned to you, cleared when it closes or is reassigned. Reads only: the token is sent to api.github.com in GETs and GraphQL queries, never a write; posting a review is the owner's door (github_write)."
schedule: { every: 15m }
# The Needs You rules this sync may raise, each a toggle under Scheduled
# (§2.5: `syncs.github-state.raise`), handed to the run by the runner.
# Declared here so the owner's file can switch them and cannot name any
# other. `review_requested` raises the `pull_request` mirrors (T2-13): one
# per PR waiting on your review, for its current head. `assigned` raises the
# assigned-issue `task` mirrors (T4-23): one per open issue assigned to you,
# cleared when it closes or is given to someone else.
needs_you:
  review_requested:
    label: A pull request asks for your review
    default: true
  assigned:
    label: An issue is assigned to you
    default: true
writes: [work, proposals]
reads: [proposals]
requires: [github-token]

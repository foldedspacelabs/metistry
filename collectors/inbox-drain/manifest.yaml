schema: 1
name: inbox-drain
type: collector
display_name: Inbox Sort
# Housekeeping with no connection, so it presents as a routine under
# Scheduled (§2.5): its changes live under routines.inbox-drain.
presents_as: routine
description: Classify new inbox captures deterministically and emit proposals — never auto-creates (§4.12); a todo-shaped capture carries a suggested work row the user may accept with one click
# §2.5's default: every 5 minutes — a capture waits on it.
schedule: { every: 5m }
writes: [proposals, inbox]
reads: [inbox]
# The ONE model this collector may call, pinned `<provider>/<model-id>` (core's
# `collectorManifest`). `applefm` is the Apple Foundation Models provider
# `metistry compute providers add --from applefm` writes: on-device, cost 0.
# CI refuses a billable provider here and `completeJson()` refuses again at the
# call, so "collectors never call a billable model" is a check, not a habit.
# An install whose compute.yaml declares no such provider simply stays
# deterministic — the drain works either way.
uses_model: applefm/foundation-model

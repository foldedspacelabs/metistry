# Metistry substrate. Everything configurable comes from environment (.env);
# nothing assumes Docker Desktop or a particular host layout.
#
# Images: a checkout builds and tags them `metistry-<app>:dev`. A release
# install never builds — `metistry update` sets METISTRY_CONSOLE_IMAGE /
# METISTRY_ASSISTANT_IMAGE to the versioned ghcr.io images the release
# workflow pushed, then `docker compose pull && up -d --no-build`
# (docs/ops/releases.md).
name: metistry

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${METISTRY_DB_NAME:-metistry}
      POSTGRES_USER: ${METISTRY_DB_USER:-metistry}
      POSTGRES_PASSWORD: ${METISTRY_DB_PASSWORD:?set METISTRY_DB_PASSWORD in .env}
    ports:
      # loopback by default — reachability beyond the machine is the user's routing layer (invariant 8)
      - "127.0.0.1:${METISTRY_DB_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${METISTRY_DB_USER:-metistry} -d ${METISTRY_DB_NAME:-metistry}"]
      interval: 5s
      timeout: 3s
      retries: 10

  console:
    build: { context: ., dockerfile: apps/console/Dockerfile }
    image: ${METISTRY_CONSOLE_IMAGE:-metistry-console:dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      METISTRY_DB_HOST: db
      METISTRY_DB_PASSWORD: ${METISTRY_DB_PASSWORD:?set METISTRY_DB_PASSWORD in .env}
      METISTRY_CONSOLE_HOST: 0.0.0.0        # in-container bind; host exposure below is loopback
      METISTRY_ORIGIN: ${METISTRY_ORIGIN:?set METISTRY_ORIGIN (canonical HTTPS origin, §4.2)}
      # the LOCAL owner door (docs/ops/auth.md): this token authenticates as
      # the `user` principal, but ONLY over a connection from this machine.
      # Unset = passkeys only.
      METISTRY_LOCAL_OWNER_TOKEN: ${METISTRY_LOCAL_OWNER_TOKEN:-}
      # …and under compose "from this machine" arrives NATed: the port below
      # is published on 127.0.0.1, and Docker rewrites the source address to
      # this container's bridge gateway. `docker-gateway` tells the console
      # to trust exactly that one address, resolved at startup from its own
      # default route — not the compose subnet, so a sibling container is
      # still remote. The launchd shape sets nothing and stays plain loopback.
      METISTRY_TRUSTED_LOOPBACK_PROXY: ${METISTRY_TRUSTED_LOOPBACK_PROXY:-docker-gateway}
      # Captures live in the vault at Inbox/ (docs/ops/inbox.md) and
      # go there through the reconciler's bridge — this container never mounts
      # the instance repo (D5, invariant 7). The volume below is the FALLBACK
      # for a console with no bridge configured: capture keeps working, those
      # files are not in the vault, and moving them into Inbox/
      # later is enough for the reconciler's scan to pick them up.
      METISTRY_INBOX_DIR: /data/inbox
      # Above this many bytes a capture goes to Inbox/.large/, which
      # the instance gitignores. Unset = 5 MiB.
      METISTRY_INBOX_MAX_TRACKED_BYTES: ${METISTRY_INBOX_MAX_TRACKED_BYTES:-}
      # runner hardening (docs/ops/automation.md): failure-streak limit and
      # the per-error-signature alert window. Unset = the built-in 5 and 24h.
      METISTRY_RUNNER_MAX_STREAK: ${METISTRY_RUNNER_MAX_STREAK:-}
      METISTRY_ALERT_DEDUPE_H: ${METISTRY_ALERT_DEDUPE_H:-}
      METISTRY_VAPID_PUBLIC: ${METISTRY_VAPID_PUBLIC:-}
      METISTRY_VAPID_PRIVATE: ${METISTRY_VAPID_PRIVATE:-}
      METISTRY_VAPID_SUBJECT: ${METISTRY_VAPID_SUBJECT:-}
      # apple-fm host bridge (degrades absent when unset); explicit
      # host-gateway per PoC-4 — no Docker Desktop magic
      METISTRY_AFM_URL: ${METISTRY_AFM_URL:-}
      METISTRY_BRIDGE_TOKEN_APPLE_FM: ${METISTRY_BRIDGE_TOKEN_APPLE_FM:-}
      METISTRY_EK_URL: ${METISTRY_EK_URL:-}
      METISTRY_BRIDGE_TOKEN_EVENTKIT: ${METISTRY_BRIDGE_TOKEN_EVENTKIT:-}
      # Move a meeting's owner-door token (T2-12): the console's door presents
      # it on a confirm; the assistant service is never given it
      METISTRY_OWNER_DOOR_TOKEN_EVENTKIT: ${METISTRY_OWNER_DOOR_TOKEN_EVENTKIT:-}
      # reconciler vault bridge (D5; host service holding the instance repo):
      # note contents for mcp-brain's knowledge_read. Degrades absent when unset.
      METISTRY_RECONCILER_URL: ${METISTRY_RECONCILER_URL:-}
      METISTRY_BRIDGE_TOKEN_RECONCILER: ${METISTRY_BRIDGE_TOKEN_RECONCILER:-}
      # github-state collector: fine-grained READ-ONLY PAT + "owner/repo,owner/repo2"
      METISTRY_GITHUB_TOKEN: ${METISTRY_GITHUB_TOKEN:-}
      METISTRY_GITHUB_REPOS: ${METISTRY_GITHUB_REPOS:-}
      # github-issues dispatch target (§4.18): a SEPARATE fine-grained WRITE PAT
      # (Issues read/write + Metadata on the dispatch repo only) + "owner/repo"
      METISTRY_GITHUB_WRITE_TOKEN: ${METISTRY_GITHUB_WRITE_TOKEN:-}
      METISTRY_GITHUB_DISPATCH_REPO: ${METISTRY_GITHUB_DISPATCH_REPO:-}
      METISTRY_TARGETS_DIRS: ${METISTRY_TARGETS_DIRS:-targets:.metistry/targets}
      # compute.yaml (docs/ops/compute.md): providers, assignments, budgets.
      # The seed's copy ships in the image and assigns nothing; an instance
      # overlays its own file (D4, last existing wins) and both the console
      # and the assistant hot-reload it.
      METISTRY_COMPUTE_FILES: ${METISTRY_COMPUTE_FILES:-seed/compute.yaml:.metistry/compute.yaml}
      # crews (docs/ops/crews.md): seed/agents ships in the image;
      # `.metistry/agents` is the instance repo's protected dir, reached
      # through the vault bridge
      METISTRY_AGENTS_DIRS: ${METISTRY_AGENTS_DIRS:-seed/agents:.metistry/agents}
      METISTRY_CREWS_SYNC_S: ${METISTRY_CREWS_SYNC_S:-300}
      # aws-costs collector (degrades absent): read-only Cost Explorer credentials
      METISTRY_AWS_ACCESS_KEY_ID: ${METISTRY_AWS_ACCESS_KEY_ID:-}
      METISTRY_AWS_SECRET_ACCESS_KEY: ${METISTRY_AWS_SECRET_ACCESS_KEY:-}
      METISTRY_AWS_SESSION_TOKEN: ${METISTRY_AWS_SESSION_TOKEN:-}
      # devin-knowledge collector (degrades absent; docs/ops/devin.md): the
      # owner's own `cog_` Devin key. ORG_ID only for account-scoped tokens
      # (enterprise service users, PATs); REPOS is the opt-in wiki half.
      METISTRY_DEVIN_API_KEY: ${METISTRY_DEVIN_API_KEY:-}
      METISTRY_DEVIN_ORG_ID: ${METISTRY_DEVIN_ORG_ID:-}
      METISTRY_DEVIN_REPOS: ${METISTRY_DEVIN_REPOS:-}
      METISTRY_DEVIN_MAX_ITEMS: ${METISTRY_DEVIN_MAX_ITEMS:-}
      # user's timezone for brief/schedule rendering (Me/profile.md drives this later)
      TZ: ${METISTRY_TZ:-UTC}
      # the assistant as the first INTERNAL agent on /mcp (docs/ops/assistant-tools.md):
      # the console registers id 'assistant' from this token at startup; unset = revoked
      METISTRY_ASSISTANT_TOKEN: ${METISTRY_ASSISTANT_TOKEN:-}
      METISTRY_ASSISTANT_PROJECTS: ${METISTRY_ASSISTANT_PROJECTS:-}
      METISTRY_ASSISTANT_AREAS: ${METISTRY_ASSISTANT_AREAS:-}
      # secrets.yaml (X-7, owner's ruling 2026-09-30): the instance's
      # `.metistry/secrets.yaml` — names and policy, NEVER a value — mounted
      # read-only below so a provider key's grant to `provider:<name>` can be
      # checked before a model call dials (docs/ops/compute.md). Empty when
      # nothing is mounted, which the door reads as "no grant" and refuses.
      METISTRY_SECRETS_FILE: ${METISTRY_SECRETS_YAML:+/run/metistry/secrets.yaml}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      # loopback by default (invariant 8) — the user's routing layer adds reach
      - "127.0.0.1:${METISTRY_CONSOLE_PORT:-8080}:8080"
    volumes:
      - inbox:/data/inbox   # fallback only (see METISTRY_INBOX_DIR above)
      # the ONE instance file this container sees, read-only: `metistry up`
      # sets METISTRY_SECRETS_YAML to the instance's .metistry/secrets.yaml
      # when it exists. Unset, /dev/null is mounted and the variable above is
      # empty — never the instance directory (D5), never a created path.
      - type: bind
        source: ${METISTRY_SECRETS_YAML:-/dev/null}
        target: /run/metistry/secrets.yaml
        read_only: true
        bind: { create_host_path: false }
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 4

  assistant:
    build: { context: ., dockerfile: apps/assistant/Dockerfile }
    image: ${METISTRY_ASSISTANT_IMAGE:-metistry-assistant:dev}
    restart: unless-stopped
    depends_on:
      db: { condition: service_healthy }
    environment:
      METISTRY_DB_HOST: db
      METISTRY_DB_PASSWORD: ${METISTRY_DB_PASSWORD:?set METISTRY_DB_PASSWORD in .env}
      METISTRY_MODEL_DEFAULT: ${METISTRY_MODEL_DEFAULT:-haiku}
      # tools: the console's mcp-brain over the compose network, authenticated
      # with the SAME token the console registers (degrades: tool-less when unset)
      METISTRY_BRAIN_URL: ${METISTRY_BRAIN_URL:-http://console:8080/mcp}
      METISTRY_ASSISTANT_TOKEN: ${METISTRY_ASSISTANT_TOKEN:-}
      METISTRY_COMPUTE_FILES: ${METISTRY_COMPUTE_FILES:-seed/compute.yaml:.metistry/compute.yaml}
      # The engine's credential is named BY compute.yaml, not here: a
      # provider's `auth.secret` is the environment variable the engine reads
      # at the point of the call (docs/ops/compute.md). Pass through whichever
      # one this install declares — the default matches the openrouter
      # template, and an install using another provider adds its own line.
      METISTRY_OPENROUTER_API_KEY: ${METISTRY_OPENROUTER_API_KEY:-}
      # Identity + seed prompt (D4). This container mounts NO instance repo
      # (D5, as the console's comment above says), so the files it can reach
      # are the image's own — and the engine refuses to start on a seed
      # identity it was not told to use, rather than answering under the
      # wrong name. Naming them here is that instruction, said out loud:
      # a compose install that wants its own identity mounts the instance's
      # `.metistry/` read-only and points these two at it.
      METISTRY_IDENTITY_FILES: ${METISTRY_IDENTITY_FILES:-seed/identity.yaml}
      METISTRY_PROMPT_FILES: ${METISTRY_PROMPT_FILES:-seed/assistant-prompt.md}
      # …and where the instance is, when this install does mount it: every
      # overlay default resolves its instance half against this, never
      # against the container's working directory. Unset = the seed alone.
      METISTRY_INSTANCE_DIR: ${METISTRY_INSTANCE_DIR:-}
      # secrets.yaml, read-only, as for the console above (X-7): the engine
      # checks a provider key's grant on every call. Empty = nothing mounted
      # = every `{{ secret.x }}` provider key refused, naming the mount.
      METISTRY_SECRETS_FILE: ${METISTRY_SECRETS_YAML:+/run/metistry/secrets.yaml}
    volumes:
      - assistant-home:/home/node   # writable HOME; sessions themselves live in Postgres
      - type: bind
        source: ${METISTRY_SECRETS_YAML:-/dev/null}
        target: /run/metistry/secrets.yaml
        read_only: true
        bind: { create_host_path: false }

volumes:
  db-data:
  inbox:
  assistant-home:

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 940" width="940" height="940" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — capture sheet at a medium detent</title>
  <desc id="desc">Annotated wireframe at 390 by 844 points: the capture composer presented as a sheet at a medium detent over the feed, with an autogrowing note field, an attachment chip, a single Capture button, an offline-queued receipt, and the share-extension variant.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 } .lt { font-size: 30px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .snk { fill: #eef0f3; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
  </style>

  <rect width="940" height="940" fill="#ffffff"/>
  <text x="24" y="30" class="h2">iPhone — Capture (sheet, medium detent)</text>
  <text x="24" y="50" class="t2">Capture never blocks, never asks a question, never waits on the model — it writes to the inbox and returns</text>

  <rect x="60" y="70" width="390" height="844" rx="46" fill="#f6f7f9" stroke="#b6bec8" stroke-width="2"/>
  <rect x="165" y="78" width="180" height="28" rx="14" fill="#12171c"/>
  <text x="88" y="102" class="t3">9:41</text>

  <!-- dimmed feed behind -->
  <g opacity="0.35">
    <text x="84" y="164" class="lt">Feed</text>
    <text x="84" y="200" class="t2">🔧 drey-dev · knowledge_search · 3 hits</text>
    <text x="84" y="228" class="t2">📨 drey-dev · dispatch queued for ops-bot</text>
    <text x="84" y="256" class="t2">📝 system · proposal #97 awaiting you</text>
  </g>
  <rect x="62" y="130" width="386" height="182" fill="#12171c" opacity="0.28"/>

  <!-- sheet -->
  <rect class="sf" x="62" y="312" width="386" height="568" rx="24" stroke="#b6bec8"/>
  <rect x="235" y="326" width="40" height="5" rx="2.5" fill="#b6bec8"/>
  <text x="84" y="366" class="hd">Capture</text>
  <text x="426" y="366" class="acc" text-anchor="end" font-size="15">Done</text>

  <!-- note field -->
  <rect class="sf" x="84" y="384" width="342" height="120" rx="12" stroke="#b6bec8"/>
  <text x="98" y="410" font-size="15">Ask the physio about the calf before the</text>
  <text x="98" y="432" font-size="15">taper starts — book something for the</text>
  <text x="98" y="454" font-size="15">week of the 21st.</text>
  <text x="412" y="494" class="t3" text-anchor="end">118</text>

  <!-- attachment -->
  <rect x="84" y="518" width="176" height="32" rx="16" class="snk"/>
  <text x="98" y="539" class="t2">📎 scan-2026-09-08.pdf</text>
  <text x="248" y="539" class="t3">✕</text>
  <rect class="sf" x="270" y="518" width="112" height="32" rx="16"/>
  <text x="284" y="539" class="t2">＋ Attach…</text>

  <!-- primary -->
  <rect x="84" y="566" width="342" height="48" rx="12" fill="#2b5fd0"/>
  <text x="255" y="596" fill="#fff" text-anchor="middle" font-size="16">Capture</text>

  <!-- receipts -->
  <text x="84" y="644" class="t3">LAST CAPTURE</text>
  <text x="84" y="668" class="ok" font-size="13">✓ captured → inbox #418 · classified note on-device</text>
  <text x="84" y="700" class="t3">IF THE INSTANCE IS UNREACHABLE</text>
  <rect x="84" y="710" width="230" height="26" rx="13" fill="#faf1de"/>
  <text x="96" y="728" class="deg" font-size="13">⏳ queued — 2 waiting to send</text>
  <text x="84" y="756" class="t3">Nothing is lost: the offline queue replays to</text>
  <text x="84" y="774" class="t3">POST /capture when the instance is reachable.</text>

  <path class="ln" d="M84 800 H426"/>
  <text x="84" y="826" class="t3">Also arrives here from: the share sheet, the</text>
  <text x="84" y="844" class="t3">Mac's global hotkey, a window drop, a Shortcut.</text>
  <rect x="195" y="890" width="120" height="5" rx="2.5" fill="#12171c"/>

  <!-- callouts -->
  <circle class="cw" cx="470" cy="328" r="10"/><text class="cn" x="470" y="332">1</text>
  <circle class="cw" cx="470" cy="444" r="10"/><text class="cn" x="470" y="448">2</text>
  <circle class="cw" cx="470" cy="534" r="10"/><text class="cn" x="470" y="538">3</text>
  <circle class="cw" cx="470" cy="590" r="10"/><text class="cn" x="470" y="594">4</text>
  <circle class="cw" cx="470" cy="722" r="10"/><text class="cn" x="470" y="726">5</text>

  <!-- legend -->
  <text x="510" y="110" class="h2">Callouts</text>
  <text x="510" y="146" class="lg">① A sheet, because capture is a scoped</text>
  <text x="524" y="166" class="lg">task closely related to what is on screen.</text>
  <text x="524" y="186" class="lg">Medium detent, grabber shown, swipe or</text>
  <text x="524" y="206" class="lg">Done to dismiss — the standard sheet</text>
  <text x="524" y="226" class="lg">affordances, not a custom modal.</text>

  <text x="510" y="266" class="lg">② The field autogrows from three lines.</text>
  <text x="524" y="286" class="lg">No formatting bar, no title field, no</text>
  <text x="524" y="306" class="lg">classification picker: classification is the</text>
  <text x="524" y="326" class="lg">on-device FM tier's job, after the write.</text>

  <text x="510" y="366" class="lg">③ The file input is a labelled button plus</text>
  <text x="524" y="386" class="lg">a removable chip — never a raw</text>
  <text x="524" y="406" class="lg">&lt;input type="file"&gt; control on the web.</text>

  <text x="510" y="446" class="lg">④ Exactly one primary action, full width,</text>
  <text x="524" y="466" class="lg">48pt tall (well over the 44pt minimum).</text>

  <text x="510" y="506" class="lg">⑤ Offline is a <tspan class="deg">degraded</tspan> state, not a</text>
  <text x="524" y="526" class="lg">failure: the capture is queued and the</text>
  <text x="524" y="546" class="lg">chip says how many are waiting. Capture</text>
  <text x="524" y="566" class="lg">never drops — that is the whole promise</text>
  <text x="524" y="586" class="lg">of this surface.</text>

  <text x="510" y="636" class="h2">States</text>
  <text x="510" y="668" class="lg">empty · typing · attaching · sending ·</text>
  <text x="510" y="688" class="lg">captured · <tspan class="deg">queued-offline</tspan> · <tspan class="bad">failed</tspan></text>
  <text x="510" y="708" class="lg t3">(failed keeps the content and offers retry)</text>

  <text x="510" y="756" class="h2">Mac equivalent</text>
  <text x="510" y="788" class="lg">A global-hotkey panel and a window drop</text>
  <text x="510" y="808" class="lg">target; same anatomy, same receipt.</text>
  <text x="24" y="928" class="t3">docs/product/design-system.md §3.8 capture composer · §3.15 empty states · §3.16 error envelopes</text>
</svg>

    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .agq { fill: #f1ecfc; stroke: #e2d9f7 }
    .accq { fill: #e6edfc; stroke: #c6d6f7 }
    .el { fill: #ffffff; stroke: #b6bec8 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e } .abs { fill: #646d77 }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
    .grp { fill: #646d77; font-size: 11px; font-weight: 600; letter-spacing: 0.04em }
  </style>

  <rect width="1360" height="960" fill="#ffffff"/>
  <text x="24" y="30" class="h2">iPhone — Chat</text>
  <text x="24" y="50" class="t2">Bubbles aligned to their sender · one-row composer, nothing else pinned above the keyboard · "+" expands the actions menu · a reply that lands while you are scrolled up raises a pill, it does not scroll you</text>


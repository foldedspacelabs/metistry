  <circle class="el" cx="104" cy="848" r="21"/><text x="104" y="855" class="acc" text-anchor="middle" font-size="20">+</text>
  <rect class="sf" x="132" y="827" width="204" height="42" rx="21"/>
  <text x="150" y="853" class="t3" font-size="14">ask or tell…</text>
  <circle cx="392" cy="848" r="21" fill="#2b5fd0"/><text x="392" y="855" fill="#fff" text-anchor="middle" font-size="16">↑</text>

  <circle class="cw" cx="470" cy="582" r="10"/><text class="cn" x="470" y="586">6</text>
  <circle class="cw" cx="470" cy="762" r="10"/><text class="cn" x="470" y="766">7</text>

  <!-- legend -->
  <text x="920" y="106" class="h2">Callouts</text>
  <text x="920" y="140" class="lg">① The composer is one row: <tspan class="mono" font-size="13">+</tspan>, a field that grows</text>
  <text x="934" y="160" class="lg">to five lines, and send. Nothing else is pinned</text>
  <text x="934" y="180" class="lg">above the keyboard, so a reply is never hidden</text>
  <text x="934" y="200" class="lg">behind a command strip (§3.6).</text>

  <text x="920" y="234" class="lg">② "↓ New Reply". The list scrolls only when the</text>
  <text x="934" y="254" class="lg">reader is already at the bottom. A reply that</text>
  <text x="934" y="274" class="lg">lands while they are scrolled up is appended</text>
  <text x="934" y="294" class="lg">silently and raises this pill; focusing or typing</text>
  <text x="934" y="314" class="lg">in the composer never scrolls (P9).</text>

  <text x="920" y="348" class="lg">③ Collapsed tool activity — tap to expand into</text>
  <text x="934" y="368" class="lg">one row per call, mono on the agent wash:</text>
  <text x="934" y="388" class="lg">visibly quoted, never a control (P1).</text>

  <text x="920" y="422" class="lg">④ Prompt-card options stack full-width at ≥44pt;</text>
  <text x="934" y="442" class="lg">the same payload drives the push actions.</text>

  <text x="920" y="476" class="lg">⑤ <tspan class="mono" font-size="13">+</tspan> expands the actions menu above the field —</text>
  <text x="934" y="496" class="lg">a <tspan class="mono" font-size="13">&lt;details&gt;</tspan> on the web, a small-detent sheet on</text>
  <text x="934" y="516" class="lg">iOS. Collapsed by default; it never survives a</text>
  <text x="934" y="536" class="lg">send. ⌘K shows the same generated list on the</text>
  <text x="934" y="556" class="lg">Mac and the wide PWA.</text>

  <text x="920" y="590" class="lg">⑥ A tier the instance has not configured is listed</text>
  <text x="934" y="610" class="lg">and disabled <tspan font-style="italic">with the reason</tspan>, never hidden (P4).</text>

  <text x="920" y="644" class="lg">⑦ Model &amp; effort inline (§3.7) — the header still</text>
  <text x="934" y="664" class="lg">says which tier the deterministic router chose.</text>

  <text x="920" y="716" class="h2">iMessage, Deliberately (P8)</text>
  <text x="920" y="748" class="lg">Bubbles aligned to their sender, timestamps on</text>
  <text x="920" y="768" class="lg">demand behind a day separator, one <tspan class="mono" font-size="13">+</tspan> for every</text>
  <text x="920" y="788" class="lg">action, tapbacks (long-press) for feedback.</text>
  <text x="920" y="812" class="lg">Not borrowed: read receipts, typing indicators,</text>
  <text x="920" y="832" class="lg">anything that animates on arrival (P2).</text>

  <text x="24" y="944" class="t3">docs/product/design-system.md §3.4 chat message · §3.5 prompt card · §3.6 composer actions menu · §3.7 model picker · P8 iMessage · P9 scroll · P10 Title Case</text>
</svg>

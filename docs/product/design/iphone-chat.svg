  <rect class="sf" x="658" y="396" width="146" height="32" rx="16"/><text x="731" y="417" text-anchor="middle" font-size="13">What's the Latest</text>
  <rect class="sf" x="524" y="436" width="94" height="32" rx="16"/><text x="571" y="457" text-anchor="middle" font-size="13">New Note</text>


  <!-- legend -->
  <text x="1380" y="100" class="h2">Callouts</text>
  <text x="1380" y="128" class="lg">&#9312; The composer is one row: <tspan class="mono" font-size="13">+</tspan>, a field that grows to five</text>
  <text x="1394" y="145" class="lg">lines, and send. Nothing else is pinned above the</text>
  <text x="1394" y="162" class="lg">keyboard, so a reply is never hidden behind a</text>
  <text x="1394" y="179" class="lg">command strip (&#167;3.6).</text>
  <text x="1380" y="205" class="lg">&#9313; "&#8595; New Reply". The list scrolls only when the reader</text>
  <text x="1394" y="222" class="lg">is already at the bottom. A reply that lands while they</text>
  <text x="1394" y="239" class="lg">are scrolled up is appended silently and raises this pill;</text>
  <text x="1394" y="256" class="lg">focusing or typing in the composer never scrolls (P9).</text>
  <text x="1380" y="282" class="lg">&#9314; Collapsed tool activity &#8212; tap to expand into one row</text>
  <text x="1394" y="299" class="lg">per call, mono on the agent wash: visibly quoted, never a</text>
  <text x="1394" y="316" class="lg">control (P1).</text>
  <text x="1380" y="342" class="lg">&#9315; Prompt-card options stack full-width at &#8805;44pt; the same</text>
  <text x="1394" y="359" class="lg">payload drives the push actions.</text>
  <text x="1380" y="385" class="lg">&#9316; <tspan class="mono" font-size="13">+</tspan> expands the actions menu above the field &#8212; a</text>
  <text x="1394" y="402" class="lg"><tspan class="mono" font-size="13">&lt;details&gt;</tspan> on the web, a small-detent sheet on iOS.</text>
  <text x="1394" y="419" class="lg">Collapsed by default; it never survives a send. <tspan font-style="italic">Every row</tspan></text>
  <text x="1394" y="436" class="lg"><tspan font-style="italic">in it is clickable</tspan>: a quick action, a command or an agent</text>
  <text x="1394" y="453" class="lg">tag inserts its own text at the caret and returns focus to</text>
  <text x="1394" y="470" class="lg">the field. Nothing in the menu sends.</text>
  <text x="1380" y="496" class="lg">&#9317; A tier the instance has not configured is listed and</text>
  <text x="1394" y="513" class="lg">disabled <tspan font-style="italic">with the reason</tspan>, never hidden (P4).</text>
  <text x="1380" y="539" class="lg">&#9318; Model &amp; effort inline (&#167;3.7) &#8212; the header still says</text>
  <text x="1394" y="556" class="lg">which tier the deterministic router chose.</text>
  <text x="1380" y="582" class="lg">&#9319; Autocomplete. <tspan class="mono" font-size="13">@d</tspan> suggests <tspan class="mono" font-size="13">@drey</tspan>; <tspan class="mono" font-size="13">/</tspan> lists the commands</text>
  <text x="1394" y="599" class="lg">and narrows them as you type. Same generated list as the</text>
  <text x="1394" y="616" class="lg">menu, filtered &#8212; agents from the registry, commands from</text>
  <text x="1394" y="633" class="lg"><tspan class="mono" font-size="13">rules.yaml</tspan>, never hand-maintained. Ranking is</text>
  <text x="1394" y="650" class="lg">deterministic: <tspan font-style="italic">prefix, then substring, then recency</tspan>.</text>
  <text x="1394" y="667" class="lg">Six rows maximum; the footer says what the order is.</text>
  <text x="1380" y="693" class="lg">&#9320; The field keeps focus and the caret throughout &#8212; it is a</text>
  <text x="1394" y="710" class="lg">listbox, not a menu. &#8593;&#8595; move, Enter or Tab inserts, Esc</text>
  <text x="1394" y="727" class="lg">closes without changing the text. Tap inserts too, at 44pt.</text>
  <text x="1394" y="744" class="lg">It never sends and never scrolls the transcript (P9).</text>
  <text x="1380" y="770" class="h2">&#8984;K Stays (Mac and Wide PWA)</text>
  <text x="1380" y="794" class="lg">The palette is the <tspan font-style="italic">rich</tspan> version of the same list wherever</text>
  <text x="1394" y="811" class="lg">there is a desktop keyboard: all four groups searched at</text>
  <text x="1394" y="828" class="lg">once, full descriptions and shortcuts, presence before you</text>
  <text x="1394" y="845" class="lg">address an agent, and it stays open across several</text>
  <text x="1394" y="862" class="lg">insertions. The inline list is the narrow affordance; the</text>
  <text x="1394" y="879" class="lg">palette is the wide one. Never on touch.</text>
  <text x="1380" y="909" class="h2">iMessage, Deliberately (P8)</text>
  <text x="1380" y="933" class="lg">Bubbles aligned to their sender, timestamps on demand</text>
  <text x="1394" y="950" class="lg">behind a day separator, one <tspan class="mono" font-size="13">+</tspan> for every action,</text>
  <text x="1394" y="967" class="lg">tapbacks (long-press) for feedback. Not borrowed: read</text>
  <text x="1394" y="984" class="lg">receipts, typing indicators, anything that animates on</text>
  <text x="1394" y="1001" class="lg">arrival (P2).</text>

  <text x="24" y="1040" class="t3">docs/product/design-system.md §3.4 chat message · §3.5 prompt card · §3.6 composer actions menu + autocomplete · §3.7 model picker · §4 reply text · P8 iMessage · P9 scroll · P10 Title Case</text>
</svg>

  <text x="24" y="30" class="h2">iPhone — Chat</text>
  <text x="24" y="50" class="t2">Bubbles aligned to their sender · one-row composer, nothing else pinned above the keyboard · "+" expands the actions menu, and every row of it inserts itself at the caret · typing @ or / opens the same list inline · a reply that lands while you are scrolled up raises a pill, it does not scroll you</text>


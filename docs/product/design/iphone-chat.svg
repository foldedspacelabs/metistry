<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1820 1060" width="1820" height="1060" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — Chat: the iMessage-style thread, the collapsed composer, and its actions menu</title>
  <desc id="desc">Annotated wireframe, three states at 390 by 844 points. Left: an iMessage-style thread — bubbles aligned to their sender, an assistant turn with an explicit finished state and collapsed tool activity, a question-answer prompt card whose options stack, a one-row composer of plus button, growing field and send, and a "New Reply" pill at the bottom edge because a reply arrived while the reader was scrolled up. Right: the same screen with the plus button expanded into the actions menu — Quick Actions, Commands from rules.yaml, Agents, Attach, and the model and effort picker — presented above the field rather than pinned there, every row of it clickable and inserting itself at the caret. Right-most: the same composer mid-token — the user has typed an at sign and a d, and an inline suggestion listbox under the field offers three agents ranked prefix first, then substring, then recency.</desc>

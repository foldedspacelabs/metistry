<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1360 960" width="1360" height="960" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — Chat: the iMessage-style thread, the collapsed composer, and its actions menu</title>
  <desc id="desc">Annotated wireframe, two states at 390 by 844 points. Left: an iMessage-style thread — bubbles aligned to their sender, an assistant turn with an explicit finished state and collapsed tool activity, a question-answer prompt card whose options stack, a one-row composer of plus button, growing field and send, and a "New Reply" pill at the bottom edge because a reply arrived while the reader was scrolled up. Right: the same screen with the plus button expanded into the actions menu — Quick Actions, Commands from rules.yaml, Agents, Attach, and the model and effort picker — presented above the field rather than pinned there.</desc>

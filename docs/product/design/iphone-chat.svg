  <text x="685" y="120" text-anchor="middle" class="hd">Chat</text>
  <text x="856" y="120" text-anchor="end" class="t2" font-size="13">◇ deep · high ⌄</text>

  <rect class="accq" x="580" y="150" width="276" height="44" rx="18"/>
  <text x="594" y="178" font-size="14">how much should I ease off running?</text>
  <text x="514" y="220" class="t3">assistant · <tspan class="ok">finished</tspan></text>
  <rect class="sf" x="514" y="230" width="290" height="86" rx="18"/>
  <text x="528" y="254" font-size="14">Cut volume ~40% over the final</text>
  <text x="528" y="274" font-size="14">three weeks, keep intensity. Your</text>
  <text x="528" y="294" font-size="14">note <tspan class="acc">Areas/Running/Taper</tspan> puts…</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1080" width="940" height="1080" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — activity feed with the tab bar</title>
  <desc id="desc">Annotated wireframe at 390 by 844 points: a large-title feed screen with filter chips, activity rows carrying a kind glyph, an agent-tinted actor chip, subject in Title Case where the console composed it, detail and relative time, and a bottom tab bar of five sections — Chat, Feed, Needs You, Work — plus a More tab holding Knowledge, Agents and System, anchored above the home indicator inside the safe area. Capture is the plus button in the navigation bar, not a tab.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .lt { font-size: 30px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
  </style>

  <rect width="940" height="1080" fill="#ffffff"/>
  <text x="24" y="30" class="h2">iPhone — Feed</text>
  <text x="24" y="50" class="t2">390 × 844 pt · five sections plus More · Capture is a ＋ in the nav bar, not a tab · large title collapses on scroll</text>

  <!-- phone -->
  <rect x="60" y="70" width="390" height="844" rx="46" fill="#f6f7f9" stroke="#b6bec8" stroke-width="2"/>
  <!-- status bar + notch -->
  <rect x="165" y="78" width="180" height="28" rx="14" fill="#12171c"/>
  <text x="88" y="102" class="t3">9:41</text>
  <text x="422" y="102" class="t3" text-anchor="end">▮▮ ⌁</text>

  <!-- large title -->
  <text x="84" y="164" class="lt">Feed</text>
  <text x="392" y="158" class="acc" text-anchor="end" font-size="17">⌘</text>
  <text x="426" y="158" class="acc" text-anchor="end" font-size="19">＋</text>
  <!-- filter chips -->
  <rect x="84" y="182" width="88" height="28" rx="14" fill="#e6edfc" stroke="#c6d6f7"/><text x="98" y="201" class="acc" font-size="13">All Agents ⌄</text>
  <rect x="180" y="182" width="96" height="28" rx="14" class="sf"/><text x="194" y="201" class="t2" font-size="13">All Projects ⌄</text>
  <rect x="284" y="182" width="64" height="28" rx="14" class="sf"/><text x="298" y="201" class="t2" font-size="13">24h ⌄</text>

  <!-- rows -->
  <g>
    <text x="84" y="248">🔧</text>
    <rect x="110" y="234" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="118" y="247" class="ag mono">drey-dev</text>
    <text x="84" y="274" class="hd">knowledge_search · 3 hits</text>
    <text x="426" y="248" class="t3" text-anchor="end">2m</text>
    <text x="84" y="294" class="t2">mode: hybrid · Areas/Running · 14 ms</text>
    <path class="ln" d="M84 310 H426"/>

    <text x="84" y="342">📨</text>
    <rect x="110" y="328" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="118" y="341" class="ag mono">drey-dev</text>
    <text x="84" y="368" class="hd">dispatch queued for ops-bot</text>
    <text x="426" y="342" class="t3" text-anchor="end">14m</text>
    <text x="84" y="388" class="deg" font-size="13">⏳ 3/3 open bundles — cap on metistry</text>
    <path class="ln" d="M84 404 H426"/>

    <text x="84" y="436">📝</text>
    <rect x="110" y="422" width="56" height="18" rx="9" fill="#eef0f3"/><text x="118" y="435" class="t3 mono">system</text>
    <text x="84" y="462" class="hd">Proposal #97 Awaiting You</text>
    <text x="426" y="436" class="t3" text-anchor="end">1h</text>
    <text x="84" y="482" class="t2">write Knowledge/Areas/Health/Taper.md</text>
    <path class="ln" d="M84 498 H426"/>

    <text x="84" y="530">⚠️</text>
    <rect x="110" y="516" width="92" height="18" rx="9" fill="#eef0f3"/><text x="118" y="529" class="t3 mono">github-state</text>
    <text x="84" y="556" class="hd">Collector Run Failed</text>
    <text x="426" y="530" class="t3" text-anchor="end">3h</text>
    <text x="84" y="576" class="bad" font-size="13">✕ rate limited — retries at 14:20</text>
    <path class="ln" d="M84 592 H426"/>

    <text x="84" y="624">📰</text>
    <rect x="110" y="610" width="66" height="18" rx="9" fill="#eef0f3"/><text x="118" y="623" class="t3 mono">routine</text>
    <text x="84" y="650" class="hd">Morning Brief Delivered</text>
    <text x="426" y="624" class="t3" text-anchor="end">7h</text>
    <text x="84" y="670" class="t2">4 items · 2 links · 1 question</text>
    <path class="ln" d="M84 686 H426"/>

    <text x="84" y="718">✅</text>
    <rect x="110" y="704" width="42" height="18" rx="9" fill="#eef0f3"/><text x="118" y="717" class="t3 mono">you</text>
    <text x="84" y="744" class="hd">Allowed Proposal #94</text>
    <text x="426" y="718" class="t3" text-anchor="end">8h</text>
    <text x="84" y="764" class="ok" font-size="13">✓ committed 4a1c93e</text>
  </g>

  <!-- tab bar -->
  <path class="ln" d="M62 796 H448"/>
  <rect x="62" y="796" width="386" height="84" fill="#ffffff" opacity="0.96"/>
  <g text-anchor="middle">
    <text x="116" y="828" font-size="17">💬</text><text x="116" y="846" class="t3" font-size="10">Chat</text>
    <text x="180" y="828" class="acc" font-size="17">◈</text><text x="180" y="846" class="acc" font-size="10">Feed</text>
    <text x="244" y="828" font-size="17">📝</text><text x="244" y="846" class="t3" font-size="10">Needs You</text>
    <circle cx="262" cy="818" r="8" fill="#2b5fd0"/><text x="262" y="822" fill="#fff" font-size="9">4</text>
    <text x="308" y="828" font-size="17">🗂️</text><text x="308" y="846" class="t3" font-size="10">Work</text>
    <text x="376" y="828" font-size="17">•••</text><text x="376" y="846" class="t3" font-size="10">More</text>
  </g>
  <rect x="195" y="890" width="120" height="5" rx="2.5" fill="#12171c"/>

  <!-- callouts -->
  <circle class="cw" cx="470" cy="164" r="10"/><text class="cn" x="470" y="168">1</text>
  <circle class="cw" cx="470" cy="196" r="10"/><text class="cn" x="470" y="200">2</text>
  <circle class="cw" cx="470" cy="264" r="10"/><text class="cn" x="470" y="268">3</text>
  <circle class="cw" cx="470" cy="838" r="10"/><text class="cn" x="470" y="842">4</text>
  <circle class="cw" cx="470" cy="890" r="10"/><text class="cn" x="470" y="894">5</text>
  <circle class="cw" cx="470" cy="556" r="10"/><text class="cn" x="470" y="560">6</text>
  <circle class="cw" cx="470" cy="368" r="10"/><text class="cn" x="470" y="372">7</text>

  <!-- legend -->
  <text x="510" y="110" class="h2">Callouts</text>
  <text x="510" y="146" class="lg">① Large title (largeTitle, 34pt) collapses to</text>
  <text x="524" y="166" class="lg">an inline title on scroll — the standard</text>
  <text x="524" y="186" class="lg">iOS navigation bar behaviour, not a custom</text>
  <text x="524" y="206" class="lg">header. ⌘ opens the palette; ＋ opens</text>
  <text x="524" y="226" class="lg">capture at a medium detent.</text>

  <text x="510" y="266" class="lg">② Filters are chips, not a hidden menu:</text>
  <text x="524" y="286" class="lg">buttons and menus over memorised syntax</text>
  <text x="524" y="306" class="lg">(ux-direction). Each is ≥44pt tall.</text>

  <text x="510" y="346" class="lg">③ Feed row wraps to three lines on a phone</text>
  <text x="524" y="366" class="lg">and to one on the Mac — same anatomy,</text>
  <text x="524" y="386" class="lg">same order, same words (P6). Rows must</text>
  <text x="524" y="406" class="lg">survive accessibilityExtraExtraExtraLarge,</text>
  <text x="524" y="426" class="lg">so nothing here is a fixed height.</text>

  <text x="510" y="466" class="lg">④ Tab bar: <tspan font-weight="600">Chat · Feed · Needs You · Work</tspan></text>
  <text x="524" y="486" class="lg">plus More — Knowledge, Agents, System, in</text>
  <text x="524" y="506" class="lg">the sidebar's own order. Capture left the</text>
  <text x="524" y="526" class="lg">bar: a tab you navigate to contradicts its</text>
  <text x="524" y="546" class="lg">own promise. Badge only when actionable.</text>

  <text x="510" y="586" class="lg">⑤ Safe area: the bar sits above the home</text>
  <text x="524" y="606" class="lg">indicator; the PWA does the same with</text>
  <text x="524" y="626" class="lg">env(safe-area-inset-bottom).</text>

  <text x="510" y="666" class="lg">⑥ Subject in <tspan font-style="italic">Title Case</tspan> — but applied at</text>
  <text x="524" y="686" class="lg">render, in the view layer, and only for</text>
  <text x="524" y="706" class="lg">kinds the console itself composes:</text>
  <text x="524" y="726" class="lg"><tspan class="mono">collector_run</tspan>, <tspan class="mono">proposal_*</tspan>, <tspan class="mono">brief</tspan>,</text>
  <text x="524" y="746" class="lg"><tspan class="mono">project_mode</tspan>, <tspan class="mono">alert</tspan> and the rest of a</text>
  <text x="524" y="766" class="lg">closed allow-list (§3.2). Never written</text>
  <text x="524" y="786" class="lg">back to the database. Identifiers inside a</text>
  <text x="524" y="806" class="lg">subject are skipped, joining words stay</text>
  <text x="524" y="826" class="lg">lowercase, detail lines stay sentence</text>
  <text x="524" y="846" class="lg">case — they are prose (P10).</text>

  <text x="510" y="886" class="lg">⑦ These two are <tspan class="mono">tool</tspan> and <tspan class="mono">dispatch</tspan>, whose</text>
  <text x="524" y="906" class="lg">subjects can carry agent-authored text.</text>
  <text x="524" y="926" class="lg">They render exactly as stored. Agent text</text>
  <text x="524" y="946" class="lg">is data, and data is not case-corrected</text>
  <text x="524" y="966" class="lg">(P1) — that is why the rule is a list of</text>
  <text x="524" y="986" class="lg">kinds and not a guess about the string.</text>

  <text x="510" y="1022" class="h2">Colour budget · VoiceOver</text>
  <text x="510" y="1044" class="lg">One accent · four states · six presence values.</text>
  <text x="510" y="1062" class="lg t3">"from agent drey-dev: dispatch queued for ops-bot, 14 minutes ago, queued"</text>
  <text x="24" y="1012" class="t3">docs/product/design-system.md §3.1 navigation · §3.2 activity feed row (Title Case at render) · P10</text>
</svg>

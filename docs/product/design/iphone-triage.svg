<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 1020" width="940" height="1020" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — the request queue as the bell's sheet, over the screen you were on</title>
  <desc id="desc">Annotated wireframe at 390 by 844 points: Needs You is not a tab. A bell in the navigation bar carries the unread count, and tapping it presents the queue as a sheet at the large detent over the Feed screen that was already there. Each request card previews exactly what will happen and carries six answers over two rows — Approve, Revise, Decline and Skip, then Approve as Work where the payload suggests one, and Later, which snoozes the row so it comes back by itself. A swipe exposes the reversible answers, a decided card collapses to a receipt, the empty state reads as a good state, and a lock-screen notification offers the non-destructive subset from the same payload — the same queue, surfaced by the system.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 } .lt { font-size: 28px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .snk { fill: #eef0f3; stroke: #d9dee4 }
    .agq { fill: #f1ecfc; stroke: #e2d9f7 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
  </style>

  <rect width="940" height="1020" fill="#ffffff"/>

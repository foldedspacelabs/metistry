  <rect x="165" y="78" width="180" height="28" rx="14" fill="#12171c"/>
  <text x="88" y="102" class="t3">9:41</text>

  <!-- the screen underneath -->
  <g opacity="0.4">
    <text x="84" y="156" class="lt">Feed</text>
    <text x="84" y="186" class="t2">🔧 drey-dev · knowledge_search · 3 hits</text>
  </g>
  <text x="418" y="152" text-anchor="end" font-size="19">🔔</text>
  <circle cx="422" cy="132" r="9" fill="#2b5fd0"/><text x="422" y="136" fill="#fff" font-size="10" text-anchor="middle">4</text>
  <rect x="62" y="196" width="386" height="14" fill="#12171c" opacity="0.2"/>

  <!-- the sheet -->
  <rect class="sf" x="62" y="210" width="386" height="670" rx="24" stroke="#b6bec8"/>
  <rect x="235" y="224" width="40" height="5" rx="2.5" fill="#b6bec8"/>
  <text x="84" y="264" class="lt">Needs You</text>
  <text x="426" y="262" class="acc" text-anchor="end" font-size="15">Done</text>
  <text x="84" y="288" class="t3">4 waiting · 1 snoozed · oldest first</text>

  <!-- card 1 -->
  <rect class="sf" x="76" y="300" width="358" height="212" rx="16"/>
  <text x="94" y="326">📝</text>
  <rect x="118" y="312" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="126" y="325" class="ag mono">drey-dev</text>
  <text x="94" y="352" class="hd">Write a taper section to Health</text>
  <text x="94" y="370" class="t3">knowledge · #97 · from inbox #418 · today</text>
  <rect class="snk" x="94" y="380" width="322" height="46" rx="10"/>
  <text x="106" y="398" class="mono t2">+ Knowledge/Areas/Health/Taper.md</text>
  <text x="106" y="416" class="mono t3">  ## Taper · +18 lines · shown as data</text>
  <rect x="94" y="436" width="86" height="30" rx="9" fill="#2b5fd0"/><text x="137" y="456" fill="#fff" text-anchor="middle" font-size="13">Approve</text>
  <rect class="sf" x="188" y="436" width="70" height="30" rx="9" stroke="#b6bec8"/><text x="223" y="456" text-anchor="middle" font-size="13">Revise</text>
  <rect class="sf" x="266" y="436" width="78" height="30" rx="9" stroke="#b3261e"/><text x="305" y="456" text-anchor="middle" font-size="13" class="bad">Decline</text>
  <rect class="sf" x="352" y="436" width="64" height="30" rx="9" stroke="#b6bec8"/><text x="384" y="456" text-anchor="middle" font-size="13">Skip</text>
  <rect class="sf" x="94" y="472" width="144" height="30" rx="9" stroke="#2b5fd0"/><text x="166" y="492" text-anchor="middle" font-size="13" class="acc">Approve as Work</text>
  <rect class="sf" x="246" y="472" width="76" height="30" rx="9" stroke="#b6bec8"/><text x="284" y="492" text-anchor="middle" font-size="13">Later</text>
  <text x="330" y="492" class="t3">returns in 3h</text>

  <!-- card 2: swipe -->
  <rect class="sf" x="76" y="524" width="358" height="104" rx="16"/>
  <text x="94" y="550">🛡️</text>
  <rect x="118" y="536" width="66" height="18" rx="9" fill="#eef0f3"/><text x="126" y="549" class="t3 mono">ops-bot</text>
  <text x="94" y="580" class="hd">Extend grant: +Areas/Work</text>
  <text x="94" y="600" class="t3">grant · #98 · widens what it can read</text>
  <rect x="352" y="524" width="82" height="104" rx="16" fill="#faf1de"/>
  <text x="393" y="576" class="deg" text-anchor="middle" font-size="14">Later</text>
  <text x="393" y="594" class="t3" text-anchor="middle">snooze</text>

  <!-- card 3: decided receipt -->
  <rect class="sf" x="76" y="640" width="358" height="62" rx="16"/>
  <text x="94" y="672" class="ok">✓</text>
  <text x="116" y="672" class="t2">Approved #94 · committed 4a1c93e · 8h ago</text>
  <text x="116" y="692" class="acc" font-size="13">Undo</text>

  <!-- empty state -->
  <rect class="ln" x="76" y="714" width="358" height="112" rx="16" stroke-dasharray="4 4"/>
  <text x="255" y="756" text-anchor="middle" font-size="24" fill="#646d77">✓</text>
  <text x="255" y="784" text-anchor="middle" class="t2">Queue is clear.</text>
  <text x="255" y="806" text-anchor="middle" class="t3">Snoozed rows come back by themselves.</text>

  <text x="255" y="856" text-anchor="middle" class="t3">Swipe down or Done returns you to Feed, where you were.</text>
  <rect x="195" y="890" width="120" height="5" rx="2.5" fill="#12171c"/>

  <!-- notification -->
  <rect class="sf" x="510" y="606" width="400" height="146" rx="20" stroke="#b6bec8"/>
  <text x="530" y="634" class="t3">METISTRY · now</text>
  <text x="530" y="658" class="hd">Request #97 needs a decision</text>
  <text x="530" y="680" class="t2">drey-dev wants to write a taper section to</text>
  <text x="530" y="698" class="t2">Knowledge/Areas/Health/Taper.md</text>
  <path class="ln" d="M510 710 H910"/>
  <text x="576" y="732" text-anchor="middle" class="acc" font-size="13">Approve</text>
  <path class="ln" d="M642 710 V752"/>
  <text x="708" y="732" text-anchor="middle" class="acc" font-size="13">Show diff</text>
  <path class="ln" d="M776 710 V752"/>
  <text x="842" y="732" text-anchor="middle" class="acc" font-size="13">Later</text>

  <!-- callouts -->
  <circle class="cw" cx="446" cy="132" r="10"/><text class="cn" x="446" y="136">1</text>
  <circle class="cw" cx="470" cy="224" r="10"/><text class="cn" x="470" y="228">2</text>
  <circle class="cw" cx="470" cy="480" r="10"/><text class="cn" x="470" y="484">3</text>
  <circle class="cw" cx="470" cy="576" r="10"/><text class="cn" x="470" y="580">4</text>
  <circle class="cw" cx="470" cy="670" r="10"/><text class="cn" x="470" y="674">5</text>
  <circle class="cw" cx="496" cy="640" r="10"/><text class="cn" x="496" y="644">6</text>

  <!-- legend -->
  <text x="510" y="110" class="h2">Callouts</text>
  <text x="510" y="146" class="lg">① <tspan font-weight="600">The bell is the entry point</tspan>, in the</text>
  <text x="524" y="166" class="lg">navigation bar's trailing slot with the</text>
  <text x="524" y="186" class="lg">unread count — the only badge in the</text>
  <text x="524" y="206" class="lg">product (P2). Needs You left the tab bar,</text>
  <text x="524" y="226" class="lg">which is now Chat · Feed · Work ·</text>
  <text x="524" y="246" class="lg">Knowledge · More.</text>

  <text x="510" y="286" class="lg">② A <tspan font-weight="600">sheet at the large detent</tspan>, because a</text>
  <text x="524" y="306" class="lg">queue is a list and not a glance. Grabber</text>
  <text x="524" y="326" class="lg">shown; swipe down or Done returns you to</text>
  <text x="524" y="346" class="lg">exactly where you were. Answering a</text>
  <text x="524" y="366" class="lg">request should not cost you your place.</text>

  <text x="510" y="406" class="lg">③ <tspan font-weight="600">Six answers, fixed order</tspan>, wrapped to two</text>
  <text x="524" y="426" class="lg">rows: Approve · Revise · Decline · Skip,</text>
  <text x="524" y="446" class="lg">then Approve as Work (only where the</text>
  <text x="524" y="466" class="lg">payload suggests one) and Later, which</text>
  <text x="524" y="486" class="lg">snoozes — it never ends the request. The</text>
  <text x="524" y="506" class="lg">card previews <tspan font-style="italic">exactly what will happen</tspan>;</text>
  <text x="524" y="526" class="lg">agent-authored content sits on the agent</text>
  <text x="524" y="546" class="lg">wash and never borrows control styling.</text>

  <text x="510" y="790" class="lg">④ Swipe exposes the reversible answers only — leading Approve, trailing</text>
  <text x="524" y="810" class="lg">Later. Decline has per-kind consequences, so it keeps its button and its</text>
  <text x="524" y="830" class="lg">confirmation.</text>

  <text x="510" y="870" class="lg">⑤ A decided card collapses to a one-line receipt, with Undo only where</text>
  <text x="524" y="890" class="lg">the underlying operation is reversible. Empty ≠ absent: "Queue is clear"</text>
  <text x="524" y="910" class="lg">is a good state and reads like one (§3.15).</text>

  <text x="510" y="930" class="lg">⑥ <tspan font-weight="600">The notification is this queue, surfaced by the OS</tspan> — same payload, same</text>
  <text x="524" y="950" class="lg">question, answered without opening the app, but only the answers that are</text>
  <text x="524" y="970" class="lg">safe to give from a lock screen. It stays thin (wake-and-fetch) and carries</text>
  <text x="524" y="990" class="lg">no authority. One queue, two doors — never two implementations.</text>
  <text x="24" y="990" class="t3">docs/ops/reply-feedback.md · design-system.md §3.18</text>
  <text x="24" y="1008" class="t3">Needs You bell + panel · §3.9 request card · §3.14 notifications</text>
</svg>

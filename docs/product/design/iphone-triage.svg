<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 940" width="940" height="940" role="img" aria-labelledby="ttl desc">
  <title id="ttl">iPhone — triage cards and the actionable notification</title>
  <desc id="desc">Annotated wireframe at 390 by 844 points: triage cards each previewing exactly what will happen, with Allow, Request changes and Deny actions; a decided card collapsed to a receipt; the empty state; and above the screen an actionable lock-screen notification offering the same three choices from the same payload.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 } .lt { font-size: 30px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .snk { fill: #eef0f3; stroke: #d9dee4 }
    .agq { fill: #f1ecfc; stroke: #e2d9f7 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
  </style>

  <rect width="940" height="940" fill="#ffffff"/>
  <text x="24" y="30" class="h2">iPhone — Triage</text>
  <text x="24" y="50" class="t2">The card previews exactly what will happen · the same three choices ride the notification</text>

  <rect x="60" y="70" width="390" height="844" rx="46" fill="#f6f7f9" stroke="#b6bec8" stroke-width="2"/>
  <rect x="165" y="78" width="180" height="28" rx="14" fill="#12171c"/>
  <text x="88" y="102" class="t3">9:41</text>

  <text x="84" y="164" class="lt">Triage</text>
  <text x="426" y="158" class="t2" text-anchor="end">3 waiting</text>

  <!-- card 1 -->
  <rect class="sf" x="76" y="186" width="358" height="212" rx="16"/>
  <text x="94" y="212">📝</text>
  <rect x="118" y="198" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="126" y="211" class="ag mono">drey-dev</text>
  <text x="94" y="242" class="hd">Write a taper section to Health</text>
  <text x="94" y="262" class="t3">note · classification: knowledge · #97 · today</text>
  <rect class="snk" x="94" y="274" width="322" height="62" rx="10"/>
  <text x="106" y="294" class="mono t2">+ Knowledge/Areas/Health/Taper.md</text>
  <text x="106" y="312" class="mono t2">  ## Taper  (+18 lines, 180 words)</text>
  <text x="106" y="328" class="mono t3">  agent-authored — shown as data</text>
  <rect x="94" y="348" width="96" height="36" rx="10" fill="#2b5fd0"/><text x="142" y="371" fill="#fff" text-anchor="middle" font-size="14">Allow</text>
  <rect class="sf" x="198" y="348" width="140" height="36" rx="10" stroke="#b6bec8"/><text x="268" y="371" text-anchor="middle" font-size="14">Request changes</text>
  <rect class="sf" x="346" y="348" width="70" height="36" rx="10" stroke="#b3261e"/><text x="381" y="371" text-anchor="middle" font-size="14" class="bad">Deny</text>

  <!-- card 2: swipe -->
  <rect class="sf" x="76" y="410" width="358" height="104" rx="16"/>
  <text x="94" y="436">🛡️</text>
  <rect x="118" y="422" width="66" height="18" rx="9" fill="#eef0f3"/><text x="126" y="435" class="t3 mono">ops-bot</text>
  <text x="94" y="466" class="hd">Extend grant: tier areas → +Areas/Work</text>
  <text x="94" y="486" class="t3">grant · #98 · widens what this agent can read</text>
  <rect x="352" y="410" width="82" height="104" rx="16" fill="#b3261e"/>
  <text x="393" y="468" fill="#fff" text-anchor="middle" font-size="14">Deny</text>

  <!-- card 3: decided receipt -->
  <rect class="sf" x="76" y="526" width="358" height="62" rx="16"/>
  <text x="94" y="558" class="ok">✓</text>
  <text x="116" y="558" class="t2">Allowed #94 · committed 4a1c93e · 8h ago</text>
  <text x="116" y="578" class="acc" font-size="13">Undo</text>

  <!-- empty state -->
  <rect class="ln" x="76" y="612" width="358" height="128" rx="16" stroke-dasharray="4 4"/>
  <text x="255" y="660" text-anchor="middle" font-size="24" fill="#646d77">✓</text>
  <text x="255" y="690" text-anchor="middle" class="t2">Queue is clear.</text>
  <text x="255" y="712" text-anchor="middle" class="t3">Proposals appear here when an agent asks for</text>
  <text x="255" y="728" text-anchor="middle" class="t3">something outside its grant.</text>

  <!-- tab bar -->
  <path class="ln" d="M62 796 H448"/>
  <rect x="62" y="796" width="386" height="84" fill="#ffffff" opacity="0.96"/>
  <g text-anchor="middle">
    <text x="116" y="828" font-size="17">◈</text><text x="116" y="846" class="t3" font-size="10">Feed</text>
    <text x="180" y="828" font-size="17">💬</text><text x="180" y="846" class="t3" font-size="10">Chat</text>
    <text x="244" y="828" font-size="17">📥</text><text x="244" y="846" class="t3" font-size="10">Capture</text>
    <text x="308" y="828" class="acc" font-size="17">📝</text><text x="308" y="846" class="acc" font-size="10">Triage</text>
    <text x="376" y="828" font-size="17">•••</text><text x="376" y="846" class="t3" font-size="10">More</text>
  </g>
  <rect x="195" y="890" width="120" height="5" rx="2.5" fill="#12171c"/>

  <!-- notification -->
  <rect class="sf" x="510" y="606" width="400" height="146" rx="20" stroke="#b6bec8"/>
  <text x="530" y="634" class="t3">METISTRY · now</text>
  <text x="530" y="658" class="hd">Proposal #97 needs a decision</text>
  <text x="530" y="680" class="t2">drey-dev wants to write a taper section to</text>
  <text x="530" y="698" class="t2">Knowledge/Areas/Health/Taper.md</text>
  <path class="ln" d="M510 710 H910"/>
  <text x="576" y="732" text-anchor="middle" class="acc" font-size="13">Allow</text>
  <path class="ln" d="M642 710 V752"/>
  <text x="708" y="732" text-anchor="middle" class="acc" font-size="13">Show diff</text>
  <path class="ln" d="M776 710 V752"/>
  <text x="842" y="732" text-anchor="middle" class="bad" font-size="13">Deny</text>

  <!-- callouts -->
  <circle class="cw" cx="470" cy="300" r="10"/><text class="cn" x="470" y="304">1</text>
  <circle class="cw" cx="470" cy="366" r="10"/><text class="cn" x="470" y="370">2</text>
  <circle class="cw" cx="470" cy="462" r="10"/><text class="cn" x="470" y="466">3</text>
  <circle class="cw" cx="470" cy="556" r="10"/><text class="cn" x="470" y="560">4</text>
  <circle class="cw" cx="470" cy="676" r="10"/><text class="cn" x="470" y="680">5</text>
  <circle class="cw" cx="496" cy="640" r="10"/><text class="cn" x="496" y="644">6</text>

  <!-- legend -->
  <text x="510" y="110" class="h2">Callouts</text>
  <text x="510" y="146" class="lg">① The card previews <tspan font-style="italic">exactly what will</tspan></text>
  <text x="524" y="166" class="lg"><tspan font-style="italic">happen</tspan> — the path, the diff size, the grant</text>
  <text x="524" y="186" class="lg">that would widen. Agent-authored content</text>
  <text x="524" y="206" class="lg">sits on the sunken/agent wash and is</text>
  <text x="524" y="226" class="lg">labelled; it never borrows control styling.</text>

  <text x="510" y="266" class="lg">② Three actions, always in this order:</text>
  <text x="524" y="286" class="lg">Allow (primary) · Request changes</text>
  <text x="524" y="306" class="lg">(secondary, opens the free-text escape) ·</text>
  <text x="524" y="326" class="lg">Deny (destructive outline, and it confirms</text>
  <text x="524" y="346" class="lg">when the proposal cannot be re-raised).</text>

  <text x="510" y="386" class="lg">③ iOS swipe actions mirror the buttons —</text>
  <text x="524" y="406" class="lg">leading Allow, trailing Deny — so the</text>
  <text x="524" y="426" class="lg">gesture and the control agree.</text>

  <text x="510" y="466" class="lg">④ A decided card collapses to a one-line</text>
  <text x="524" y="486" class="lg">receipt, with Undo only where the</text>
  <text x="524" y="506" class="lg">underlying operation is reversible.</text>

  <text x="510" y="546" class="lg">⑤ Empty ≠ absent. "Queue is clear" is a</text>
  <text x="524" y="566" class="lg">good state and reads like one (§3.15).</text>

  <text x="510" y="790" class="lg">⑥ The notification renders the same</text>
  <text x="524" y="810" class="lg">prompt payload: same question, same</text>
  <text x="524" y="830" class="lg">options, answered without opening the app.</text>
  <text x="524" y="850" class="lg">The payload stays thin — wake-and-fetch —</text>
  <text x="524" y="870" class="lg">and a tap carries no extra authority.</text>
  <text x="24" y="928" class="t3">docs/product/design-system.md §3.9 triage card · §3.14 notifications with actions · §3.15 empty states</text>
</svg>

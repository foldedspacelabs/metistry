  <!-- legend -->
  <g>
    <text x="770" y="90" class="hd">Callouts</text>
    <text x="770" y="114" class="lg">① <tspan font-weight="600">Insights is what is left of System</tspan></text>
    <text x="782" y="130" class="lg">once the configuration left it. The old</text>
    <text x="782" y="146" class="lg">section answered two questions at once</text>
    <text x="782" y="162" class="lg">— "set this up" and "how is it going"</text>
    <text x="782" y="178" class="lg">— and you visit them on completely</text>
    <text x="782" y="194" class="lg">different days. The name is a proposal</text>
    <text x="782" y="210" class="lg">and the owner's to change.</text>
    <text x="770" y="238" class="lg">② <tspan font-weight="600">absent ≠ zero.</tspan> An unconfigured cost</text>
    <text x="782" y="254" class="lg">source shows an em dash and says why;</text>
    <text x="782" y="270" class="lg">a configured one showing $0.00 is a</text>
    <text x="782" y="286" class="lg">different, and much better, fact (P5).</text>
    <text x="770" y="314" class="lg">③ The cap is drawn on the chart, not</text>
    <text x="782" y="330" class="lg">written beside it, because the question</text>
    <text x="782" y="346" class="lg">is "how often did I cross it". Days</text>
    <text x="782" y="362" class="lg">over the daily limit carry the <tspan class="deg">degraded</tspan></text>
    <text x="782" y="378" class="lg">tint and a label — never colour alone.</text>
    <text x="770" y="406" class="lg">④ Shadow mode is a fraction of turns</text>
    <text x="782" y="422" class="lg">run twice; the second answer is</text>
    <text x="782" y="438" class="lg">recorded and never served. <tspan font-weight="600">Agreement</tspan></text>
    <text x="782" y="454" class="lg"><tspan font-weight="600">without the sample size is a rumour</tspan>, so</text>
    <text x="782" y="470" class="lg">the denominator is on screen with it.</text>
    <text x="770" y="498" class="lg">⑤ <tspan font-weight="600">Read-only, on purpose.</tspan> A number and</text>
    <text x="782" y="514" class="lg">the knob that moves it in one place is</text>
    <text x="782" y="530" class="lg">how a dashboard becomes a console</text>
    <text x="782" y="546" class="lg">nobody trusts. The knob is in Settings,</text>
    <text x="782" y="562" class="lg">and this screen links to it.</text>
    <text x="770" y="590" class="lg">⑥ Everything here is <tspan font-style="italic">derived</tspan>: Postgres,</text>
    <text x="782" y="606" class="lg">through a named query, through</text>
    <text x="782" y="622" class="lg"><tspan class="mono">packages/queries</tspan>. Invariant 3, and the</text>
    <text x="782" y="638" class="lg">reason a rebuilt database costs this</text>
    <text x="782" y="654" class="lg">screen its history and nothing else.</text>
    <text x="770" y="686" class="hd">Empty and absent</text>
    <text x="770" y="708" class="lg">A fresh instance says "nothing has run</text>
    <text x="770" y="724" class="lg">yet" — an empty state, not an error.</text>
    <text x="770" y="740" class="lg">A collector nobody configured is grey</text>
    <text x="770" y="756" class="lg">and named, and counts toward nothing.</text>
  </g>
  <text x="24" y="758" class="t3">docs/ops/compute.md (shadow mode) · design-system.md §3.1 navigation · §3.13 status rows · §3.15 empty states · invariant 3</text>

  <text x="228" y="664" class="t2">deep</text><text x="330" y="664" class="mono t3">openrouter/claude-sonnet-5</text><text x="560" y="664" class="t2">0.9 M in · 180 K out</text><text x="720" y="664" class="deg" font-size="12" text-anchor="end">p50 4.1 s · p95 11 s</text>
  <text x="228" y="696" class="t3">Nothing here is a control. The assignment that made these numbers is Settings → Compute.</text>


<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — Insights: what the instance did, measured</title>
  <desc id="desc">Annotated wireframe of the Insights section, which is what is left of the old System section once status, compute, devices and instances became Settings panes and setup became an app-menu item. Spend tiles for today and the month against the cap, thirty days of spend as bars with the days that crossed the daily limit tinted, run counts with failures and the worst failure streak, shadow-mode agreement between the local and hosted models with its sample size, and token and latency trends per tier. Nothing on this screen is a control: every number is read, and the thing that would change it lives in Settings.</desc>

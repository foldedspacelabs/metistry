<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — Settings: six panes, now holding Status, Compute and Devices &amp; Instances</title>
  <desc id="desc">Annotated wireframe of the Settings scene as the second ruling of 2026-09-17 leaves it: six panes — General, Status, Compute, Connections, Devices and Advanced. Status absorbs the old Services pane, because a service row already is a doctor row with Restart, Stop, Start and View Log on it; Compute is the canonical home of providers, models, tier assignments and budgets; Devices holds devices and instances with revoke and an honest reachability chip. The General pane is drawn in full as rows of label, control and one line of help, and the other five are indexed beneath it so every setting the app has is accounted for. Setup has left Settings for the Metistry app menu.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .ch { font-size: 12px; font-weight: 600 }
    .lb { fill: #4d565f; font-size: 12px; text-anchor: end }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .win { fill: #f6f7f9; stroke: #b6bec8 }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .sel { fill: #e6edfc } .snk { fill: #eef0f3; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="880" fill="#ffffff"/>
  <text x="24" y="30" class="h2">macOS — Settings</text>
  <text x="24" y="50" class="t2">Six panes · every row is label · control · one line of help · Status, Compute and Devices moved <tspan font-style="italic">in</tspan>; Set up… moved out, to the app menu</text>

  <rect class="win" x="24" y="66" width="720" height="790" rx="12"/>
  <circle cx="46" cy="86" r="6" fill="#ff5f57"/><circle cx="66" cy="86" r="6" fill="#febc2e"/><circle cx="86" cy="86" r="6" fill="#28c840"/>
  <text x="384" y="91" class="hd" text-anchor="middle">Settings</text>
  <!-- toolbar tabs: six -->
  <rect class="sel" x="112" y="110" width="84" height="30" rx="8"/>
  <text x="154" y="124" text-anchor="middle" font-size="13">⚙️</text><text x="154" y="136" class="ch" text-anchor="middle">General</text>
  <text x="246" y="124" text-anchor="middle" font-size="13">🩺</text><text x="246" y="136" class="t2" text-anchor="middle">Status</text>
  <text x="338" y="124" text-anchor="middle" font-size="13">🧠</text><text x="338" y="136" class="t2" text-anchor="middle">Compute</text>
  <text x="430" y="124" text-anchor="middle" font-size="13">🔌</text><text x="430" y="136" class="t2" text-anchor="middle">Connections</text>
  <text x="522" y="124" text-anchor="middle" font-size="13">📱</text><text x="522" y="136" class="t2" text-anchor="middle">Devices</text>
  <text x="614" y="124" text-anchor="middle" font-size="13">🛠️</text><text x="614" y="136" class="t2" text-anchor="middle">Advanced</text>
  <path class="ln" d="M24 150 H744"/>

  <!-- GENERAL -->
  <text x="256" y="176" class="t3">INSTANCE</text><path class="ln" d="M330 172 H716"/>
  <text x="240" y="204" class="lb">Active instance</text>
  <rect class="sf" x="256" y="190" width="256" height="20" rx="6"/><text x="266" y="204" class="mono">~/Development/metistry-instance ⌄</text>
  <rect class="sf" x="520" y="190" width="66" height="20" rx="6"/><text x="553" y="204" class="t2" text-anchor="middle">Choose…</text>
  <rect class="sf" x="594" y="190" width="104" height="20" rx="6"/><text x="646" y="204" class="t2" text-anchor="middle">Open in Finder</text>
  <text x="256" y="224" class="t3">Every <tspan class="mono">metistry</tspan> verb runs with this path. It decides which install the app talks to.</text>

  <text x="240" y="250" class="lb">Recents</text>
  <text x="256" y="250" class="t2">3 remembered</text>
  <rect class="sf" x="352" y="238" width="58" height="18" rx="6"/><text x="381" y="251" class="t2" text-anchor="middle">Forget</text>

  <text x="240" y="278" class="lb">Assistant name</text>
  <text x="256" y="278" class="mono t2">‹the name in identity.yaml›</text>
  <rect class="snk" x="450" y="266" width="66" height="18" rx="6"/><text x="483" y="279" class="t3" text-anchor="middle">read-only</text>
  <text x="256" y="298" class="t3">It lives in <tspan class="mono">identity.yaml</tspan> and nowhere else — a protected path, so only your own hand writes it.</text>

  <text x="256" y="336" class="t3">STARTUP</text><path class="ln" d="M322 332 H716"/>
  <text x="240" y="362" class="lb">This app</text>
  <rect x="256" y="352" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="360" r="6" fill="#ffffff"/>
  <text x="296" y="365" class="t2">Start Metistry at login</text>
  <circle cx="450" cy="360" r="4" class="ok"/><text x="462" y="365" class="ok" font-size="12">registered</text>
  <text x="256" y="382" class="t3">The app only. macOS may hold the registration until you allow it in Login Items.</text>

  <text x="240" y="410" class="lb">The install</text>
  <rect x="256" y="400" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="408" r="6" fill="#ffffff"/>
  <text x="296" y="413" class="t2">Run services in the background</text>
  <circle cx="490" cy="408" r="4" class="deg"/><text x="502" y="413" class="deg" font-size="12">awaiting approval</text>
  <rect class="sf" x="606" y="400" width="106" height="18" rx="6"/><text x="659" y="413" class="t2" text-anchor="middle">Open Login Items…</text>
  <text x="256" y="430" class="t3">The install's services, not this app — the two are constantly confused.</text>

  <text x="256" y="468" class="t3">UPDATES</text><path class="ln" d="M322 464 H716"/>
  <text x="240" y="494" class="lb">This app</text>
  <text x="256" y="494" class="mono">1.4.1</text>
  <text x="310" y="494" class="t3">one signed appcast, so one channel</text>
  <rect class="sf" x="520" y="482" width="72" height="18" rx="6"/><text x="556" y="495" class="t2" text-anchor="middle">Check Now</text>
  <text x="600" y="494" class="t3">last checked 09:12</text>
  <text x="240" y="524" class="lb">Automatically</text>
  <rect x="256" y="514" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="522" r="6" fill="#ffffff"/>
  <text x="296" y="527" class="t2">Check for updates automatically</text>
  <text x="256" y="544" class="t3">Sparkle owns this preference and reads it itself; the app keeps no copy of it.</text>
  <text x="240" y="572" class="lb">Product runtime</text>
  <text x="256" y="572" class="mono">0.9.3</text>
  <text x="310" y="572" class="t3">pinned in <tspan class="mono">metistry.lock</tspan>, source: release, updated 2026-09-14</text>
  <text x="256" y="592" class="t3">Two channels, both signed. The runtime updates through <tspan class="mono">metistry update</tspan>.</text>

  <text x="256" y="630" class="t3">SETTING UP AGAIN</text><path class="ln" d="M370 626 H716"/>
  <text x="240" y="656" class="lb">First launch</text>
  <rect class="snk" x="256" y="644" width="230" height="20" rx="6"/><text x="266" y="658" class="t3">Metistry ▸ Run setup again…</text>
  <text x="496" y="658" class="t3">— the app menu, not this window</text>
  <text x="256" y="676" class="t3">A once-only thing lives where macOS puts once-only things. It still runs nothing until you press Run on a step.</text>

  <!-- index of the other five panes -->
  <path d="M48 704 H716" stroke="#d9dee4" stroke-dasharray="4 4" fill="none"/>
  <text x="48" y="724" class="t3">THE OTHER FIVE PANES — EVERY ROW THE APP HAS, PLUS THE THREE THAT ARRIVED</text>
  <g>
    <text x="48" y="748" class="ch">Status <tspan class="t3" font-weight="400">(was Services)</tspan></text>
    <text x="48" y="768" class="t3">Summary — 26 ok · 1 degraded ·</text>
    <text x="48" y="782" class="t3">1 not configured</text>
    <text x="48" y="796" class="t3">A doctor row per component, grouped</text>
    <text x="48" y="810" class="t3">by kind · Restart · Stop · Start · Log</text>
    <text x="48" y="824" class="t3">Shape — compose or launchd, read-only</text>

    <text x="296" y="748" class="ch">Compute</text>
    <text x="296" y="768" class="t3">Providers — URL, locality, ZDR claim,</text>
    <text x="296" y="782" class="t3">key present? · Add · Test · Remove</text>
    <text x="296" y="796" class="t3">Assignments per tier · shadow rate</text>
    <text x="296" y="810" class="t3">Budgets — daily, monthly, the action</text>
    <text x="296" y="824" class="t3">Local model servers · RAM headroom</text>

    <text x="544" y="748" class="ch">Devices &amp; Instances</text>
    <text x="544" y="768" class="t3">This Mac — local owner, loopback</text>
    <text x="544" y="782" class="t3">Sessions — passkey, last seen · Revoke</text>
    <text x="544" y="796" class="t3">Instances — reachability, last seen</text>
    <text x="544" y="814" class="ch">Connections · Advanced</text>
    <text x="544" y="830" class="t3">unchanged — sign-in, repo, bridges,</text>
    <text x="544" y="844" class="t3">secrets (names only) · runtime · logs</text>
  </g>

  <!-- callouts -->
  <g>
    <circle class="cw" cx="100" cy="125" r="10"/><text class="cn" x="100" y="129">1</text>
    <circle class="cw" cx="240" cy="224" r="10"/><text class="cn" x="240" y="228">2</text>
    <circle class="cw" cx="238" cy="430" r="10"/><text class="cn" x="238" y="434">3</text>
    <circle class="cw" cx="536" cy="278" r="10"/><text class="cn" x="536" y="282">4</text>
    <circle class="cw" cx="756" cy="125" r="10"/><text class="cn" x="756" y="129">5</text>
    <circle class="cw" cx="530" cy="658" r="10"/><text class="cn" x="530" y="662">6</text>
  </g>

  <!-- legend -->
  <g>
    <text x="770" y="176" class="hd">Callouts</text>
    <text x="770" y="200" class="lg">① Six panes, and each is a question</text>
    <text x="782" y="216" class="lg">you have: which install · is it</text>
    <text x="782" y="232" class="lg">running · what answers a turn · what</text>
    <text x="782" y="248" class="lg">is it connected to · who is signed</text>
    <text x="782" y="264" class="lg">in · get me out. <tspan font-weight="600">Status absorbed</tspan></text>
    <text x="782" y="280" class="lg"><tspan font-weight="600">Services</tspan>, because a service row <tspan font-style="italic">is</tspan> a</text>
    <text x="782" y="296" class="lg">doctor row with four controls on it —</text>
    <text x="782" y="312" class="lg">so three panes arrived and the count</text>
    <text x="782" y="328" class="lg">went from four to six, not to seven.</text>
    <text x="770" y="356" class="lg">② Every row is <tspan font-weight="600">label · control · one</tspan></text>
    <text x="782" y="372" class="lg"><tspan font-weight="600">line of help</tspan>. Today's panes explain</text>
    <text x="782" y="388" class="lg">themselves in three-line paragraphs</text>
    <text x="782" y="404" class="lg">about overlays and principals; the</text>
    <text x="782" y="420" class="lg">rest belongs in docs, not under a</text>
    <text x="782" y="436" class="lg">toggle. That verbosity is the</text>
    <text x="782" y="452" class="lg">complaint this pane answers.</text>
    <text x="770" y="480" class="lg">③ The two registrations sit together</text>
    <text x="782" y="496" class="lg">because they are always confused, and</text>
    <text x="782" y="512" class="lg">each one's help says which it is.</text>
    <text x="782" y="528" class="lg">"Awaiting approval" is the normal</text>
    <text x="782" y="544" class="lg">first answer, so it reads as a step.</text>
    <text x="770" y="572" class="lg">④ The assistant's name is shown and</text>
    <text x="782" y="588" class="lg">not editable. It lives in one file,</text>
    <text x="782" y="604" class="lg">and that file is your hand — which</text>
    <text x="782" y="620" class="lg">makes a second install a clone.</text>
    <text x="770" y="648" class="lg">⑤ <tspan font-weight="600">Compute is back, and this is now</tspan></text>
    <text x="782" y="664" class="lg"><tspan font-weight="600">its home.</tspan> It is configuration, not</text>
    <text x="782" y="680" class="lg">daily reading: providers, models, the</text>
    <text x="782" y="696" class="lg">tier assignments and the budgets.</text>
    <text x="782" y="712" class="lg">What those choices <tspan font-style="italic">cost</tspan> is Insights,</text>
    <text x="782" y="728" class="lg">and the two link to each other.</text>
    <text x="782" y="744" class="lg t3">P6 still wants an /api/compute so the</text>
    <text x="782" y="758" class="lg t3">other clients can reach it too.</text>
    <text x="770" y="786" class="lg">⑥ <tspan font-weight="600">Setup left for the app menu.</tspan> It is</text>
    <text x="782" y="802" class="lg">not a section and not a pane: you run</text>
    <text x="782" y="818" class="lg">it once, and this row is only a</text>
    <text x="782" y="834" class="lg">signpost to where it lives.</text>
    <text x="770" y="856" class="lg t3">Secrets still shows names and scope only.</text>
  </g>
  <text x="24" y="866" class="t3">apps/macos/sources/kit/settings-view.swift · docs/ops/mac-app.md · docs/ops/compute.md · design-system.md P10</text>
</svg>

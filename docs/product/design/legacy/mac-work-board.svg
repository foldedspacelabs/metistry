  <path class="ln" d="M228 470 H902"/>
  <text x="228" y="496" class="bad" font-size="12">✕ held by ops-bot, not by user — claim it first</text>
  <text x="228" y="516" class="t3">The card snapped back. The refusal is the service's own sentence, never one the panel invented.</text>
  <text x="228" y="548" class="t3">Clicking a card opens its <tspan font-style="italic">room</tspan> when one exists — the card's room is the conversation about it. A card with</text>
  <text x="228" y="566" class="t3">no room opens a detail popover: title, owner, lease, external ref, last activity, the artifact it was cut from.</text>
  <text x="228" y="598" class="t2">Keyboard: focus a card, press <tspan font-weight="600">m</tspan>, choose a column — the same targets, the same routes, the same refusals.</text>
  <text x="228" y="618" class="t2">Esc closes any picker; Enter opens the card. A board that needs a mouse is a board you cannot use half the time.</text>

  <!-- callouts -->
  <g>
    <circle class="cw" cx="214" cy="176" r="10"/><text class="cn" x="214" y="180">1</text>
    <circle class="cw" cx="396" cy="157" r="10"/><text class="cn" x="396" y="161">2</text>
    <circle class="cw" cx="548" cy="272" r="10"/><text class="cn" x="548" y="276">3</text>
    <circle class="cw" cx="214" cy="492" r="10"/><text class="cn" x="214" y="496">4</text>
    <circle class="cw" cx="662" cy="256" r="10"/><text class="cn" x="662" y="260">5</text>
    <circle class="cw" cx="214" cy="594" r="10"/><text class="cn" x="214" y="598">6</text>

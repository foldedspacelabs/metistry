<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — Work › Board, six columns over the work table</title>
  <desc id="desc">Annotated wireframe: the Work section of the six-section sidebar, expanded so that Board, Projects, Artifacts and Rooms are children of the Work row and Board is the selected child — there is no second navigation inside the section. Six columns — Backlog, Addressed to, In Progress, Needs You, Done, Reported — each a case in one named query. A card is mid-drag from Backlog to Addressed to with the owner picker open, an escalated card carries the reason it stalled, and a refusal is printed under the board in the service's own words. Wider viewBox than the other Mac sheets because six columns need the width. The toolbar carries the capture plus and the Needs You bell with its count.</desc>

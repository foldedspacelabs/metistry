  <!-- legend -->
  <g>
    <text x="950" y="90" class="hd">Callouts</text>
    <text x="950" y="114" class="lg">① Six columns are one CASE in</text>
    <text x="962" y="130" class="lg"><tspan class="mono">board.yaml</tspan>, first match wins. Nothing</text>
    <text x="962" y="146" class="lg">was migrated and no fifth status value</text>
    <text x="962" y="162" class="lg">exists. The header counts <tspan font-style="italic">every</tspan> card;</text>
    <text x="962" y="178" class="lg">the limit is per column, so a busy</text>
    <text x="962" y="194" class="lg">Backlog never crowds Needs You out.</text>
    <text x="950" y="222" class="lg">② <tspan font-weight="600">"Addressed to", not "Assigned".</tspan></text>
    <text x="962" y="238" class="lg"><tspan class="mono">owner</tspan> is informational — a name, never</text>
    <text x="962" y="254" class="lg">a lease. Open + owner is exactly</text>
    <text x="962" y="270" class="lg">"addressed to, not started". It is the</text>
    <text x="962" y="286" class="lg">one drop that needs a value, so it</text>
    <text x="962" y="302" class="lg">opens a picker; and a human may</text>
    <text x="962" y="318" class="lg">address a card to any crew, while an</text>
    <text x="962" y="334" class="lg">agent cannot address one at all.</text>
    <text x="950" y="362" class="lg">③ A <tspan class="bad">lapsed lease stays here</tspan> and says</text>
    <text x="962" y="378" class="lg">so. Moving it would hide that a claim</text>
    <text x="962" y="394" class="lg">was dropped. The red number beside a</text>
    <text x="962" y="410" class="lg">count is that column's escalations.</text>
    <text x="950" y="438" class="lg">④ Optimistic, then authoritative: the</text>
    <text x="962" y="454" class="lg">card moves, the route runs, the board</text>
    <text x="962" y="470" class="lg">refetches either way. When the panel</text>
    <text x="962" y="486" class="lg">and the statement disagree, the</text>
    <text x="962" y="502" class="lg">statement wins (invariant 8).</text>
    <text x="950" y="530" class="lg">⑤ Needs You here is <tspan class="mono">status = blocked</tspan>,</text>
    <text x="962" y="546" class="lg">the same words as the 🔔 queue — a</text>
    <text x="962" y="562" class="lg">board column, not a second copy of it</text>
    <text x="962" y="578" class="lg">— and the one route back to open is</text>
    <text x="962" y="594" class="lg">your hand.</text>
    <text x="950" y="622" class="lg">⑥ Every drag has a keyboard</text>
    <text x="962" y="638" class="lg">equivalent, and it is the same route.</text>
    <text x="950" y="666" class="lg">⑦ Board · Projects · Artifacts · Rooms</text>
    <text x="962" y="682" class="lg">are four views of <tspan font-style="italic">one</tspan> object graph: a</text>
    <text x="962" y="698" class="lg">task has a room, produces an artifact,</text>
    <text x="962" y="714" class="lg">belongs to a project. Four <tspan font-style="italic">sections</tspan> made</text>
    <text x="962" y="730" class="lg">the reader do that join; a segmented</text>
    <text x="962" y="746" class="lg">control <tspan font-style="italic">inside</tspan> one section buried them</text>
    <text x="962" y="762" class="lg">a click deep. <tspan font-weight="600">Expanding the sidebar row</tspan></text>
    <text x="962" y="778" class="lg"><tspan font-weight="600">is the answer to both</tspan> (2026-09-17).</text>
  </g>
  <text x="24" y="758" class="t3">docs/ops/board.md · docs/ops/threads.md · design-system.md §3.1 navigation · §3.10 task card and drag-to-dispatch · §3.12 project header</text>
</svg>

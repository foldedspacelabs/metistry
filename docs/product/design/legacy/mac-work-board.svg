  <text x="352" y="230" class="t3">review artifact</text><text x="352" y="244" class="t3">taper-plan</text>
  <rect class="sf" x="342" y="262" width="104" height="58" rx="10"/>
  <text x="352" y="278" class="mono t3">wrk_01H8…205</text>
  <text x="352" y="296" class="t3">draft release</text><text x="352" y="310" class="t3">notes</text>

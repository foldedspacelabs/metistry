<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 900" width="940" height="900" role="img" aria-labelledby="ttl desc">
  <title id="ttl">PWA — narrow layout, installed to the Home Screen</title>
  <desc id="desc">Annotated wireframe below the 900 pixel breakpoint: the console PWA in standalone display mode with a bottom tab bar of exactly five items — Chat, Feed, Work, Knowledge and a More disclosure holding Agents, Insights and Settings — padded by the bottom safe-area inset. Capture is a plus button in the header and the request queue hangs off a bell in the same header with its unread count, so neither is a tab. A sticky header inset by the top safe area, activity feed rows, and the dark theme-color meta matching the token background.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 15px; }
    .t2 { fill: #4d565f; font-size: 13px } .t3 { fill: #646d77; font-size: 12px }
    .hd { font-size: 16px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 } .lt { font-size: 28px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 13px }
    .sa { fill: #e6edfc; stroke: #2b5fd0; stroke-dasharray: 3 3 }
  </style>

  <rect width="940" height="900" fill="#ffffff"/>
  <text x="24" y="30" class="h2">PWA — narrow (&lt; 900px), installed</text>
  <text x="24" y="50" class="t2">display: standalone · four sections plus More, five items in all · the same &lt;nav id="nav"&gt; markup that becomes the six-row sidebar at ≥900px</text>

  <rect x="60" y="70" width="390" height="800" rx="40" fill="#f6f7f9" stroke="#b6bec8" stroke-width="2"/>
  <rect x="165" y="78" width="180" height="26" rx="13" fill="#12171c"/>
  <text x="88" y="100" class="t3">9:41</text>

  <!-- safe area top -->
  <rect class="sa" x="62" y="108" width="386" height="20" opacity="0.7"/>
  <text x="255" y="122" text-anchor="middle" class="acc" font-size="10">env(safe-area-inset-top)</text>

  <!-- sticky header -->
  <rect x="62" y="128" width="386" height="52" fill="#ffffff" opacity="0.96"/>
  <path class="ln" d="M62 180 H448"/>
  <text x="84" y="162" class="lt">Metistry</text>
  <text x="380" y="160" class="acc" text-anchor="end" font-size="17">＋</text>
  <text x="426" y="161" text-anchor="end" font-size="17">🔔</text>
  <circle cx="430" cy="142" r="9" fill="#2b5fd0"/><text x="430" y="146" fill="#fff" font-size="10" text-anchor="middle">4</text>

  <!-- filters -->
  <rect x="84" y="196" width="88" height="30" rx="15" fill="#e6edfc" stroke="#c6d6f7"/><text x="98" y="216" class="acc" font-size="13">All Agents ⌄</text>
  <rect x="180" y="196" width="96" height="30" rx="15" class="sf"/><text x="194" y="216" class="t2" font-size="13">All Projects ⌄</text>

  <!-- feed rows -->
  <g>
    <text x="84" y="262">🔧</text>
    <rect x="110" y="248" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="118" y="261" class="ag mono">drey-dev</text>
    <text x="426" y="262" class="t3" text-anchor="end">2m ago</text>
    <text x="84" y="288" class="hd">knowledge_search · 3 hits</text>
    <text x="84" y="308" class="t2">mode: hybrid · Areas/Running · 14 ms</text>
    <path class="ln" d="M84 324 H426"/>

    <text x="84" y="356">📨</text>
    <rect x="110" y="342" width="78" height="18" rx="9" fill="#f1ecfc"/><text x="118" y="355" class="ag mono">drey-dev</text>
    <text x="426" y="356" class="t3" text-anchor="end">14m ago</text>
    <text x="84" y="382" class="hd">dispatch queued for ops-bot</text>
    <text x="84" y="402" class="deg" font-size="13">⏳ 3/3 open bundles — cap on metistry</text>
    <path class="ln" d="M84 418 H426"/>

    <text x="84" y="450">📝</text>
    <rect x="110" y="436" width="56" height="18" rx="9" fill="#eef0f3"/><text x="118" y="449" class="t3 mono">system</text>
    <text x="426" y="450" class="t3" text-anchor="end">1h ago</text>
    <text x="84" y="476" class="hd">proposal #97 awaiting you</text>
    <text x="84" y="496" class="t2">write Knowledge/Areas/Health/Taper.md</text>
    <path class="ln" d="M84 512 H426"/>

    <text x="84" y="544">⚠️</text>
    <rect x="110" y="530" width="92" height="18" rx="9" fill="#eef0f3"/><text x="118" y="543" class="t3 mono">github-state</text>
    <text x="426" y="544" class="t3" text-anchor="end">3h ago</text>
    <text x="84" y="570" class="hd">collector run failed</text>
    <text x="84" y="590" class="bad" font-size="13">✕ rate limited — retries at 14:20</text>
    <path class="ln" d="M84 606 H426"/>

    <text x="84" y="638">📰</text>
    <rect x="110" y="624" width="66" height="18" rx="9" fill="#eef0f3"/><text x="118" y="637" class="t3 mono">routine</text>
    <text x="426" y="638" class="t3" text-anchor="end">7h ago</text>
    <text x="84" y="664" class="hd">morning brief delivered</text>
    <text x="84" y="684" class="t2">4 items · 2 links · 1 question</text>
  </g>

  <!-- bottom tabs -->
  <path class="ln" d="M62 750 H448"/>
  <rect x="62" y="750" width="386" height="66" fill="#ffffff" opacity="0.96"/>
  <g text-anchor="middle">
    <text x="100" y="780" font-size="17">💬</text><text x="100" y="798" class="t3" font-size="10">Chat</text>
    <text x="178" y="780" class="acc" font-size="17">◈</text><text x="178" y="798" class="acc" font-size="10">Feed</text>
    <text x="255" y="780" font-size="17">🗂️</text><text x="255" y="798" class="t3" font-size="10">Work</text>
    <text x="332" y="780" font-size="17">📚</text><text x="332" y="798" class="t3" font-size="10">Knowledge</text>
    <text x="409" y="780" font-size="17">☰</text><text x="409" y="798" class="t3" font-size="10">More</text>
  </g>
  <rect class="sa" x="62" y="816" width="386" height="30" opacity="0.7"/>
  <text x="255" y="836" text-anchor="middle" class="acc" font-size="10">env(safe-area-inset-bottom)</text>
  <rect x="195" y="852" width="120" height="5" rx="2.5" fill="#12171c"/>

  <!-- callouts -->
  <circle class="cw" cx="470" cy="118" r="10"/><text class="cn" x="470" y="122">1</text>
  <circle class="cw" cx="470" cy="211" r="10"/><text class="cn" x="470" y="215">2</text>
  <circle class="cw" cx="454" cy="142" r="10"/><text class="cn" x="454" y="146">6</text>
  <circle class="cw" cx="470" cy="288" r="10"/><text class="cn" x="470" y="292">3</text>
  <circle class="cw" cx="470" cy="784" r="10"/><text class="cn" x="470" y="788">4</text>
  <circle class="cw" cx="470" cy="831" r="10"/><text class="cn" x="470" y="835">5</text>

  <!-- legend -->
  <text x="510" y="110" class="h2">Callouts</text>
  <text x="510" y="146" class="lg">① Installed to the Home Screen the app has</text>
  <text x="524" y="166" class="lg">no browser chrome, so the shell owns the</text>
  <text x="524" y="186" class="lg">insets: padding-top from safe-area-inset-top,</text>
  <text x="524" y="206" class="lg">viewport-fit=cover already in the meta.</text>
  <text x="524" y="226" class="lg">Two theme-color metas, media light / dark,</text>
  <text x="524" y="246" class="lg">matching the bg token in each appearance.</text>

  <text x="510" y="286" class="lg">② Filter chips replace bare &lt;select&gt;s. The</text>
  <text x="524" y="306" class="lg">ids stay (#feed-agent, #feed-project) so the</text>
  <text x="524" y="326" class="lg">shell tests and app.js are untouched.</text>

  <text x="510" y="366" class="lg">③ Feed row: the &lt;li class="feed-row"&gt; that</text>
  <text x="524" y="386" class="lg">ships today, restyled to §3.2. Every value</text>
  <text x="524" y="406" class="lg">still passes through esc(); the only change</text>
  <text x="524" y="426" class="lg">is CSS.</text>

  <text x="510" y="466" class="lg">④ Below 900px &lt;nav id="nav"&gt; is a fixed</text>
  <text x="524" y="486" class="lg">bottom tab bar: <tspan font-weight="600">four sections plus More</tspan> —</text>
  <text x="524" y="506" class="lg">five items, the same ceiling iOS keeps —</text>
  <text x="524" y="526" class="lg">and More holds Agents, Insights and</text>
  <text x="524" y="546" class="lg">Settings in the sidebar's own order.</text>
  <text x="524" y="566" class="lg">Each target is 44 × 44.</text>

  <text x="510" y="598" class="lg">⑤ padding-bottom: env(safe-area-inset-</text>
  <text x="524" y="618" class="lg">bottom) keeps the bar clear of the home</text>
  <text x="524" y="638" class="lg">indicator; the list gets matching scroll</text>
  <text x="524" y="658" class="lg">padding so the last row is reachable.</text>

  <text x="510" y="606" class="lg">⑥ <tspan font-weight="600">Capture and Needs You left the bar</tspan> and</text>
  <text x="524" y="626" class="lg">became header buttons: ＋ opens the capture</text>
  <text x="524" y="646" class="lg">composer in a &lt;dialog&gt;, 🔔 opens the request</text>
  <text x="524" y="666" class="lg">queue in another, carrying the unread count</text>
  <text x="524" y="686" class="lg">— still the only badge in the product. The</text>
  <text x="524" y="706" class="lg">existing data-triage hooks move inside it.</text>

  <text x="510" y="746" class="h2">Unchanged by the restyle</text>
  <text x="510" y="772" class="lg">Every id and data-* hook · esc() and the md.js</text>
  <text x="510" y="790" class="lg">whitelist · the sandboxed artifact iframe · all</text>
  <text x="510" y="808" class="lg">fetch and auth behaviour.</text>
  <text x="510" y="830" class="lg t3">The renav is one array and a media query, and it lands</text>
  <text x="510" y="848" class="lg t3">in its own PR — until then the PWA is the one client</text>
  <text x="510" y="866" class="lg t3">that knowingly disagrees with P6.</text>
  <text x="24" y="888" class="t3">design-system.md §3.1 navigation · §3.2 activity feed row · §3.18 Needs You bell · §6 accessibility</text>
</svg>

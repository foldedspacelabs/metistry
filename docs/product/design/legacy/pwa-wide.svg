<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="ttl desc">
  <title id="ttl">PWA — wide layout, the same nav element as a sidebar</title>
  <desc id="desc">Annotated wireframe at or above the 900 pixel breakpoint: a CSS grid places the identical nav element as a left sidebar beside the main content. The sidebar carries the six sections — Chat, Feed, Work, Knowledge, Agents, Insights — with Work and Knowledge expandable in place; capture is a plus button and the request queue hangs off a bell in the header with its unread count, so neither is a destination. The main content is Insights — spend tiles — above the Status pane of Settings as a doctor table, with an error envelope. Nothing in the markup or JavaScript changes between the two layouts.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .snk { fill: #eef0f3; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="24" y="30" class="h2">PWA — wide (≥ 900px)</text>
  <text x="24" y="50" class="t2">One media query. The same &lt;nav id="nav"&gt; and the same six buttons; only display and placement change. The 🔔 and ＋ are header buttons at both widths.</text>

  <!-- browser frame -->
  <rect x="24" y="66" width="720" height="560" rx="10" fill="#f6f7f9" stroke="#b6bec8"/>
  <path class="ln" d="M24 100 H744"/>
  <rect class="sf" x="120" y="76" width="400" height="18" rx="9"/>
  <text x="132" y="90" class="t3 mono">mac-studio.tail…ts.net</text>
  <text x="44" y="91" class="t3">‹ ›</text>
  <rect class="sf" x="640" y="76" width="34" height="18" rx="6"/><text x="651" y="90" class="acc">＋</text>
  <rect class="sf" x="682" y="76" width="36" height="18" rx="6"/><text x="692" y="91" font-size="12">🔔</text>
  <circle cx="714" cy="78" r="7" fill="#2b5fd0"/><text x="714" y="81" fill="#fff" font-size="9" text-anchor="middle">4</text>

  <!-- sidebar -->
  <rect x="25" y="101" width="180" height="524" fill="#eef0f3"/>
  <path class="ln" d="M205 101 V625"/>
  <text x="42" y="126" class="hd">Metistry</text>
  <text x="46" y="156">💬</text><text x="68" y="156">Chat</text>
  <text x="46" y="182">◈</text><text x="68" y="182">Feed</text>
  <text x="46" y="208">🗂️</text><text x="68" y="208">Work</text><text x="188" y="208" class="t3" text-anchor="end">▾</text>
  <text x="88" y="228" class="t2">Board</text>
  <text x="88" y="248" class="t2">Projects</text>
  <text x="88" y="268" class="t2">Artifacts</text>
  <text x="88" y="288" class="t2">Rooms</text>
  <text x="46" y="314">📚</text><text x="68" y="314">Knowledge</text><text x="188" y="314" class="t3" text-anchor="end">▸</text>
  <text x="46" y="340">🤖</text><text x="68" y="340">Agents</text>
  <rect x="34" y="348" width="162" height="26" rx="7" fill="#e6edfc"/>
  <text x="46" y="366" class="acc">📈</text><text x="68" y="366" class="hd">Insights</text>
  <path class="ln" d="M34 388 H196"/>
  <text x="46" y="408" class="t3">More ⌄</text>
  <text x="46" y="432" class="t3">Settings · Set up…</text>
  <text x="46" y="466" class="t3">No Pinned group here:</text>
  <text x="46" y="482" class="t3">it is Mac-only chrome,</text>
  <text x="46" y="498" class="t3">not data (§3.19).</text>
  <rect x="34" y="560" width="162" height="26" rx="7" fill="#ffffff" stroke="#d9dee4"/>
  <text x="46" y="578" class="acc">＋</text><text x="68" y="578" class="acc">New Capture</text>
  <text x="188" y="578" class="t3" text-anchor="end">N</text>
  <path class="ln" d="M34 596 H196"/>
  <text x="46" y="614" class="t3">⌘K  Commands · 9  🔔</text>

  <!-- main: Insights, then the Status pane of Settings -->
  <text x="228" y="130" class="hd">Insights · last 24h</text>
  <text x="720" y="130" class="t3" text-anchor="end">as of 09:41</text>
  <g>
    <rect class="sf" x="228" y="142" width="92" height="62" rx="12"/><text x="240" y="174" font-size="20" font-weight="600" class="ok">128</text><text x="240" y="192" class="t3">runs ok</text>
    <rect class="sf" x="330" y="142" width="92" height="62" rx="12"/><text x="342" y="174" font-size="20" font-weight="600" class="bad">2</text><text x="342" y="192" class="t3">failed</text>
    <rect class="sf" x="432" y="142" width="92" height="62" rx="12"/><text x="444" y="174" font-size="20" font-weight="600">31</text><text x="444" y="192" class="t3">turns</text>
    <rect class="sf" x="534" y="142" width="92" height="62" rx="12"/><text x="546" y="174" font-size="20" font-weight="600">9</text><text x="546" y="192" class="t3">captures</text>
    <rect class="sf" x="636" y="142" width="92" height="62" rx="12"/><text x="648" y="174" font-size="20" font-weight="600">$4.18</text><text x="648" y="192" class="t3">spend</text>
  </g>

  <!-- doctor rows -->
  <text x="228" y="242" class="hd">Settings › Status</text>
  <text x="720" y="242" class="t3" text-anchor="end">9 ok · 1 degraded · 2 not configured</text>
  <g>
    <text x="228" y="270" class="ok">●</text><text x="248" y="270">postgres</text><text x="360" y="270" class="t3 mono">select 1</text>
    <text x="720" y="270" text-anchor="end" class="ok" font-size="12">ok · 3 ms</text>
    <path class="ln" d="M228 282 H720"/>
    <text x="228" y="304" class="ok">●</text><text x="248" y="304">assistant</text><text x="360" y="304" class="t3 mono">GET /healthz</text>
    <text x="720" y="304" text-anchor="end" class="ok" font-size="12">ok · 11 ms</text>
    <path class="ln" d="M228 316 H720"/>
    <text x="228" y="338" class="deg">◐</text><text x="248" y="338">github-state</text><text x="360" y="338" class="t3 mono">last run</text>
    <text x="720" y="338" text-anchor="end" class="deg" font-size="12">degraded · 3h stale</text>
    <path class="ln" d="M228 350 H720"/>
    <text x="228" y="372" class="bad">✕</text><text x="248" y="372">apple-fm</text><text x="360" y="372" class="t3 mono">bridge check()</text>
    <text x="720" y="372" text-anchor="end" class="bad" font-size="12">failed · timeout</text>
    <path class="ln" d="M228 384 H720"/>
    <text x="228" y="406" fill="#646d77">○</text><text x="248" y="406" fill="#646d77">aws-costs</text><text x="360" y="406" class="t3 mono">METISTRY_AWS_*</text>
    <text x="720" y="406" text-anchor="end" class="t3">not configured</text>
    <path class="ln" d="M228 418 H720"/>
    <text x="228" y="440" fill="#646d77">○</text><text x="248" y="440" fill="#646d77">web push</text><text x="360" y="440" class="t3 mono">VAPID keys</text>
    <text x="720" y="440" text-anchor="end" class="t3">not configured</text>
  </g>

  <!-- error envelope -->
  <rect class="sf" x="228" y="470" width="492" height="62" rx="12" stroke="#b3261e"/>
  <text x="244" y="494" class="bad">✕</text>
  <text x="266" y="494" class="hd">Could not load aws spend</text>
  <text x="266" y="514" class="t2"><tspan class="mono">collector_absent</tspan> — set METISTRY_AWS_* and run <tspan class="mono">metistry doctor</tspan>.</text>
  <text x="706" y="494" class="t3" text-anchor="end">req 01H8…9c</text>

  <text x="228" y="562" class="t3">Other panels render normally — a panel that cannot answer stamps itself unavailable.</text>

  <!-- callouts -->
  <circle class="cw" cx="216" cy="208" r="10"/><text class="cn" x="216" y="212">1</text>
  <circle class="cw" cx="618" cy="58" r="10"/><text class="cn" x="618" y="62">5</text>
  <circle class="cw" cx="216" cy="270" r="10"/><text class="cn" x="216" y="274">2</text>
  <circle class="cw" cx="216" cy="406" r="10"/><text class="cn" x="216" y="410">3</text>
  <circle class="cw" cx="216" cy="494" r="10"/><text class="cn" x="216" y="498">4</text>

  <!-- legend -->
  <text x="770" y="90" class="hd">Callouts</text>
  <text x="770" y="116" class="lg">① At ≥900px the body becomes a CSS</text>
  <text x="782" y="132" class="lg">grid: <tspan class="mono">248px 1fr</tspan>. The nav element is</text>
  <text x="782" y="148" class="lg">placed in column one and its buttons</text>
  <text x="782" y="164" class="lg">become full-width rows, with Work and</text>
  <text x="782" y="180" class="lg">Knowledge as <tspan class="mono">&lt;details&gt;</tspan>. No JavaScript</text>
  <text x="782" y="196" class="lg">changes; the shell tests keep passing.</text>

  <text x="770" y="228" class="lg">② Doctor row (§3.13): glyph · component ·</text>
  <text x="782" y="244" class="lg">probe · state · latency. The worst state</text>
  <text x="782" y="260" class="lg">across rows becomes the macOS menu-bar</text>
  <text x="782" y="276" class="lg">glyph in the native app.</text>

  <text x="770" y="308" class="lg">③ <tspan font-weight="600">absent ≠ failed.</tspan> "not configured" is</text>
  <text x="782" y="324" class="lg">grey, names the env var that would</text>
  <text x="782" y="340" class="lg">configure it, and never counts toward the</text>
  <text x="782" y="356" class="lg">failure badge (P5).</text>

  <text x="770" y="388" class="lg">④ Error envelope (§3.16): what failed ·</text>
  <text x="782" y="404" class="lg">the reason verbatim, code in mono · what</text>
  <text x="782" y="420" class="lg">to do · a selectable correlation id.</text>
  <text x="782" y="436" class="lg">Inline at the panel, never a toast, never</text>
  <text x="782" y="452" class="lg">a stack trace.</text>

  <text x="770" y="484" class="lg">⑤ <tspan font-weight="600">The two global controls are header</tspan></text>
  <text x="782" y="500" class="lg"><tspan font-weight="600">buttons at both widths.</tspan> ＋ opens the</text>
  <text x="782" y="516" class="lg">capture composer in a <tspan class="mono">&lt;dialog&gt;</tspan>; 🔔 opens</text>
  <text x="782" y="532" class="lg">the request queue in another, carrying</text>
  <text x="782" y="548" class="lg">the existing <tspan class="mono">data-triage</tspan> hooks intact.</text>
  <text x="770" y="576" class="hd">Same at every width</text>
  <text x="770" y="598" class="lg">Six sections, same order, same names as</text>
  <text x="770" y="614" class="lg">macOS and iOS. ⌘K · 1–6 sections · 9 the</text>
  <text x="770" y="630" class="lg">🔔 · N captures · / focuses the composer ·</text>
  <text x="770" y="646" class="lg">Esc closes · :focus-visible ring, 2px.</text>
  <text x="24" y="672" class="t3">design-system.md §3.1 navigation · §3.13 status rows · §3.16 error envelopes · §3.18 Needs You bell (the PWA renavigates in a later PR)</text>
</svg>

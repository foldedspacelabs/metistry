<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" width="1000" height="760" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — agents panel with presence chips and drag-to-dispatch</title>
  <desc id="desc">Annotated wireframe: a list of registered agents each showing a presence chip from the six exhaustive states, a task list on the trailing side, and a task being dragged onto an agent row with the three possible outcomes shown inline: dispatched, queued behind a cap, or converted to a proposal because the project is in review mode.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .win { fill: #f6f7f9; stroke: #b6bec8 }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e } .oc { fill: #a24a00 }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="760" fill="#ffffff"/>
  <text x="24" y="30" class="h2">macOS — Agents</text>
  <text x="24" y="50" class="t2">Six presence states, exhaustive · drag a task onto an agent to dispatch · the refusal is shown inline, with its reason</text>

  <rect class="win" x="24" y="66" width="720" height="620" rx="12"/>
  <path class="ln" d="M24 104 H744"/>
  <circle cx="46" cy="86" r="6" fill="#ff5f57"/><circle cx="66" cy="86" r="6" fill="#febc2e"/><circle cx="86" cy="86" r="6" fill="#28c840"/>
  <text x="112" y="90" class="hd">Agents</text>
  <rect class="sf" x="608" y="76" width="110" height="22" rx="6"/><text x="618" y="91" class="t2">+ Register agent</text>

  <!-- agent rows -->
  <g>
    <!-- working -->
    <rect class="sf" x="44" y="122" width="420" height="62" rx="14"/>
    <text x="60" y="146" class="hd">Drey (dev)</text>
    <text x="150" y="146" class="t3 mono">drey-dev · external</text>
    <rect x="60" y="156" width="72" height="18" rx="9" fill="#e3f5ea"/><circle cx="72" cy="165" r="4" class="ok"/><text x="82" y="169" class="ok" font-size="11">working</text>
    <text x="142" y="169" class="t3">tier: areas (3) · $1.42 today · lease 4m left</text>

    <!-- queued -->
    <rect class="sf" x="44" y="192" width="420" height="62" rx="14"/>
    <text x="60" y="216" class="hd">Ops bot</text>
    <text x="150" y="216" class="t3 mono">ops-bot · external</text>
    <rect x="60" y="226" width="68" height="18" rx="9" fill="#faf1de"/><text x="70" y="239" class="deg" font-size="11">⏳ queued</text>
    <text x="138" y="239" class="t3">2 claimed · seen 1m ago</text>

    <!-- over-cap: drop target, refusal shown -->
    <rect class="sf" x="44" y="262" width="420" height="76" rx="14" stroke="#2b5fd0" stroke-width="2" fill="#e6edfc"/>
    <text x="60" y="286" class="hd">Reviewer</text>
    <text x="150" y="286" class="t3 mono">reviewer · external</text>
    <rect x="60" y="296" width="80" height="18" rx="9" fill="#fbeade"/><text x="70" y="309" class="oc" font-size="11">⚑ over-cap</text>
    <text x="150" y="309" class="t3">3/3 open bundles</text>
    <text x="60" y="330" class="deg" font-size="12">⏳ queued for reviewer — 3/3 open bundles (cap on metistry)</text>

    <!-- blocked -->
    <rect class="sf" x="44" y="346" width="420" height="62" rx="14"/>
    <text x="60" y="370" class="hd">Research</text>
    <text x="150" y="370" class="t3 mono">research · external</text>
    <rect x="60" y="380" width="72" height="18" rx="9" fill="#f1ecfc"/><text x="70" y="393" class="ag" font-size="11">✋ blocked</text>
    <text x="142" y="393" class="t3">waiting on proposal #97</text>

    <!-- interrupted -->
    <rect class="sf" x="44" y="416" width="420" height="62" rx="14"/>
    <text x="60" y="440" class="hd">Nightly</text>
    <text x="150" y="440" class="t3 mono">nightly · internal</text>
    <rect x="60" y="450" width="94" height="18" rx="9" fill="#fbe6e5"/><text x="70" y="463" class="bad" font-size="11">! interrupted</text>
    <text x="164" y="463" class="t3">lease expired 12m into a claim</text>

    <!-- idle -->
    <rect class="sf" x="44" y="486" width="420" height="62" rx="14"/>
    <text x="60" y="510" class="hd">Inbox drain</text>
    <text x="150" y="510" class="t3 mono">inbox-drain · internal</text>
    <rect x="60" y="520" width="56" height="18" rx="9" fill="#eef0f3"/><circle cx="72" cy="529" r="4" fill="#646d77"/><text x="82" y="533" class="t3">idle</text>
    <text x="126" y="533" class="t3">registered, nothing claimed — not a warning</text>
  </g>

  <!-- task column -->
  <path class="ln" d="M486 112 V670"/>
  <text x="506" y="140" class="t3">TASKS · metistry</text>
  <rect class="sf" x="506" y="150" width="216" height="56" rx="12" opacity="0.6" stroke-dasharray="4 3"/>
  <text x="520" y="172" class="mono t3">wrk_01H8…221</text>
  <text x="520" y="190">review artifact taper-plan</text>
  <path d="M470 300 L512 200" stroke="#2b5fd0" stroke-width="1.5" stroke-dasharray="4 4" fill="none"/>
  <circle cx="470" cy="300" r="4" class="acc"/>

  <rect class="sf" x="506" y="216" width="216" height="56" rx="12"/>
  <text x="520" y="238" class="mono t3">wrk_01H8…218</text>
  <text x="520" y="256">summarise week in Areas/Work</text>
  <rect class="sf" x="506" y="282" width="216" height="56" rx="12"/>
  <text x="520" y="304" class="mono t3">wrk_01H8…214</text>
  <text x="520" y="322">check aws-costs collector</text>
  <text x="506" y="368" class="t3">Drag onto an agent, or use the row's</text>
  <text x="506" y="384" class="t3">"Dispatch to…" menu — every gesture</text>
  <text x="506" y="400" class="t3">has a keyboard equivalent.</text>

  <text x="506" y="440" class="t3">OUTCOMES</text>
  <text x="506" y="464" class="ok" font-size="12">✓ review task #221 created for drey-dev</text>
  <text x="506" y="486" class="deg" font-size="12">⏳ queued — 3/3 open bundles</text>
  <text x="506" y="508" class="ag" font-size="12">✋ queued as proposal #97 —</text>
  <text x="518" y="524" class="ag" font-size="12">metistry is in mode: review</text>

  <!-- callouts -->
  <circle class="cw" cx="34" cy="165" r="10"/><text class="cn" x="34" y="169">1</text>
  <circle class="cw" cx="34" cy="300" r="10"/><text class="cn" x="34" y="304">2</text>
  <circle class="cw" cx="34" cy="463" r="10"/><text class="cn" x="34" y="467">3</text>
  <circle class="cw" cx="496" cy="178" r="10"/><text class="cn" x="496" y="182">4</text>
  <circle class="cw" cx="496" cy="470" r="10"/><text class="cn" x="496" y="474">5</text>

  <!-- legend -->
  <text x="770" y="90" class="hd">Callouts</text>
  <text x="770" y="116" class="lg">① Presence chip (§3.3): dot/glyph +</text>
  <text x="782" y="132" class="lg">label + tinted pill. Colour is never the</text>
  <text x="782" y="148" class="lg">only signal — the word is always there.</text>
  <text x="770" y="180" class="lg">② Valid drop target: 2px accent outline,</text>
  <text x="782" y="196" class="lg">accent-quiet fill. An invalid target gets</text>
  <text x="782" y="212" class="lg">border-strong and no red — it is not an</text>
  <text x="782" y="228" class="lg">error yet (§3.10).</text>
  <text x="770" y="260" class="lg">③ interrupted = the lease expired</text>
  <text x="782" y="276" class="lg">mid-claim. Reported from lease liveness,</text>
  <text x="782" y="292" class="lg">never inferred from traffic (P5).</text>
  <text x="770" y="324" class="lg">④ The dragged card drops to 60%</text>
  <text x="782" y="340" class="lg">opacity at its origin.</text>
  <text x="770" y="372" class="lg">⑤ The three outcomes, all shown inline</text>
  <text x="782" y="388" class="lg">at the target row, in the API's own</text>
  <text x="782" y="404" class="lg">words. A refusal names the boundary</text>
  <text x="782" y="420" class="lg">that caused it (P4) — that is the whole</text>
  <text x="782" y="436" class="lg">point of the gesture.</text>

  <text x="770" y="480" class="hd">Destructive actions here</text>
  <text x="770" y="504" class="lg">revoke · rotate token. Both confirm with</text>
  <text x="770" y="520" class="lg">the consequence named (P3, §3.17):</text>
  <text x="770" y="540" class="lg t3">"Rotate the token for ops-bot? The current</text>
  <text x="770" y="556" class="lg t3">token stops working immediately."</text>

  <text x="770" y="596" class="hd">VoiceOver</text>
  <text x="770" y="620" class="lg t3">"reviewer, over cap, 3 of 3 open bundles"</text>
  <text x="24" y="720" class="t3">docs/product/design-system.md §3.3 presence chip · §3.10 task card and drag-to-dispatch · §3.17 destructive confirmation</text>
</svg>

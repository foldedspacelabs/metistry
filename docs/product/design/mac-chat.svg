<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — chat with collapsed tool activity and the model picker</title>
  <desc id="desc">Annotated wireframe: a chat thread where each assistant turn carries an explicit turn state, a collapsed tool-activity disclosure summarising count, duration and cost, and a structured question-answer prompt card; the toolbar holds the model and effort picker.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .win { fill: #f6f7f9; stroke: #b6bec8 }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .agq { fill: #f1ecfc; stroke: #e2d9f7 }
    .snk { fill: #eef0f3; stroke: #d9dee4 }
    .accq { fill: #e6edfc; stroke: #c6d6f7 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="800" fill="#ffffff"/>
  <text x="24" y="30" class="h2">macOS — Chat</text>
  <text x="24" y="50" class="t2">Collapsed tool activity · explicit turn state · per-turn model and effort picker in the toolbar</text>

  <rect class="win" x="24" y="66" width="720" height="640" rx="12"/>
  <path class="ln" d="M24 104 H744"/>
  <circle cx="46" cy="86" r="6" fill="#ff5f57"/><circle cx="66" cy="86" r="6" fill="#febc2e"/><circle cx="86" cy="86" r="6" fill="#28c840"/>
  <text x="112" y="90" class="hd">Chat</text>
  <!-- model + effort picker -->
  <rect class="sf" x="520" y="76" width="132" height="22" rx="6"/>
  <text x="530" y="91" class="t2">◇ auto · <tspan class="acc">deep</tspan> · high ⌄</text>
  <rect class="sf" x="660" y="76" width="60" height="22" rx="6"/><text x="670" y="91" class="t2">⌘K</text>

  <!-- outbound turn (you) -->
  <rect class="accq" x="264" y="122" width="460" height="52" rx="14"/>
  <text x="278" y="142" class="t3">you · 09:14</text>
  <text x="278" y="161">how much should I ease off running in the final weeks?</text>

  <!-- assistant turn -->
  <text x="44" y="200" class="t3">assistant · 09:14 · <tspan class="ok">finished</tspan></text>
  <rect class="sf" x="44" y="210" width="460" height="96" rx="14"/>
  <text x="58" y="232">Taper by cutting volume ~40% over the final three weeks while</text>
  <text x="58" y="250">keeping intensity. Your note <tspan class="acc">Knowledge/Areas/Running/Taper</tspan></text>
  <text x="58" y="268">says the last hard session should sit 10 days out.</text>
  <text x="58" y="292" class="acc" font-size="12">↗ open note   ·   ↗ dashboard   ·   ⌁ summarize this</text>

  <!-- collapsed tool disclosure -->
  <rect class="agq" x="44" y="316" width="460" height="28" rx="10"/>
  <text x="58" y="335" class="ag" font-size="12">▸ 4 tools · 6.2s · $0.031</text>
  <!-- expanded example -->
  <rect class="agq" x="44" y="352" width="460" height="118" rx="10"/>
  <text x="58" y="371" class="ag" font-size="12">▾ 4 tools · 6.2s · $0.031</text>
  <path class="ln" d="M58 380 H490"/>
  <text x="58" y="398" class="mono" fill="#4d565f">🔧 knowledge_search   1.1s   <tspan class="ok">ok</tspan></text>
  <text x="58" y="416" class="mono" fill="#4d565f">🔧 vault_read         0.4s   <tspan class="ok">ok</tspan></text>
  <text x="58" y="434" class="mono" fill="#4d565f">🔧 calendar_list      3.9s   <tspan class="deg">degraded — retried once</tspan></text>
  <text x="58" y="452" class="mono" fill="#4d565f">🔧 brain_commit       0.8s   <tspan class="ok">ok</tspan></text>

  <!-- prompt card -->
  <rect class="sf" x="44" y="486" width="460" height="112" rx="14"/>
  <rect x="44" y="486" width="4" height="112" fill="#2b5fd0"/>
  <text x="62" y="510" class="hd">Write the taper plan to your vault?</text>
  <text x="62" y="530" class="t2">Knowledge/Areas/Running/Taper.md · new section, 180 words</text>
  <rect x="62" y="542" width="88" height="28" rx="10" fill="#2b5fd0"/><text x="106" y="561" fill="#fff" text-anchor="middle" font-size="12">Write it</text>
  <rect class="sf" x="158" y="542" width="104" height="28" rx="10"/><text x="210" y="561" text-anchor="middle" font-size="12">Show me first</text>
  <rect class="sf" x="270" y="542" width="72" height="28" rx="10"/><text x="306" y="561" text-anchor="middle" font-size="12">Not now</text>
  <text x="352" y="561" class="t3">Something else…</text>
  <text x="62" y="588" class="t3">default in 6h: Show me first</text>

  <!-- composer -->
  <path class="ln" d="M25 618 H743"/>
  <rect class="sf" x="44" y="632" width="580" height="40" rx="10"/>
  <text x="58" y="657" fill="#646d77">ask or tell…</text>
  <text x="586" y="657" class="t2">/ @ ⌘K</text>
  <rect x="636" y="632" width="76" height="40" rx="10" fill="#2b5fd0"/><text x="674" y="657" fill="#fff" text-anchor="middle" font-size="13">Send</text>

  <!-- callouts -->
  <circle class="cw" cx="592" cy="87" r="10"/><text class="cn" x="592" y="91">1</text>
  <circle class="cw" cx="34" cy="200" r="10"/><text class="cn" x="34" y="204">2</text>
  <circle class="cw" cx="34" cy="330" r="10"/><text class="cn" x="34" y="334">3</text>
  <circle class="cw" cx="34" cy="510" r="10"/><text class="cn" x="34" y="514">4</text>
  <circle class="cw" cx="34" cy="652" r="10"/><text class="cn" x="34" y="656">5</text>
  <circle class="cw" cx="516" cy="292" r="10"/><text class="cn" x="516" y="296">6</text>

  <!-- legend -->
  <text x="770" y="90" class="hd">Callouts</text>
  <text x="770" y="116" class="lg">① Model &amp; effort picker (§3.7). Label</text>
  <text x="782" y="132" class="lg">reads "auto" while the deterministic</text>
  <text x="782" y="148" class="lg">router chooses; pinning turns it accent.</text>
  <text x="782" y="164" class="lg">The menu header says which tier the</text>
  <text x="782" y="180" class="lg">router picked — no model picks a model.</text>

  <text x="770" y="212" class="lg">② Turn state is explicit and named:</text>
  <text x="782" y="228" class="lg"><tspan class="ok">finished</tspan> · working · <tspan class="bad">interrupted</tspan>. Never</text>
  <text x="782" y="244" class="lg">inferred from whether text arrived (P5).</text>

  <text x="770" y="276" class="lg">③ Tool activity, collapsed by default:</text>
  <text x="782" y="292" class="lg">count · duration · cost. Expanded it lists</text>
  <text x="782" y="308" class="lg">one line per <tspan class="mono">runs kind=tool</tspan> row. The</text>
  <text x="782" y="324" class="lg"><tspan class="ag">agent-quiet</tspan> wash marks all of it as</text>
  <text x="782" y="340" class="lg">agent-sourced data (P1). A failed call</text>
  <text x="782" y="356" class="lg">auto-expands — the one exception.</text>

  <text x="770" y="388" class="lg">④ Question–answer prompt card (§3.5).</text>
  <text x="782" y="404" class="lg">Options + default + free-text escape,</text>
  <text x="782" y="420" class="lg">from the same payload the notification</text>
  <text x="782" y="436" class="lg">renders. A tap carries no more authority</text>
  <text x="782" y="452" class="lg">than a typed reply.</text>

  <text x="770" y="484" class="lg">⑤ Composer: "/" and "@" open the same</text>
  <text x="782" y="500" class="lg">generated menu as ⌘K, inline and</text>
  <text x="782" y="516" class="lg">anchored above the field (§3.6).</text>

  <text x="770" y="548" class="lg">⑥ Quick links and targeted actions —</text>
  <text x="782" y="564" class="lg">a door, not a dead end (ux-direction).</text>

  <text x="770" y="600" class="hd">Reduced motion</text>
  <text x="770" y="624" class="lg">Disclosure opens instantly; the working</text>
  <text x="770" y="640" class="lg">state is a word, never a pulsing dot.</text>
  <text x="24" y="740" class="t3">docs/product/design-system.md §3.4 chat message · §3.5 prompt card · §3.6 palette · §3.7 model picker</text>
</svg>

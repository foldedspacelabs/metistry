<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 720" width="1000" height="720" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — project header with the mode toggle and rollup</title>
  <desc id="desc">Annotated wireframe of Work &#8250; Projects: a project detail view with a title, a review or autonomous mode chip, budget and cap metadata, member agent chips, a single mode toggle whose confirmation names the consequence, and the rollup of open tasks, bundles in flight, queued work, threads and spend.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 } .h3 { font-size: 22px; font-weight: 600 }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .win { fill: #f6f7f9; stroke: #b6bec8 }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="720" fill="#ffffff"/>
  <text x="24" y="30" class="h2">macOS — Work › Projects</text>
  <text x="24" y="50" class="t2">The fourth view of the Work section · one mode chip, one toggle, and a confirmation that spells out what changes (P3)</text>

  <rect class="win" x="24" y="66" width="720" height="580" rx="12"/>
  <path class="ln" d="M24 104 H744"/>
  <circle cx="46" cy="86" r="6" fill="#ff5f57"/><circle cx="66" cy="86" r="6" fill="#febc2e"/><circle cx="86" cy="86" r="6" fill="#28c840"/>
  <text x="112" y="90" class="hd">Work › Projects › metistry</text>

  <!-- header -->
  <text x="48" y="146" class="h3">metistry</text>
  <rect x="150" y="128" width="66" height="20" rx="10" fill="#f1ecfc"/><text x="160" y="142" class="ag" font-size="11">✋ review</text>
  <text x="48" y="170" class="t2">budget $8.00/day · cap 3 open bundles · $2.41 spent today</text>
  <text x="48" y="190" class="t3">review since 2026-09-03 (owner: budget)</text>
  <rect class="sf" x="560" y="128" width="164" height="30" rx="10"/>
  <text x="642" y="148" text-anchor="middle" font-size="12">→ switch to autonomous</text>

  <!-- members -->
  <text x="48" y="224" class="t3">MEMBERS</text>
  <rect x="48" y="232" width="92" height="22" rx="11" fill="#f1ecfc"/><circle cx="62" cy="243" r="4" class="ok"/><text x="72" y="247" class="ag mono">drey-dev</text>
  <rect x="148" y="232" width="82" height="22" rx="11" fill="#f1ecfc"/><text x="158" y="247" class="ag mono">⏳ ops-bot</text>
  <rect x="238" y="232" width="86" height="22" rx="11" fill="#f1ecfc"/><text x="248" y="247" class="ag mono">⚑ reviewer</text>

  <!-- rollup tiles -->
  <text x="48" y="290" class="t3">ROLLUP</text>
  <g>
    <rect class="sf" x="48" y="300" width="124" height="72" rx="12"/><text x="62" y="336" font-size="22" font-weight="600">7</text><text x="62" y="356" class="t2">open tasks</text>
    <rect class="sf" x="184" y="300" width="124" height="72" rx="12"/><text x="198" y="336" font-size="22" font-weight="600">2</text><text x="198" y="356" class="t2">bundles in flight</text>
    <rect class="sf" x="320" y="300" width="124" height="72" rx="12"/><text x="334" y="336" font-size="22" font-weight="600" class="deg">3</text><text x="334" y="356" class="t2">queued</text>
    <rect class="sf" x="456" y="300" width="124" height="72" rx="12"/><text x="470" y="336" font-size="22" font-weight="600">4</text><text x="470" y="356" class="t2">open threads</text>
    <rect class="sf" x="592" y="300" width="124" height="72" rx="12"/><text x="606" y="336" font-size="22" font-weight="600">$2.41</text><text x="606" y="356" class="t2">spend today</text>
  </g>

  <!-- confirmation dialog -->
  <rect x="25" y="392" width="718" height="252" fill="#12171c" opacity="0.32"/>
  <rect class="sf" x="196" y="424" width="376" height="188" rx="20" stroke="#b6bec8"/>
  <text x="384" y="466" text-anchor="middle" class="hd">Switch metistry back to autonomous?</text>
  <text x="384" y="494" text-anchor="middle" class="t2">Members will dispatch review bundles to each</text>
  <text x="384" y="512" text-anchor="middle" class="t2">other without you again. 3 queued bundles will</text>
  <text x="384" y="530" text-anchor="middle" class="t2">be released immediately.</text>
  <rect class="sf" x="230" y="552" width="150" height="34" rx="10" stroke="#2b5fd0" stroke-width="2"/>
  <text x="305" y="574" text-anchor="middle" font-size="13">Cancel</text>
  <rect x="392" y="552" width="150" height="34" rx="10" fill="#b3261e"/>
  <text x="467" y="574" text-anchor="middle" font-size="13" fill="#ffffff">Switch to autonomous</text>

  <!-- callouts -->
  <circle class="cw" cx="232" cy="138" r="10"/><text class="cn" x="232" y="142">1</text>
  <circle class="cw" cx="546" cy="143" r="10"/><text class="cn" x="546" y="147">2</text>
  <circle class="cw" cx="36" cy="190" r="10"/><text class="cn" x="36" y="194">3</text>
  <circle class="cw" cx="36" cy="336" r="10"/><text class="cn" x="36" y="340">4</text>
  <circle class="cw" cx="182" cy="466" r="10"/><text class="cn" x="182" y="470">5</text>

  <!-- legend -->
  <text x="770" y="90" class="hd">Callouts</text>
  <text x="770" y="116" class="lg">① Mode chip carries the word as well as</text>
  <text x="782" y="132" class="lg">the tint. <tspan class="ok">autonomous</tspan> uses ok;</text>
  <text x="782" y="148" class="lg"><tspan class="ag">review</tspan> uses presence-blocked (P2).</text>
  <text x="770" y="180" class="lg">② One toggle, not a settings screen. The</text>
  <text x="782" y="196" class="lg">kill switch is a single visible control.</text>
  <text x="770" y="228" class="lg">③ The last mode change and its reason,</text>
  <text x="782" y="244" class="lg">as footnote — so the current posture is</text>
  <text x="782" y="260" class="lg">never a mystery.</text>
  <text x="770" y="292" class="lg">④ Rollup tiles. Only <tspan class="deg">queued</tspan> takes a</text>
  <text x="782" y="308" class="lg">state colour, because only queued work</text>
  <text x="782" y="324" class="lg">may need a person.</text>
  <text x="770" y="356" class="lg">⑤ Destructive confirmation (§3.17):</text>
  <text x="782" y="372" class="lg">the title is the question in the tool's</text>
  <text x="782" y="388" class="lg">words, the body names exactly what</text>
  <text x="782" y="404" class="lg">changes, the affirmative button carries</text>
  <text x="782" y="420" class="lg">the verb, and Cancel holds focus.</text>
  <text x="782" y="444" class="lg t3">SwiftUI: .confirmationDialog with</text>
  <text x="782" y="460" class="lg t3">role: .destructive. PWA: &lt;dialog&gt;.</text>
  <text x="770" y="496" class="hd">Note</text>
  <text x="770" y="520" class="lg">The dialog is never the control. The API</text>
  <text x="770" y="536" class="lg">refuses regardless — the confirmation</text>
  <text x="770" y="552" class="lg">exists so the click is not cheaper than</text>
  <text x="770" y="568" class="lg">the act.</text>
  <text x="24" y="664" class="t3">Shell — seven sections: Chat · Feed · Needs You · <tspan font-weight="600">Work</tspan> · Knowledge · Agents · System · Capture ⌘N (mac-feed.svg)</text>
  <text x="24" y="686" class="t3">Board · Rooms · Artifacts · Projects are the four Work views · design-system.md §3.12 project header · §3.17 destructive confirmation</text>
</svg>

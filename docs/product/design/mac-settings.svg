<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 880" width="1000" height="880" role="img" aria-labelledby="ttl desc">
  <title id="ttl">macOS — Settings, every setting that exists today in four groups</title>
  <desc id="desc">Annotated wireframe of the Settings scene regrouped from seven panes into four: General, Services, Connections and Advanced. The General pane is drawn in full as rows of label, control and one line of help; the other three panes are indexed beneath it so that every setting the app has today is accounted for. Compute has left Settings for the System section, because it is a data surface that needs a home on every platform.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, sans-serif; fill: #12171c; font-size: 13px; }
    .t2 { fill: #4d565f; font-size: 12px } .t3 { fill: #646d77; font-size: 11px }
    .hd { font-size: 15px; font-weight: 600 } .h2 { font-size: 20px; font-weight: 700 }
    .ch { font-size: 12px; font-weight: 600 }
    .lb { fill: #4d565f; font-size: 12px; text-anchor: end }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px }
    .ln { stroke: #d9dee4; stroke-width: 1; fill: none }
    .win { fill: #f6f7f9; stroke: #b6bec8 }
    .sf { fill: #ffffff; stroke: #d9dee4 }
    .sel { fill: #e6edfc } .snk { fill: #eef0f3; stroke: #d9dee4 }
    .acc { fill: #2b5fd0 } .ag { fill: #6a4bbd } .ok { fill: #1c7a45 } .deg { fill: #8a5a00 } .bad { fill: #b3261e }
    .cw { fill: #ffffff; stroke: #b3261e; stroke-width: 1.5 }
    .cn { fill: #b3261e; font-size: 11px; font-weight: 700; text-anchor: middle }
    .lg { font-size: 12px }
  </style>

  <rect width="1000" height="880" fill="#ffffff"/>
  <text x="24" y="30" class="h2">macOS — Settings</text>
  <text x="24" y="50" class="t2">Four groups instead of seven panes · every row is label · control · one line of help · Compute has moved to System</text>

  <rect class="win" x="24" y="66" width="720" height="770" rx="12"/>
  <circle cx="46" cy="86" r="6" fill="#ff5f57"/><circle cx="66" cy="86" r="6" fill="#febc2e"/><circle cx="86" cy="86" r="6" fill="#28c840"/>
  <text x="384" y="91" class="hd" text-anchor="middle">Settings</text>
  <!-- toolbar tabs -->
  <rect class="sel" x="212" y="110" width="94" height="30" rx="8"/>
  <text x="259" y="124" text-anchor="middle" font-size="13">⚙️</text><text x="259" y="136" class="ch" text-anchor="middle">General</text>
  <text x="352" y="124" text-anchor="middle" font-size="13">🧩</text><text x="352" y="136" class="t2" text-anchor="middle">Services</text>
  <text x="452" y="124" text-anchor="middle" font-size="13">🔌</text><text x="452" y="136" class="t2" text-anchor="middle">Connections</text>
  <text x="552" y="124" text-anchor="middle" font-size="13">🛠️</text><text x="552" y="136" class="t2" text-anchor="middle">Advanced</text>
  <path class="ln" d="M24 150 H744"/>

  <!-- GENERAL -->
  <text x="256" y="176" class="t3">INSTANCE</text><path class="ln" d="M330 172 H716"/>
  <text x="240" y="204" class="lb">Active instance</text>
  <rect class="sf" x="256" y="190" width="256" height="20" rx="6"/><text x="266" y="204" class="mono">~/Development/metistry-instance ⌄</text>
  <rect class="sf" x="520" y="190" width="66" height="20" rx="6"/><text x="553" y="204" class="t2" text-anchor="middle">Choose…</text>
  <rect class="sf" x="594" y="190" width="104" height="20" rx="6"/><text x="646" y="204" class="t2" text-anchor="middle">Open in Finder</text>
  <text x="256" y="224" class="t3">Every <tspan class="mono">metistry</tspan> verb runs with this path. It decides which install the app talks to.</text>

  <text x="240" y="250" class="lb">Recents</text>
  <text x="256" y="250" class="t2">3 remembered</text>
  <rect class="sf" x="352" y="238" width="58" height="18" rx="6"/><text x="381" y="251" class="t2" text-anchor="middle">Forget</text>

  <text x="240" y="278" class="lb">Assistant name</text>
  <text x="256" y="278" class="mono t2">‹the name in identity.yaml›</text>
  <rect class="snk" x="450" y="266" width="66" height="18" rx="6"/><text x="483" y="279" class="t3" text-anchor="middle">read-only</text>
  <text x="256" y="298" class="t3">It lives in <tspan class="mono">identity.yaml</tspan> and nowhere else — a protected path, so only your own hand writes it.</text>

  <text x="256" y="336" class="t3">STARTUP</text><path class="ln" d="M322 332 H716"/>
  <text x="240" y="362" class="lb">This app</text>
  <rect x="256" y="352" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="360" r="6" fill="#ffffff"/>
  <text x="296" y="365" class="t2">Start Metistry at login</text>
  <circle cx="450" cy="360" r="4" class="ok"/><text x="462" y="365" class="ok" font-size="12">registered</text>
  <text x="256" y="382" class="t3">The app only. macOS may hold the registration until you allow it in Login Items.</text>

  <text x="240" y="410" class="lb">The install</text>
  <rect x="256" y="400" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="408" r="6" fill="#ffffff"/>
  <text x="296" y="413" class="t2">Run services in the background</text>
  <circle cx="490" cy="408" r="4" class="deg"/><text x="502" y="413" class="deg" font-size="12">awaiting approval</text>
  <rect class="sf" x="606" y="400" width="106" height="18" rx="6"/><text x="659" y="413" class="t2" text-anchor="middle">Open Login Items…</text>
  <text x="256" y="430" class="t3">The install's services, not this app — the two are constantly confused.</text>

  <text x="256" y="468" class="t3">UPDATES</text><path class="ln" d="M322 464 H716"/>
  <text x="240" y="494" class="lb">This app</text>
  <text x="256" y="494" class="mono">1.4.1</text>
  <text x="310" y="494" class="t3">one signed appcast, so one channel</text>
  <rect class="sf" x="520" y="482" width="72" height="18" rx="6"/><text x="556" y="495" class="t2" text-anchor="middle">Check Now</text>
  <text x="600" y="494" class="t3">last checked 09:12</text>
  <text x="240" y="524" class="lb">Automatically</text>
  <rect x="256" y="514" width="30" height="16" rx="8" fill="#2b5fd0"/><circle cx="278" cy="522" r="6" fill="#ffffff"/>
  <text x="296" y="527" class="t2">Check for updates automatically</text>
  <text x="256" y="544" class="t3">Sparkle owns this preference and reads it itself; the app keeps no copy of it.</text>
  <text x="240" y="572" class="lb">Product runtime</text>
  <text x="256" y="572" class="mono">0.9.3</text>
  <text x="310" y="572" class="t3">pinned in <tspan class="mono">metistry.lock</tspan>, source: release, updated 2026-09-14</text>
  <text x="256" y="592" class="t3">Two channels, both signed. The runtime updates through <tspan class="mono">metistry update</tspan>.</text>

  <text x="256" y="630" class="t3">SET UP AGAIN</text><path class="ln" d="M352 626 H716"/>
  <text x="240" y="656" class="lb">First launch</text>
  <rect class="sf" x="256" y="644" width="112" height="20" rx="6"/><text x="312" y="658" class="t2" text-anchor="middle">Set Up Again…</text>
  <text x="256" y="676" class="t3">Runs the first-launch steps over. Nothing happens until you press Run on a step.</text>

  <!-- index of the other three panes -->
  <path d="M48 704 H716" stroke="#d9dee4" stroke-dasharray="4 4" fill="none"/>
  <text x="48" y="724" class="t3">THE OTHER THREE PANES — EVERY ROW THE APP HAS TODAY, ACCOUNTED FOR</text>
  <g>
    <text x="48" y="750" class="ch">Services</text>
    <text x="48" y="770" class="t3">Shape — compose or launchd, from</text>
    <text x="48" y="784" class="t3">the overlay, read-only</text>
    <text x="48" y="800" class="t3">Services — one row per component,</text>
    <text x="48" y="814" class="t3">with its state</text>
    <text x="48" y="830" class="t3">Restart · Stop · Start · View Log</text>

    <text x="280" y="750" class="ch">Connections</text>
    <text x="280" y="770" class="t3">Console sign-in — this Mac</text>
    <text x="280" y="786" class="t3">Instance repository — status, HEAD,</text>
    <text x="280" y="800" class="t3">queue depth · Connect a Repository…</text>
    <text x="280" y="816" class="t3">Bridges — rows from the last doctor</text>
    <text x="280" y="832" class="t3">Secrets — names and scope only</text>

    <text x="512" y="750" class="ch">Advanced</text>
    <text x="512" y="770" class="t3">Runtime — source, command, product</text>
    <text x="512" y="784" class="t3">directory · Look Again</text>
    <text x="512" y="800" class="t3">Versions · Developer override</text>
    <text x="512" y="816" class="t3">Run Doctor · Passkey diagnostic</text>
    <text x="512" y="832" class="t3">Logs — directory · Open in Finder</text>
  </g>

  <!-- callouts -->
  <g>
    <circle class="cw" cx="200" cy="125" r="10"/><text class="cn" x="200" y="129">1</text>
    <circle class="cw" cx="240" cy="224" r="10"/><text class="cn" x="240" y="228">2</text>
    <circle class="cw" cx="238" cy="430" r="10"/><text class="cn" x="238" y="434">3</text>
    <circle class="cw" cx="536" cy="278" r="10"/><text class="cn" x="536" y="282">4</text>
    <circle class="cw" cx="756" cy="125" r="10"/><text class="cn" x="756" y="129">5</text>
    <circle class="cw" cx="264" cy="832" r="10"/><text class="cn" x="264" y="836">6</text>
  </g>

  <!-- legend -->
  <g>
    <text x="770" y="176" class="hd">Callouts</text>
    <text x="770" y="200" class="lg">① Four groups, not seven panes. A</text>
    <text x="782" y="216" class="lg">group is a question you have: which</text>
    <text x="782" y="232" class="lg">install · is it running · what is</text>
    <text x="782" y="248" class="lg">it connected to · get me out.</text>
    <text x="770" y="276" class="lg">② Every row is <tspan font-weight="600">label · control ·</tspan></text>
    <text x="782" y="292" class="lg"><tspan font-weight="600">one line of help</tspan>. Today's panes</text>
    <text x="782" y="308" class="lg">explain themselves in three-line</text>
    <text x="782" y="324" class="lg">paragraphs about overlays and</text>
    <text x="782" y="340" class="lg">principals; the rest belongs in</text>
    <text x="782" y="356" class="lg">docs, not under a toggle. That</text>
    <text x="782" y="372" class="lg">verbosity is what this answers.</text>
    <text x="770" y="400" class="lg">③ The two registrations sit</text>
    <text x="782" y="416" class="lg">together because they are always</text>
    <text x="782" y="432" class="lg">confused, and each one's help says</text>
    <text x="782" y="448" class="lg">which it is. "Awaiting approval" is</text>
    <text x="782" y="464" class="lg">the normal first answer, so it reads</text>
    <text x="782" y="480" class="lg">as a step and not a fault.</text>
    <text x="770" y="508" class="lg">④ The assistant's name is shown and</text>
    <text x="782" y="524" class="lg">not editable. It lives in one file,</text>
    <text x="782" y="540" class="lg">and that file is your hand — which</text>
    <text x="782" y="556" class="lg">makes a second install a clone.</text>
    <text x="770" y="584" class="lg">⑤ <tspan font-weight="600">Compute left Settings.</tspan> It is a</text>
    <text x="782" y="600" class="lg">data surface, and one that exists</text>
    <text x="782" y="616" class="lg">only on the Mac has no home on the</text>
    <text x="782" y="632" class="lg">other two. It is now System →</text>
    <text x="782" y="648" class="lg">Compute. Secrets joined</text>
    <text x="782" y="664" class="lg">Connections; Updates, General.</text>
    <text x="770" y="692" class="lg">⑥ Secrets shows names and scope.</text>
    <text x="782" y="708" class="lg">No code path in the CLI or in this</text>
    <text x="782" y="724" class="lg">pane can print a value — enforced</text>
    <text x="782" y="740" class="lg">at the tool, not by being careful.</text>
    <text x="770" y="774" class="hd">Still Mac-only, on purpose</text>
    <text x="770" y="796" class="lg">Keychain, login items, TCC prompts,</text>
    <text x="770" y="812" class="lg">log windows, Sparkle, the wizard.</text>
    <text x="770" y="828" class="lg">All of it is operating, not data.</text>
  </g>
  <text x="24" y="866" class="t3">apps/macos/sources/kit/settings-view.swift · docs/ops/mac-app.md · docs/ops/compute.md · design-system.md P10</text>
</svg>

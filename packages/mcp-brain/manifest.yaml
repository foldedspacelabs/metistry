schema: 1
name: brain
type: bridge
description: The one MCP surface every agent uses — capture/requests in, scoped tasks + knowledge out, and the assistant's own write path (§4.11, §4.19, §4.20)
transport: http
port: 8080               # no bind of its own: mounted at the console's POST /mcp, so this is the console's port
runs_on: container
requires_tcc: []
discovery: eager         # 29 tools declared; 28 of them EAGER since 2026-09-27, when the connections proxy's lazy pair (connections_list, connections_call — plan §2.6, Q5) moved the count 26 → 28 by the approved spec, reasoned beside COUNT_ACKNOWLEDGED in ops/scripts/check-tool-surface.mjs: two tools in front of every connection the owner will ever add, whose own tools are fetched on demand and never listed here. Before that, 27 tools declared; 26 of them EAGER at 16,896 chars ≈ 4.2k definition tokens (chars/4), against the >5k line that gates lazy. It was 19,914 chars ≈ 5.0k — within 80 chars of the line — until 2026-09-19, when the `turn_id` correlation handle came out of every schema and moved to the call's `_meta` (src/turn-id.ts): 3,774 chars ≈ 944 tokens, 19% of the whole surface, for a field that was never a parameter (docs/research/2026-09-19-code-mode-mcp.md §2.4). That headroom is NOT an invitation to add a tool — on COUNT this bridge is 6 past the >20 line, `ops/scripts/check-tool-surface.mjs` fails on the tool after the number ACKNOWLEDGED there, and the answer to "we need a new read capability" is a named query behind queries_run, not a tool (docs/ops/assistant-tools.md). The ceiling moved 25 → 26 once, on 2026-09-19, for `request_access` (src/access.ts): a new VERB and a safety mechanism — an agent refused for scope asks for the named area instead of being stuck — at 189 tokens, decided by the owner and reasoned in that script. `propose_action` is the 27th and it is LAZY BY CREDENTIAL: registered only for a principal whose `autonomy` table admits an action (docs/ops/actions.md), i.e. nobody until the owner sets a level. So the surface every agent sees is unchanged by it, and a principal that has opted in carries 27 tools / 17,803 chars ≈ 4.5k tokens, knowingly, having bought something with it. Deferring on the credential rather than behind a tool_index/execute/batch meta-tool is the cheaper half of docs/research/2026-08-tool-discovery.md's advice — same saving, none of the +1 discovery turn. Deprecated spellings (src/aliases.ts) resolve at call time and are deliberately not exposed here. Measured by test/brain.test.ts and by ops/scripts/check-tool-surface.mjs, which reads this bridge's own toolSurface().
degrades: absent
exposes:
  - name: capture
    description: Drop a note or file into the inbox as a proposal (source_agent stamped from the credential)
  - name: requests_create
    description: Raise a request for the user's Needs You queue — a `report` (finding/decided/gotcha/progress; `decision` is accepted as `decided`) or, with kind `question`, 1–5 questions the user answers (a `decision` row) — idempotent on idempotency_key, same-title-within-24h suppressed
  - name: request_access
    description: Ask the owner to widen this credential's read grant by one vault area — one `access_request` request in Needs You, deduplicated per (agent, area) while it is pending; grants nothing itself, and the owner's Approve goes through the console's existing grants door
  - name: tasks_list
    description: Tasks in the caller's projects — filter ready (claimable, default) | mine (held) | all
  - name: tasks_claim
    description: Atomically claim a task (assignee + status + lease in one operation)
  - name: tasks_renew
    description: Renew the lease on a held task
  - name: tasks_update
    description: Change status (in_progress/blocked) or append a note on a held task; use tasks_close to finish one
  - name: tasks_release
    description: Hand a held task back to the list
  - name: tasks_close
    description: Finish a held task in one step — status closed, claim released, optional closing note
  - name: tasks_create
    description: Create a task in one of the caller's projects (idempotent on idempotency_key)
  - name: tasks_comment
    description: Append one message to the room on a work row — no addressee field exists, so it wakes nobody; past the agent-only cap the room escalates to the user
  - name: tasks_thread
    description: Read the room on a work row — every message oldest-first, its participants, and whether the user has resolved it
  - name: knowledge_search
    description: Search the knowledge index (titles + one-line descriptions) within the caller's grant tier
  - name: knowledge_read
    description: Read one settled note under a granted vault area prefix (returns its sha256 for compare-and-swap)
  - name: knowledge_list
    description: "List a vault prefix, depth-limited — path, title and one-line description, never content; tier index browses every title, tier areas only its granted prefixes; `links_for` lists one page's links instead (both ends inside the grant, tier areas); drafts excluded. The page list and the link graph are the same route-backed named queries the console's /api/knowledge/pages and /links serve the owner, under the same scope filter"
  - name: knowledge_grep
    description: Regex search over settled note content under a granted vault prefix, pre-filtered and capped at 50 files / 200 hits; an overly expensive pattern is refused
  - name: knowledge_write
    description: Write one note in the vault as a commit in the caller's name — internal (assistant) principals only; CAS on expected_sha256; protected paths refused; no delete/rename
  - name: artifacts_publish
    description: Publish a version of an artifact into one of the caller's projects (compare-and-swap on the current version, idempotent on idempotency_key); returns artifact/version/review links
  - name: artifacts_get
    description: One artifact in the caller's projects — a version with its manifest, the version list, comment threads, links, optionally one text file's content
  - name: artifacts_list
    description: Artifacts across the caller's projects
  - name: artifacts_comment
    description: Comment on an exact version (optionally one file + opaque anchor) or reply to a thread root; agent-only exchanges past the cap demote the thread to the user
  - name: artifacts_resolve
    description: Resolve (or reopen) a thread root
  - name: artifacts_review
    description: Send threads to another agent as one claimable review task — inside the project freely, across the boundary as a proposal for the user
  - name: agents_delegate
    description: Delegate a brief to a named helper agent as a durable work row, checked against the agent's scope and the local target's data policy first; internal (assistant) principals only
  - name: queries_list
    description: "List the named queries runnable here (invariant 3's one read path) — name, description, and each param's type + default; a route-backed query is not listed, because it is not runnable here"
  - name: queries_run
    description: "Run one named query by name with optional params, rows capped at 200; internal principals always, external agents only with a `queries` grant. A route-backed query (`expose` = route) is not served here — it has a scoped door of its own and answers with the unknown-query refusal, byte for byte"
  - name: connections_list
    description: "The proxy's lazy pair, half one (plan §2.6, C115): the owner's connections lent to this credential — offered to agents by the owner AND granted to it (a crew also needs `uses: [connections]`); the assistant reaches every connection. With `connection`, that connection's callable tools with the upstream's own descriptions and schemas, fetched on demand and never listed here"
  - name: connections_call
    description: "The proxy's lazy pair, half two: call one tool of a lent connection through Metistry's pooled client — secrets filled only at egress to their listed hosts, the caller's bearer never forwarded, the result redacted; the owner's per-tool policy decides how it runs: a Read at Allow at once, a change at Allow after a preview and the caller's confirm_token (once), Ask First only on the owner's Approve in Needs You. One `runs` row of kind connection_call per call, refusals included"
  - name: propose_action
    description: Ask the console to do one of four things — dispatch a work row, patch a task, comment, capture — executed at once, queued for the user, or refused, by the caller's own autonomy table; offered only to a credential the owner has given room

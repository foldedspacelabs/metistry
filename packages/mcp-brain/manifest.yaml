name: brain
type: bridge
description: The one MCP surface every agent uses — capture/report in, scoped tasks + knowledge out, and the assistant's own write path (§4.11, §4.19, §4.20)
transport: http
port: 8080               # no bind of its own: mounted at the console's POST /mcp, so this is the console's port
runs_on: container
requires_tcc: []
discovery: eager         # 21 tools — one over the PoC-17 lazy-load guidance (>20 tools / >5k definition tokens); noted, not acted on, in this PR
degrades: absent
exposes:
  - name: capture
    description: Drop a note or file into the inbox as a proposal (source_agent stamped from the credential)
  - name: report
    description: Submit a finding/decision/gotcha as a `report` proposal — idempotent on idempotency_key, same-title-within-24h suppressed
  - name: tasks_list_ready
    description: Unblocked, unclaimed tasks in the caller's projects
  - name: tasks_claim
    description: Atomically claim a task (assignee + status + lease in one operation)
  - name: tasks_heartbeat
    description: Renew the lease on a held task
  - name: tasks_update
    description: Change status or append a note on a held task
  - name: tasks_release
    description: Hand a held task back to the list
  - name: tasks_create
    description: Create a task in one of the caller's projects (idempotent on idempotency_key)
  - name: tasks_mine
    description: Everything the caller currently holds
  - name: knowledge_search
    description: Search the knowledge index (titles + one-line descriptions) within the caller's grant tier
  - name: knowledge_read
    description: Read one settled note under a granted Knowledge/ area prefix (returns its sha256 for compare-and-swap)
  - name: knowledge_write
    description: Write one note under Knowledge/ as a commit in the caller's name via the vault bridge — internal (assistant) principals only; provenance stamped; CAS on expected_sha256; protected paths refused at the vault; no delete/rename
  - name: artifact_publish
    description: Publish a version of an artifact into one of the caller's projects (compare-and-swap on the current version, idempotent on idempotency_key); returns artifact/version/review links
  - name: artifact_get
    description: One artifact in the caller's projects — a version with its manifest, the version list, comment threads, links, optionally one text file's content
  - name: artifact_list
    description: Artifacts across the caller's projects
  - name: artifact_comment
    description: Comment on an exact version (optionally one file + opaque anchor) or reply to a thread root; agent-only exchanges past the cap demote the thread to the user
  - name: artifact_comment_resolve
    description: Resolve (or reopen) a thread root
  - name: artifact_dispatch_review
    description: Send a bundle of threads to another agent as one `review` task — inside the project freely, across the boundary as a proposal for the user
  - name: crew_dispatch
    description: Hand a brief to a named crew (agents/<area>/<name>.md) as a durable work row the assistant container runs locally — brief checked against the crew's scope ∩ the local target's data policy first; internal (assistant) principals only
  - name: queries_list
    description: List the named queries available on this instance (invariant 3's one read path) — name, description, and each param's type + default
  - name: queries_run
    description: Run one named query by name with optional params, rows capped at 200; internal principals always, external agents only with a `queries` grant

# Seeded default (D4 overlay: an instance file of the same name wins).
name: aws_costs_recent
description: Daily AWS spend by service over the trailing window (aws-costs collector)
params:
  days: { type: int, default: 30 }
sql: |
  SELECT ts::date AS day, labels->>'service' AS service, value AS usd
  FROM metrics
  WHERE name = 'aws.cost_usd' AND ts >= current_date - (:days)::int
  ORDER BY day DESC, usd DESC
cache_ttl: 300

# Seeded default (D4 overlay: an instance file of the same name wins).
name: projects_rollup
description: One row per project (plan §4.19 "Multi-agent projects", §4.21 controls) for the dashboard panel and GET /api/projects — mode (the kill switch), budget and cap, members (agents whose projects include it, or an internal agent with no list = every project), open tasks, review bundles in flight / queued, open comment threads, pending review proposals, today's spend from runs, last activity.
params:
  limit: { type: int, default: 50 }
sql: |
  SELECT p.id, p.title, p.area, p.mode, p.daily_budget_usd, p.max_open_bundles, p.created_at, p.updated_at,
         (SELECT coalesce(array_agg(a.id ORDER BY a.id), '{}'::text[]) FROM agents a
           WHERE a.revoked_at IS NULL AND (p.id = ANY(a.projects) OR (a.kind = 'internal' AND a.projects = '{}'))) AS members,
         (SELECT count(*) FROM work w WHERE w.project = p.id AND w.kind <> 'review' AND w.status <> 'closed') AS open_tasks,
         (SELECT count(*) FROM work w WHERE w.project = p.id AND w.kind = 'review' AND w.status IN ('open', 'in_progress')) AS bundles_in_flight,
         (SELECT count(*) FROM work w WHERE w.project = p.id AND w.kind = 'review' AND w.status = 'blocked' AND w.claimed_by IS NULL) AS bundles_queued,
         (SELECT count(*) FROM artifact_comments c JOIN artifacts a ON a.id = c.artifact_id
           WHERE a.project = p.id AND c.parent_id IS NULL AND c.state = 'open') AS open_threads,
         (SELECT count(*) FROM proposals pr WHERE pr.decision = 'pending' AND pr.kind = 'review' AND pr.payload->>'project' = p.id) AS pending_reviews,
         (SELECT coalesce(sum(r.cost_usd), 0) FROM runs r
           WHERE r.ts >= date_trunc('day', now()) AND r.cost_usd IS NOT NULL
             AND (r.meta->>'project' = p.id OR r.component IN (SELECT a.id FROM agents a WHERE p.id = ANY(a.projects)))) AS spend_today_usd,
         greatest(p.updated_at,
                  (SELECT max(w.updated_at) FROM work w WHERE w.project = p.id),
                  (SELECT max(a.updated_at) FROM artifacts a WHERE a.project = p.id),
                  (SELECT max(a.last_seen_at) FROM agents a WHERE p.id = ANY(a.projects))) AS last_activity
  FROM projects p
  ORDER BY last_activity DESC NULLS LAST, p.id ASC
  LIMIT :limit
cache_ttl: 0  # the panel must show a toggle the instant it lands; the query is a handful of indexed counts


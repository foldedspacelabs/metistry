# iCloud Calendar — a known service over the CalDAV provider (plan §2.6, §4
# Q7; T4-13). Sign in with an app-specific password made at
# account.apple.com (Sign-In and Security → App-Specific Passwords) — never
# the Apple Account's own password — and the Apple Account's email as the
# username:
#
#   metistry secrets set icloud_app_password            (the value on stdin)
#   metistry secrets hosts icloud_app_password caldav.icloud.com
#   metistry secrets grant icloud_app_password connection:icloud on
#   metistry connections add icloud --type calendar --provider icloud-calendar \
#     --url https://caldav.icloud.com/ \
#     --auth basic --username you@icloud.com --secret icloud_app_password --no-discover
#   metistry secrets sync --to env                      (then restart the console)
#
# iCloud keeps each account's calendars on a numbered host
# (p<NN>-caldav.icloud.com). The connection reaches one origin only, so the
# first sync names that host and stops, sending it nothing: point the
# connection at it (`metistry connections set icloud --url
# https://p<NN>-caldav.icloud.com/`) and list it on the secret (`metistry
# secrets hosts icloud_app_password p<NN>-caldav.icloud.com`). A connection of
# this type anywhere but iCloud's hosts is refused.
schema: 1
name: icloud-calendar
type: connection-type
description: iCloud Calendar over CalDAV with an app-specific password — your events on Today, and replies to invitations from Metistry.
provides: calendar
transports: [http]
fields:
  - key: server
    kind: url
    label: Server
    help: Where discovery starts. iCloud may name a numbered host (p<NN>-caldav.icloud.com) for your account; the connection then points there.
    required: false
    default: https://caldav.icloud.com/
capabilities: [read, write_own, rsvp]
sync: caldav-calendar
implementation: { kind: builtin, module: caldav }

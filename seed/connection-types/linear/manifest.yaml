# The Linear connection type (plan §2.6, §4 Q22; T4-24) — the first `tracker`
# provider. A connection of this type is added with
#
#   metistry secrets set linear_api_key                 (the value on stdin)
#   metistry secrets hosts linear_api_key api.linear.app
#   metistry secrets grant linear_api_key connection:linear on
#   metistry connections add linear --type tracker --provider linear \
#     --url https://api.linear.app/graphql \
#     --auth api_key --auth-header Authorization --secret linear_api_key --no-discover
#
# and read by the `linear` sync (collectors/linear/), which reconciles the
# issues assigned to the key's own user into `work` and raises a `task`
# request for each (docs/ops/connections.md, *Linear*).
#
# The key is a personal API key sent as `Authorization: <API_KEY>` — no
# Bearer (Linear, *GraphQL*). It is a secret of the connection, filled at the
# egress door for api.linear.app only; the provider (packages/connections,
# `linear.ts`) reaches https://api.linear.app and nothing else, and follows
# no redirect.
#
# `read` is the sync's. `create` is *Send to Linear* (T4-25): the owner's door
# `POST /api/trackers/<connection>/issues` files one issue per task, through
# one fixed mutation (packages/connections `linear-issue.ts`). `complete` is
# *Close <KEY> in Linear* (T4-26) on a ticked `linear:` task, through
# `POST /api/trackers/<connection>/issues/<KEY>/complete`. Its tool,
# `complete_issue`, is the owner's setting — Allow (the client closes it on
# every tick) · Ask First (the default: the client offers it) · Never (the
# door refuses) — set with
#
#   metistry connections policy linear complete_issue allow|ask|never
schema: 1
name: linear
type: connection-type
description: Linear — the issues assigned to you, on the Board as work and in Needs You as tasks. A personal API key, sent to api.linear.app only.
provides: tracker
transports: [http]
capabilities: [read, create, complete]
tools:
  complete_issue:
    group: changes
    description: Close an issue in Linear — moves it to its team's first completed state. Offered when you tick a task that carries its linear:<KEY>.
sync: linear
implementation: { kind: builtin, module: linear }

# Seeded default (D4 overlay: an instance file of the same name wins).
#
# The timeline (docs/research/2026-09-16-taskuary-review.md ADOPT 1). A
# capture used to be INVISIBLE until the `*/5` drain turned it into a
# proposal — the loop's only accidental latency, and the one thing Taskuary's
# funnel does that this union did not. The row already exists the instant the
# capture lands, so showing it costs nothing: store the arrival, show it
# wearing its own `status`, classify after. The `inbox` branch below is that.
#
# `kind` filters the stream. It matches either the exact row kind or the
# coarser `group` the SQL derives (capture | proposal | decision | run | work
# | message | routine), so the console's chips read ONE closed vocabulary
# decided here rather than each surface keeping its own copy of the kind list.
# Seven groups and All are the eight chips (screen-02-activity.md §3).
#
# `routine` is the seventh group (C43, ruled 2026-09-20): a routine ran
# because the clock said so, not because somebody asked, so it is not folded
# into `run`. A routine row is shown by what its `runs` row says happened,
# read from BOTH places that say it (T1-4): a failed run (`ok = false`) carries
# no `meta.outcome` at all — the runner's catch writes only `error` — so a
# failure is read from `ok`/`error`; a settled one from `meta.outcome`
# (`acted | silent | skipped:<reason>`). `silent` — a tick that found nothing
# to do — is no row: a timeline that reports every tick of a scheduler is one
# nobody reads (§12.3). A row still in flight (`ok` NULL) is no row either,
# and a routine row is dated by when it SETTLED (`finished_at`), not when it
# started: a silent tick would otherwise appear and then vanish, and a long
# run that settles after newer rows were painted would fall behind `since`
# and never be fetched.
#
# `ok` is on every row: the run's own `ok` for a `runs` row (false = it
# failed, and the glyph — not the row — says so), NULL for the sources that
# have no notion of failing (a capture, a proposal, a decision, a work entry,
# a message). Failure is a column, never prose to regex out of `detail` (C19).
#
# `turn_id` filters to the calls one reply made, so a turn's disclosure can
# fetch all of them rather than only those inside the window's `limit`
# (screen-02-activity.md §6 fault 6).
#
# `since` is the incremental-refresh param: hand back the newest `ts` already
# rendered and get the rows at or after it. Inclusive on purpose — two rows
# can share a microsecond across two branches, and a strict `>` would drop
# the second of them forever. The caller de-duplicates on (ref, ts, kind),
# which is cheap; losing an event is not.
name: activity_feed
description: Time-ordered "what happened" across the system (docs/product/desktop-app-plan.md "The window" — home panel) — a union of inbox captures, runs (tool/turn/crew_run/dispatch/task_op/agent_admin/project_mode/config_write/connection_call, plus collector_run failures only, plus settled routine_run rows except silent ticks), proposals (created + decided), work.history entries, and outbound_messages (brief/review/alert). Filterable by agent/project/kind/turn_id; `since` returns only what is at or after a timestamp already seen. The weekly review is this feed summarised. `ok` is false where a run failed, NULL where the source cannot fail. `turn_id` (mcp-brain tool calls only; null elsewhere) groups the calls one reply made.
params:
  hours:   { type: int,  default: 24 }
  limit:   { type: int,  default: 100 }
  agent:   { type: text, default: "" }   # blank = every actor
  project: { type: text, default: "" }   # blank = every project
  kind:    { type: text, default: "" }   # blank = every kind; an exact row kind, or one group name
  since:   { type: text, default: "" }   # blank = the whole window; else a timestamptz text — rows AT or after it
  turn_id: { type: text, default: "" }   # blank = every row; else only the rows one reply made
sql: |
  WITH feed AS (
    -- A capture, the instant it lands — before any classifier has looked at
    -- it. `status` is the pill: `new` is still waiting on the drain,
    -- `classified` already has a proposal behind it.
    SELECT
      i.ts,
      'capture'                                                                           AS kind,
      coalesce(i.source_agent, i.source)                                                  AS actor,
      coalesce(
        nullif(btrim(split_part(regexp_replace(coalesce(i.note, ''), '^---.*?\n---\n', '', 's'), E'\n', 1)), ''),
        regexp_replace(i.path, '^.*/', '')
      )                                                                                   AS subject,
      concat_ws(' · ', i.source, i.status)                                                AS detail,
      'inbox:' || i.id                                                                    AS ref,
      NULL::text                                                                          AS proj,
      NULL::text                                                                          AS turn_id,
      NULL::boolean                                                                       AS ok,
      'capture'                                                                           AS grp
    FROM inbox i
    WHERE i.ts > now() - make_interval(hours => (:hours)::int)

    UNION ALL

    SELECT
      -- a routine row is dated by when it settled (the header says why)
      CASE WHEN r.kind = 'routine_run' THEN coalesce(r.finished_at, r.ts) ELSE r.ts END AS ts,
      r.kind                                                                            AS kind,
      -- a config write is the principal's act, not the bridge's: the
      -- reconciler records it (T2-16), `user` made it
      CASE WHEN r.kind = 'config_write' THEN coalesce(r.meta->>'principal', r.component) ELSE r.component END AS actor,
      CASE
        WHEN r.kind IN ('tool', 'dispatch')  THEN r.tool
        WHEN r.kind = 'connection_call'      THEN concat_ws('/', r.meta->>'connection', r.meta->>'connection_tool')
        WHEN r.kind = 'config_write'         THEN r.meta->>'path'
        WHEN r.kind = 'task_op'              THEN 'work:' || (r.meta->>'id')
        WHEN r.kind = 'agent_admin'          THEN r.meta->>'agent'
        WHEN r.kind = 'project_mode'         THEN r.meta->>'project'
        -- the display name, not the raw component id (Ruling 25, X-21): the
        -- runner stamps `meta.display_name` on every routine_run row from
        -- the manifest it already has loaded (apps/console/src/runner.ts,
        -- close-day.ts) — this query has no manifest of its own to read.
        -- `coalesce` is only for a row written before that stamp existed:
        -- the same identifier-to-title fallback the console's own `titleOf`
        -- gives a New Routine with no manifest, so an old row still reads as
        -- a name instead of a raw slug, never the true configured one
        WHEN r.kind = 'routine_run'          THEN coalesce(r.meta->>'display_name', initcap(replace(r.component, '-', ' ')))
        ELSE r.kind
      END                                                                                 AS subject,
      CASE
        WHEN r.kind = 'tool'          THEN concat_ws(' ', 'called', r.tool, CASE WHEN r.ok = false THEN '(failed)' END)
        -- never args or a secret value (U2/Ruling 28): only the connection
        -- name and the upstream tool it named, both of which `meta` already
        -- carries at the top level (server.ts's `wrap`) — the same fields
        -- `connection_calls` reads, never `meta.args`.
        WHEN r.kind = 'connection_call' THEN concat_ws(' ', 'called', r.meta->>'connection_tool', 'on', r.meta->>'connection', CASE WHEN r.ok = false THEN '(failed)' END)
        WHEN r.kind = 'turn'          THEN concat_ws(' ', 'turn', r.model, CASE WHEN r.cost_usd IS NOT NULL THEN '$' || r.cost_usd::text END)
        WHEN r.kind = 'crew_run'      THEN concat_ws(' ', 'crew run', r.model, CASE WHEN r.ok = false THEN 'failed: ' || coalesce(r.error, '') ELSE 'ok' END)
        WHEN r.kind = 'dispatch'      THEN concat_ws(' ', 'dispatched to', r.tool, CASE WHEN r.ok = false THEN 'refused: ' || coalesce(r.error, '') ELSE 'ok' END)
        WHEN r.kind = 'task_op'       THEN concat_ws(' ', r.meta->>'op', 'work #' || (r.meta->>'id'))
        WHEN r.kind = 'agent_admin'   THEN concat_ws(' ', r.meta->>'op', r.meta->>'agent')
        WHEN r.kind = 'project_mode'  THEN concat_ws(' ', r.meta->>'from', '->', r.meta->>'to', coalesce(r.meta->>'reason', ''))
        WHEN r.kind = 'collector_run' THEN concat_ws(' ', 'collector failed', coalesce(r.error, ''))
        WHEN r.kind = 'config_write'  THEN coalesce(r.meta->>'message', concat_ws(' ', r.meta->>'op', r.meta->>'path'))
        -- failure from `ok`/`error` (a failed run has no outcome); a skip
        -- names its reason and why; what it acted on is the path it wrote
        -- when it names one, else the count the runner recorded
        WHEN r.kind = 'routine_run'   THEN CASE
          WHEN r.ok = false                            THEN concat_ws(' ', 'routine failed', coalesce(r.error, ''))
          WHEN r.meta->>'outcome' LIKE 'skipped:%'     THEN concat_ws(' — ', 'skipped: ' || substr(r.meta->>'outcome', 9), r.meta->>'why')
          ELSE coalesce(r.meta->>'path', concat_ws(' ', 'ran', CASE WHEN r.meta ? 'processed' THEN '· ' || (r.meta->>'processed') || ' processed' END))
        END
        ELSE coalesce(r.error, '')
      END                                                                                 AS detail,
      'runs:' || r.id                                                                     AS ref,
      r.meta->>'project'                                                                  AS proj,
      r.meta->>'turn_id'                                                                  AS turn_id,
      r.ok                                                                                AS ok,
      CASE
        WHEN r.kind = 'task_op'      THEN 'work'
        WHEN r.kind = 'routine_run'  THEN 'routine'
        ELSE 'run'   -- config_write included: a protected write is on the ledger (T2-16); connection_call too (Ruling 28, X-23)
      END                                                                                 AS grp
    FROM runs r
    WHERE r.ts > now() - make_interval(hours => (:hours)::int)
      AND (
        r.kind IN ('tool', 'turn', 'crew_run', 'dispatch', 'task_op', 'agent_admin', 'project_mode', 'config_write', 'connection_call')
        OR (r.kind = 'collector_run' AND r.ok = false)
        -- settled only (NULL `ok` is in flight), and never a silent tick.
        -- IS DISTINCT FROM, not <>: a row with no outcome (a failure, or one
        -- written before T1-4) would compare NULL and silently vanish
        OR (r.kind = 'routine_run' AND r.ok IS NOT NULL AND (r.ok = false OR r.meta->>'outcome' IS DISTINCT FROM 'silent'))
      )

    UNION ALL

    SELECT
      p.ts,
      'proposal_created'                                                                 AS kind,
      p.source_agent                                                                      AS actor,
      p.kind                                                                               AS subject,
      coalesce(p.payload->>'title', p.payload->>'reason', p.kind)                          AS detail,
      'proposals:' || p.id                                                                 AS ref,
      p.payload->>'project'                                                                AS proj,
      NULL::text                                                                            AS turn_id,
      NULL::boolean                                                                         AS ok,
      'proposal'                                                                            AS grp
    FROM proposals p
    WHERE p.ts > now() - make_interval(hours => (:hours)::int)

    UNION ALL

    -- A decision event: what was asked, what was answered, and by whom. The
    -- "whom" is not guessed and not a column — the decision route is
    -- gated on the `user` principal, so every decision but `expired` (the
    -- morning brief's auto-expiry, which is nobody's), `auto` (an action an
    -- agent was allowed to run within its scope, docs/ops/actions.md) and
    -- `resolved_at_source` (a mirror whose source changed — the PR merged,
    -- the invite answered elsewhere — closed by `resolveAtSource`, T1-8,
    -- packages/core/src/mirrors.ts) is the owner's hand. A mirror's receipt
    -- (`payload.cleared.what`, T4-23 — "You approved it on GitHub") says what
    -- happened there.
    SELECT
      p.decided_at                                                                        AS ts,
      'proposal_decided'                                                                  AS kind,
      p.source_agent                                                                      AS actor,
      p.kind                                                                               AS subject,
      CASE
        WHEN p.decision = 'expired' THEN 'auto-expired — nobody decided it'
        WHEN p.decision = 'auto' THEN concat_ws(' ', 'ran within its autonomy:', p.payload->'action'->>'kind')
        WHEN p.decision = 'resolved_at_source' THEN 'resolved at its source' || coalesce(' (' || (p.source->>'kind') || ')', '') || coalesce(': ' || (p.payload->'cleared'->>'what'), '') || ' — nobody decided it here'
        ELSE concat_ws(': ', 'you decided ' || p.decision, p.feedback)
      END                                                                                   AS detail,
      'proposals:' || p.id                                                                 AS ref,
      p.payload->>'project'                                                                AS proj,
      NULL::text                                                                            AS turn_id,
      NULL::boolean                                                                         AS ok,
      'decision'                                                                            AS grp
    FROM proposals p
    WHERE p.decided_at IS NOT NULL
      AND p.decision <> 'pending'
      AND p.decided_at > now() - make_interval(hours => (:hours)::int)

    UNION ALL

    SELECT
      (h->>'ts')::timestamptz                                                             AS ts,
      'work_history'                                                                      AS kind,
      h->>'agent'                                                                          AS actor,
      w.title                                                                              AS subject,
      concat_ws(' ', h->>'op', CASE WHEN h->>'status' IS NOT NULL THEN '-> ' || (h->>'status') END, h->>'note') AS detail,
      'work:' || w.id                                                                      AS ref,
      w.project                                                                            AS proj,
      NULL::text                                                                            AS turn_id,
      NULL::boolean                                                                         AS ok,
      'work'                                                                                AS grp
    FROM work w
    CROSS JOIN LATERAL jsonb_array_elements(w.history) AS h
    WHERE (h->>'ts')::timestamptz > now() - make_interval(hours => (:hours)::int)

    UNION ALL

    SELECT
      m.ts,
      m.kind                                                                               AS kind,
      'assistant'                                                                          AS actor,
      m.kind                                                                               AS subject,
      m.text                                                                                AS detail,
      'outbound_messages:' || m.id                                                          AS ref,
      NULL::text                                                                            AS proj,
      NULL::text                                                                            AS turn_id,
      NULL::boolean                                                                         AS ok,
      'message'                                                                             AS grp
    FROM outbound_messages m
    WHERE m.kind IN ('brief', 'review', 'alert')
      AND m.ts > now() - make_interval(hours => (:hours)::int)
  )
  SELECT ts, kind, "group", actor, subject, left(detail, 200) AS detail, ref, turn_id, ok
  FROM (SELECT f.*, f.grp AS "group" FROM feed f) g
  WHERE (:agent = '' OR actor = :agent)
    AND (:project = '' OR proj = :project)
    AND (:kind = '' OR kind = :kind OR grp = :kind)
    AND (:turn_id = '' OR turn_id = :turn_id)
    -- a blank `since` casts to NULL, never to an error: nullif before the cast
    AND (ts >= coalesce(nullif(:since::text, '')::timestamptz, '-infinity'::timestamptz))
  ORDER BY ts DESC
  LIMIT :limit
cache_ttl: 0

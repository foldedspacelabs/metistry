# Seeded default (D4 overlay: an instance file of the same name wins).
#
# C82's rename: `projects_overview` groups `work` by area, but "Projects"
# already names the per-project rollup with modes, budgets and a cap
# (`projects_rollup`, migration 0011) — same word, two groupings, only one
# with controls. This query is `projects_overview` under the right name; the
# SQL is unchanged. `projects_overview` itself stays loaded as an alias for
# one release (docs/product/design-build-plan.md §2.10) so nothing that
# still asks for it by the old name breaks — remove it once that release
# ships.
name: areas_overview
description: Per-area rollup of the work table for the dashboard Areas panel — open / in progress / blocked counts, closed in the last 7 days, and the latest open titles. Same aggregation as the morning brief's Areas section. (C82's rename of `projects_overview`, kept as an alias for one release.)
params:
  limit: { type: int, default: 12 }
sql: |
  SELECT area,
         count(*) FILTER (WHERE status <> 'closed')       AS open,
         count(*) FILTER (WHERE status = 'in_progress')   AS in_progress,
         count(*) FILTER (WHERE status = 'blocked')       AS blocked,
         count(*) FILTER (WHERE status = 'closed' AND updated_at > now() - interval '7 days') AS closed_7d,
         (array_agg(title ORDER BY updated_at DESC) FILTER (WHERE status <> 'closed'))[1:3] AS latest,
         max(updated_at) AS updated_at
  FROM work
  WHERE area IS NOT NULL
  GROUP BY area
  ORDER BY open DESC, area ASC
  LIMIT :limit
cache_ttl: 60

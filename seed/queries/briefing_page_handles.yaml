# Seeded default (D4 overlay: an instance file of the same name wins).
#
# The handles around one page, for the session-start briefing (research
# docs/research/2026-10-04-context-mode-review.md §5–§6 CM-1; ticket X-128;
# ruled 2026-10-04, Context Mode Q1: handles plus the owner's text). Given a
# project page (`project_for_repo`, X-130), three kinds of row, each a
# HANDLE — path, title, the fold's day, and the note's sha256 as the index
# last read it — and nothing of any note's body:
#
#   * `self`  — the page itself, so the briefing can carry its sha256.
#   * `link`  — every page the project page links TO (wikilink, frontmatter
#               or embed), the owner's own map of what belongs with it.
#   * `fold`  — every evening fold (`Journal/Fold/YYYY-MM-DD.md`, the
#               assistant's note) that links to the page: "the latest fold
#               lines naming it", as handles, newest day first. A fold's
#               prose never travels here — a fold is the assistant's
#               writing, and the ruling keeps it to a handle.
#
# Never a draft, never an unsettled conflict, on either end of an edge
# (`knowledge_pages.yaml`'s rule). `sha256` is `knowledge_files.content_hash`.
# The title and the description of a LINKED page are not the owner's proven
# words — a page the fold created carries its own `source:` — so no
# description is selected for a link or a fold; the project page's own
# description is `project_for_repo`'s to return, because that query resolves
# only a page the user owns.
#
# **`expose: route`**, on `knowledge_pages.yaml`'s rule (ruled 2026-09-19):
# every row is a vault path and a title. The generic `/api/q/<name>` and
# `queries_run` answer this name with the unknown-query refusal, so a
# `queries: true` grant is not a way to walk the owner's link graph. The
# consumer is `GET /api/briefing` (apps/console/src/briefing-route.ts), which
# judges every path here against the caller's grant (core's `mayListPath` /
# `mayReadPath`) before it names one.
#
# Order: `self`, then `link` rows by path in BYTE order, then `fold` rows by
# path DESCENDING (the day is in the name, so newest first). `limit` bounds
# the links and the folds each; the briefing clips again to its own caps.
name: briefing_page_handles
expose: route
description: >-
  The handles around one vault page for the session-start briefing:
  `relation` (`self` | `link` | `fold`), `path`, `title`, `date` (a fold's
  day, else null) and `sha256` (the note's content hash as indexed). `self`
  is the page; `link` every settled page it links to; `fold` every settled
  `Journal/Fold/` note that links to it, newest first. Never a draft or a
  conflict; never a body. A blank `path` matches no page and returns no rows.
params:
  path: { type: text, default: "" } # the project page (Projects/<Name>.md); blank = no page, so no rows
  limit: { type: int, default: 20 } # links shown at most, and folds shown at most (each)
sql: |
  WITH me AS (
    SELECT k.path, COALESCE(k.title, regexp_replace(k.path, '^.*/|\.md$', '', 'g')) AS title, k.content_hash
    FROM knowledge_files k
    WHERE k.path = NULLIF(:path::text, '')
      AND NOT k.draft
      AND k.status <> 'conflict'
  ),
  bound AS (
    SELECT GREATEST(0, LEAST(:limit, 200)) AS n
  ),
  links AS (
    SELECT l.to_path AS path
    FROM knowledge_links l
    JOIN me ON l.from_path = me.path
    JOIN knowledge_files t ON t.path = l.to_path AND NOT t.draft AND t.status <> 'conflict'
    WHERE l.to_path <> me.path
    GROUP BY l.to_path
    ORDER BY l.to_path COLLATE "C"
    LIMIT (SELECT n FROM bound)
  ),
  folds AS (
    SELECT l.from_path AS path
    FROM knowledge_links l
    JOIN me ON l.to_path = me.path
    JOIN knowledge_files t ON t.path = l.from_path AND NOT t.draft AND t.status <> 'conflict'
    WHERE l.from_path ~ '^Journal/Fold/[0-9]{4}-[0-9]{2}-[0-9]{2}\.md$'
    GROUP BY l.from_path
    ORDER BY l.from_path COLLATE "C" DESC
    LIMIT (SELECT n FROM bound)
  ),
  handle AS (
    SELECT 'self'::text AS relation, me.path, me.title, NULL::text AS date, me.content_hash AS sha256, 0 AS ord
    FROM me
    UNION ALL
    SELECT 'link', k.path, COALESCE(k.title, regexp_replace(k.path, '^.*/|\.md$', '', 'g')), NULL, k.content_hash, 1
    FROM links x JOIN knowledge_files k ON k.path = x.path
    UNION ALL
    SELECT 'fold', k.path, COALESCE(k.title, regexp_replace(k.path, '^.*/|\.md$', '', 'g')), substr(k.path, 14, 10), k.content_hash, 2
    FROM folds x JOIN knowledge_files k ON k.path = x.path
  )
  SELECT h.relation, h.path, h.title, h.date, h.sha256
  FROM handle h
  ORDER BY h.ord,
           CASE WHEN h.ord = 2 THEN NULL ELSE h.path END COLLATE "C",
           CASE WHEN h.ord = 2 THEN h.path END COLLATE "C" DESC
cache_ttl: 0 # the graph moves with every walk; a cached link is one the owner just removed

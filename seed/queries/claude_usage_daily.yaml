# Seeded default (D4 overlay: an instance file of the same name wins).
name: claude_usage_daily
description: Assistant token use, API-equivalent cost, and prompt-cache hit rate per day and model tier (claude-usage collector). On a subscription, cost is headroom consumed, not money billed.
params:
  days: { type: int, default: 30 }
sql: |
  WITH agg AS (
    SELECT ts::date AS day, labels->>'model' AS model, (labels->>'turns')::int AS turns,
           max(value) FILTER (WHERE name = 'claude.tokens_in')   AS tokens_in,
           max(value) FILTER (WHERE name = 'claude.tokens_out')  AS tokens_out,
           max(value) FILTER (WHERE name = 'claude.cost_usd')    AS cost_usd,
           max(value) FILTER (WHERE name = 'claude.cache_read')  AS cache_read,
           max(value) FILTER (WHERE name = 'claude.cache_write') AS cache_write
    FROM metrics
    WHERE name LIKE 'claude.%' AND ts >= current_date - (:days)::int
    GROUP BY 1, 2, 3
  )
  SELECT day, model, turns, tokens_in, tokens_out, cost_usd, cache_read, cache_write,
         CASE WHEN coalesce(cache_read, 0) + coalesce(tokens_in, 0) + coalesce(cache_write, 0) > 0
              THEN cache_read / (coalesce(cache_read, 0) + coalesce(tokens_in, 0) + coalesce(cache_write, 0))
              ELSE NULL END AS cache_hit_rate
  FROM agg
  ORDER BY day DESC, cost_usd DESC
cache_ttl: 300

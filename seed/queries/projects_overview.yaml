# Seeded default (D4 overlay: an instance file of the same name wins).
#
# C82: renamed to `areas_overview` (identical SQL — see that file). This name
# stays loaded as an alias for one release so a caller still asking for it by
# the old name gets the same rows; remove it once that release ships.
name: projects_overview
description: Per-area rollup of the work table — open / in progress / blocked counts, closed in the last 7 days, and the latest open titles. Deprecated alias for `areas_overview` (C82); kept for one release, identical rows.
params:
  limit: { type: int, default: 12 }
sql: |
  SELECT area,
         count(*) FILTER (WHERE status <> 'closed')       AS open,
         count(*) FILTER (WHERE status = 'in_progress')   AS in_progress,
         count(*) FILTER (WHERE status = 'blocked')       AS blocked,
         count(*) FILTER (WHERE status = 'closed' AND updated_at > now() - interval '7 days') AS closed_7d,
         (array_agg(title ORDER BY updated_at DESC) FILTER (WHERE status <> 'closed'))[1:3] AS latest,
         max(updated_at) AS updated_at
  FROM work
  WHERE area IS NOT NULL
  GROUP BY area
  ORDER BY open DESC, area ASC
  LIMIT :limit
cache_ttl: 60

# Seeded default (D4 overlay: an instance file of the same name wins).
#
# One scheduled component's runs, newest first (§2.10; the Scheduled doors,
# T3-3, read it for `GET /api/scheduled`'s last run and for
# `GET /api/scheduled/{routines,syncs}/:name`'s history). Every row the runner
# or the component itself wrote as its OWN kind — `routine_run` for a routine,
# `collector_run` for a sync or a collector that presents as a routine (Inbox
# Sort, Usage Rollup) — for that component name: the runner's generic row per
# run (`apps/console/src/runner.ts`), a refused schedule's once-a-day row, and
# a routine's own detailed row where it writes one (`plan-tomorrow`,
# `knowledge-fold`: "a settled date is never nothing"). The runner's own
# bookkeeping (`kind = 'runner'`: held, blocked, a streak) is not the
# component's history and is not here. Names are unique across the two kinds
# (one entry per component, §2.5), so the name alone picks the rows.
#
# `outcome` is `meta.outcome` (T1-4's shared vocabulary — acted | silent |
# skipped:<reason> — every routine and the runner write it the same way, so
# this reads it exactly as `activity_feed` does, never a second mapping). A
# collector's row carries none: NULL.
#
# `steps` is `meta.processed` — the generic count the runner's own row
# already carries (`{ processed: n, … }`). A routine's own detailed row
# (plan-tomorrow, knowledge-fold) carries no `processed` and reports
# `steps: NULL` — an honest "not counted", never a false zero.
#
# `trigger` is `meta.trigger`: `run_now` for a run the owner asked for from
# Scheduled (T3-3), NULL for one the schedule started.
#
# `expose: route`. A routine's history is the owner's Scheduled screen; there
# is no reason for the generic `/api/q/routine_history` or an agent's
# `queries_run` to read another routine's run history by name.
name: routine_history
expose: route
description: >-
  One routine's or sync's runs, newest first: when it ran, what it decided
  (meta.outcome — acted | silent | skipped:<reason>, T1-4), whether it
  failed and why, what it cost, and how many steps it took (meta.processed —
  the count the runner's own tick already writes; a routine's own detailed
  row carries no count and reports NULL rather than a false zero). Scheduled's
  per-routine history.
params:
  component: { type: text, default: "" } # blank matches no row, so the default is the empty case
  limit:     { type: int,  default: 50 }
sql: |
  SELECT
    r.id,
    r.ts,
    r.started_at,
    r.finished_at,
    r.ok,
    r.error,
    r.cost_usd,
    r.meta ->> 'outcome'            AS outcome,
    (r.meta ->> 'processed')::int   AS steps,
    r.meta ->> 'trigger'            AS trigger
  FROM runs r
  WHERE r.kind IN ('routine_run', 'collector_run') AND r.component = (:component)::text
  ORDER BY r.ts DESC
  LIMIT (:limit)::int
cache_ttl: 0

# Seeded default (D4 overlay: an instance file of the same name wins).
#
# *Last used* for the Secrets list (design-build-plan §2.14; `GET /api/secrets`,
# T4-1): per secret NAME, the newest `runs` row that filled it in. The egress
# fill (T4-2) stamps the names it filled on its run as `meta.secrets` — a JSON
# array of names, never a value (core's `SECRET_USE_META_KEY`) — and this reads
# them back, through the one read path into state (invariant 3).
#
# Postgres is derived (invariant 1): lose the ledger and every secret reads
# "never used" until its next use, which is the honest answer.
#
# `meta.secrets` that is not an array is skipped rather than an error: the
# ledger is written by many components, and one malformed row must not take
# the whole list down. A name that has never been filled in returns no row;
# the route reads that as `last_used: null`.
#
# **`expose: route`.** The rows say which credentials this instance used and
# when — the owner's to read on the Secrets screen, not a generic
# `/api/q/secret_last_used` or `queries_run` answer for an agent.
name: secret_last_used
expose: route
description: >-
  Per secret name, the newest `runs.ts` whose `meta.secrets` (the names a run
  filled in at egress — never a value) includes it. Names never filled in
  return no row.
params: {}
sql: |
  SELECT s.name AS name, max(r.ts) AS last_used
  FROM runs r
  CROSS JOIN LATERAL jsonb_array_elements_text(
    CASE WHEN jsonb_typeof(r.meta -> 'secrets') = 'array' THEN r.meta -> 'secrets' END
  ) AS s(name)
  WHERE r.meta ? 'secrets'
  GROUP BY s.name
  ORDER BY s.name

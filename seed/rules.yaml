# Router rules — instance config, seeded default (D4 overlay).
# The router is DETERMINISTIC (invariant 4): prefix, regex, and explicit
# commands only. First match wins; no match = the default model tier.
fast_path:
  - match: "^/(status|open)\\b"
    query: open_work
  - match: "^what('| i)?s (my |the )?(status|open work|workload)\\b"
    query: open_work

# A tier is a (model, effort) PAIR — cost research 2026-09-09, decision 2:
# a stronger model at low effort is often cheaper than a weaker one working
# hard, so the two are one choice. `effort` is low | medium | high (absent =
# medium). Name your own tiers here; `/model <tag>` and the composer's picker
# name THIS menu, and `default` must exist. Both the router and the assistant
# read this block, so an instance overlay (D4) moves both at once.
#
# Effort changes only at turn boundaries — one query per turn — because
# changing it mid-session breaks the cached prompt prefix.
tiers:
  fast:                 # short, mechanical asks you want answered now
    model: haiku
    effort: low
  default:              # bare text lands here
    model: haiku
    effort: medium
  deep:                 # /deep, and anything you want thought about
    model: opus
    effort: high
  routine:              # machine-enqueued turns (the evening fold): cheap by default
    model: haiku
    effort: low

commands:
  # /model <tag> and /deep are handled by the router itself (§4.1)
  deep_alias: deep

# The intent tier (PoC-20 phase 1, docs/ops/inbox.md). Commented out, and
# absent means OFF — which is the shipped behaviour and a supported install.
#
# What it does: a capture the deterministic rules could not place is scored,
# on-device, against a closed list of intents, and comes back with a
# confidence. THE MODEL DECIDES NOTHING. It says what the message looks like
# it says; the number below is what decides whether anything happens about
# that, and it lives here because this file is yours (docs/ops/compute.md).
#
# Two lines have to be true before a verdict moves anything:
#   * compute.yaml names the model — `assignments.intent.model`, which has to
#     be an on-machine provider, so the tier costs nothing;
#   * and this block names a threshold.
# Either one on its own does nothing, on purpose.
#
# DO NOT GUESS THE NUMBER. Label ~150-300 of your own messages and fit it:
#   metistry-eval intents .metistry/eval/intents.jsonl \
#     --base-url http://127.0.0.1:11434/v1 --model gemma4:e4b-it-qat --server ollama --fit
# It prints the threshold that meets the bar on YOUR messages, and the line to
# paste here. A threshold picked before seeing the data is the mistake the
# research warns about in as many words.
#
# intent:
#   min_confidence: 0.80
#   by_intent:
#     # Different consequences deserve different bars: a wrongly-filed note is
#     # a card you re-label, so it can sit lower than one that puts a task
#     # button under a capture.
#     task_create: 0.90

# The router's policy (docs/ops/dynamic-router.md). Commented out, and absent
# means OFF — which is the shipped behaviour and a supported install.
#
# What it does: the rules above always run first and always win. Only a
# message they leave on the default tier (and, as a counterfactual, one you
# sent with /deep, /model or the picker) is shown to this table, which picks
# an operation and a tier from lists YOU wrote, inside the caps YOU set. Every
# choice is recorded (`metistry compute route-report`), with no message text.
#
# `mode: shadow` (the default) records what it would have chosen and serves
# nothing. `mode: serve` makes its choice the route — for the rules'
# fall-through only; commands, the picker and budgets still win, and anything
# that fails takes today's route. Write `serve` only once the confirmatory eval
# (`metistry-eval complexity`) clears the bar you accepted — two weeks of
# shadow first, then the eval.
#
# `tiers:` is the allow-list, cheapest first, each a key of the `tiers:` block
# above. The table names tiers, never models. First matching row wins; a
# condition on a feature nobody could compute is false, so a row that reads
# `intent` or `complexity` simply skips while the local scorer is down. Rows
# reading `intent` need the `intent:` block above; rows reading `complexity`
# need `complexity.min_confidence`. Both are scored on-device by the model
# compute.yaml names in `assignments.intent`, and only when some row reads
# them. The numbers below are illustrations, not defaults — `caps` and
# `min_confidence` have none on purpose.
#
# policy:
#   mode: shadow
#   tiers: [fast, default, deep]
#   timeout_ms: 400
#   caps:
#     tool_calls: 12
#     tokens: 150000
#     cost_usd: 0.50
#   complexity:
#     min_confidence: 0.70     # fit it with the eval; do not guess it
#   table:
#     - id: status
#       when: { intent: [status_open_work, task_list], words: { max: 15 } }
#       then: { operation: "fast_path:open_work" }
#     - id: small-talk
#       when: { intent: smalltalk }
#       then: { operation: answer, tier: fast }
#     - id: the-record
#       when: { intent: knowledge_search }
#       then: { operation: "retrieve:knowledge", tier: default, tool_calls: 4 }
#     - id: struggling
#       when: { reask: true }
#       then: { operation: tools, tier: deep }
#     - id: by-complexity
#       when: { complexity: [simple, moderate, demanding] }
#       then: { operation: tools, tier: { simple: fast, moderate: default, demanding: deep } }
